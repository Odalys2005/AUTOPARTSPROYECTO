<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts | Nueva subcategoría</title>
    <style>
* { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .contenedor { max-width: 900px; margin: 0 auto; padding: 29px; }
        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .subtitulo {
            color: #ffbd35;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        h1 { margin: 0; font-size: 27px; }
        .descripcion { color: #a9a7ae; font-size: 13px; line-height: 1.5; }
        .icono {
            width: 47px;
            height: 47px;
            border: 1px solid #ee3642;
            border-radius: 12px;
            background: #5c111a;
            display: grid;
            place-items: center;
            font-size: 24px;
            color: #ffc42f;
            box-shadow: 0 0 20px #ca263044;
            flex-shrink: 0;
        }
        .panel {
            background: linear-gradient(145deg, #171418, #0e0e12);
            border: 1px solid #5a3139;
            border-radius: 14px;
            padding: 25px;
        }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 9px; }
        .campo { margin-bottom: 21px; }
        input, select {
            width: 100%;
            padding: 13px 14px;
            background: #111216;
            color: white;
            border: 1px solid #554c55;
            border-radius: 9px;
            font: inherit;
            outline: none;
        }
        input:focus, select:focus { border-color: #ff3d46; box-shadow: 0 0 10px #e41b303b; }
        input::placeholder { color: #85858f; }
        select:disabled { opacity: .6; }
        .ayuda { color: #898a94; font-size: 11px; margin-top: 7px; }
        .requerido { color: #ff4753; }
        .mensaje { color: #ffb64e; min-height: 18px; font-size: 12px; margin-bottom: 12px; }
        .acciones { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
        button { padding: 13px 23px; border-radius: 9px; font-weight: 700; border: 0; cursor: pointer; transition: .2s; }
        .cancelar { background: #242328; color: #e5e5e5; border: 1px solid #56535b; }
        .cancelar:hover { background: #353039; }
        .guardar {
            color: #140c0d;
            background: linear-gradient(105deg, #ff3543, #ffbd2b);
            box-shadow: 0 0 16px #e5233533;
        }
        .guardar:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-2px); }
        .guardar:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 500px) {
            .contenedor { padding: 17px; }
            .panel { padding: 18px; }
            .acciones { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div>
                <div class="subtitulo">AUTOPARTS · ADMINISTRACIÓN</div>
                <h1>Nueva subcategoría</h1>
                <p class="descripcion">Registra una subcategoría y asígnala a una categoría de repuestos.</p>
            </div>
            <div class="icono" aria-hidden="true">+</div>
        </div>

        <div class="panel">
            <form id="formSubcategoria">
                <div class="campo">
                    <label for="nombre">Nombre de la subcategoría <span class="requerido">*</span></label>
                    <input type="text" id="nombre" maxlength="120"
                           placeholder="Ej. Pastillas de freno" autocomplete="off" required>
                    <div class="ayuda">Nombre que identificará la subcategoría dentro del catálogo.</div>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría <span class="requerido">*</span></label>
                    <select id="categoria" required disabled>
                        <option value="">Cargando categorías...</option>
                    </select>
                    <div class="ayuda">Selecciona la categoría principal a la que pertenece.</div>
                </div>

                <div class="campo">
                    <label for="estado">Estado <span class="requerido">*</span></label>
                    <select id="estado" required disabled>
                        <option value="">Cargando estados...</option>
                    </select>
                    <div class="ayuda">Indica si la subcategoría estará activa o inactiva.</div>
                </div>

                <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>
                <div class="acciones">
                    <button class="cancelar" type="button" id="cancelar">Cancelar</button>
                    <button class="guardar" type="submit" id="guardar" disabled>Guardar subcategoría</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formulario = document.getElementById("formSubcategoria");
        const nombre = document.getElementById("nombre");
        const categoria = document.getElementById("categoria");
        const estado = document.getElementById("estado");
        const guardar = document.getElementById("guardar");
        const mensaje = document.getElementById("mensaje");
        let guardando = false;

        function enviar(datos) {
            // Las páginas de módulos se muestran en un iframe del Dashboard.
            if (window.parent !== window) {
                window.parent.postMessage(datos, "*");
                return true;
            }
            // También permite el uso directo dentro de WebView2.
            if (window.chrome?.webview?.postMessage) {
                window.chrome.webview.postMessage(datos);
                return true;
            }
            mensaje.textContent = "No hay conexión con Windows Forms.";
            return false;
        }

        function leer(objeto, principal, alternativo) {
            return objeto?.[principal] ?? objeto?.[alternativo];
        }

        function llenarSelect(select, lista, nombreId, etiquetaInicial) {
            select.replaceChildren();
            const primera = document.createElement("option");
            primera.value = "";
            primera.textContent = etiquetaInicial;
            select.appendChild(primera);

            for (const item of lista) {
                const id = leer(item, nombreId, nombreId.charAt(0).toLowerCase() + nombreId.slice(1));
                const texto = leer(item, "Nombre", "nombre");
                if (!Number.isInteger(Number(id)) || Number(id) <= 0 || !texto) continue;
                const opcion = document.createElement("option");
                opcion.value = String(id);
                opcion.textContent = String(texto);
                select.appendChild(opcion);
            }
            select.disabled = select.options.length <= 1;
            actualizarGuardar();
            return !select.disabled;
        }

        function actualizarGuardar() {
            guardar.disabled = guardando || categoria.disabled || estado.disabled;
        }

        document.getElementById("cancelar").addEventListener("click", () => {
            enviar({ type: "cancelar" });
        });

        formulario.addEventListener("submit", evento => {
            evento.preventDefault();
            if (guardando) return;

            const nombreValor = nombre.value.trim();
            const categoriaId = Number(categoria.value);
            const estadoId = Number(estado.value);

            if (!nombreValor || nombreValor.length > 120) {
                mensaje.textContent = "Ingresa un nombre válido de hasta 120 caracteres.";
                nombre.focus();
                return;
            }
            if (!Number.isInteger(categoriaId) || categoriaId <= 0) {
                mensaje.textContent = "Selecciona una categoría válida.";
                categoria.focus();
                return;
            }
            if (!Number.isInteger(estadoId) || estadoId <= 0) {
                mensaje.textContent = "Selecciona un estado válido.";
                estado.focus();
                return;
            }

            guardando = true;
            actualizarGuardar();
            guardar.textContent = "Guardando...";
            mensaje.textContent = "";

            const enviado = enviar({
                type: "guardar",
                data: {
                    CategoriaId: categoriaId,
                    Nombre: nombreValor,
                    EstadoId: estadoId
                }
            });

            if (!enviado) {
                guardando = false;
                actualizarGuardar();
                guardar.textContent = "Guardar subcategoría";
            }
        });

        function recibirMensaje(evento) {
            // Evitar procesar mensajes de otros marcos dentro del Dashboard.
            if (evento.source && window.parent !== window && evento.source !== window.parent) return;

            let respuesta = evento.data;
            if (typeof respuesta === "string") {
                try { respuesta = JSON.parse(respuesta); }
                catch { return; }
            }
            if (!respuesta || typeof respuesta !== "object") return;

            if (respuesta.type === "categorias:list") {
                const lista = Array.isArray(respuesta.data) ? respuesta.data : [];
                if (!llenarSelect(categoria, lista, "CategoriaId", "Selecciona una categoría")) {
                    mensaje.textContent = "No hay categorías disponibles. Registra una categoría primero.";
                } else {
                    mensaje.textContent = "";
                }
            } else if (respuesta.type === "estados") {
                const lista = Array.isArray(respuesta.data) ? respuesta.data : [];
                if (!llenarSelect(estado, lista, "EstadoId", "Selecciona un estado")) {
                    mensaje.textContent = "No hay estados disponibles.";
                }
            } else if (respuesta.type === "error") {
                guardando = false;
                actualizarGuardar();
                guardar.textContent = "Guardar subcategoría";
                mensaje.textContent = respuesta.message || "No se pudo guardar la subcategoría.";
            }
        }

        if (window.chrome?.webview?.addEventListener) {
            window.chrome.webview.addEventListener("message", recibirMensaje);
        }
        window.addEventListener("message", recibirMensaje);

        // El Dashboard reenvía estas solicitudes al MainForm.cs.
        enviar({ type: "categorias:selectAll" });
        enviar({ type: "obtenerEstados" });
    </script>
</body>
</html>
