<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>AutoParts | Nueva compatibilidad</title>
				<style>
					* { box-sizing: border-box; }
					body {
					margin: 0;
					min-height: 100vh;
					background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
					color: white;
					font-family: 'Segoe UI', Arial, sans-serif;
					}
					.contenedor { padding: 29px; }
					.encabezado {
					display: flex;
					justify-content: space-between;
					align-items: center;
					gap: 15px;
					margin-bottom: 25px;
					}
					.subtitulo {
					color: #ffbd35;
					font-size: 11px;
					letter-spacing: 3px;
					font-weight: 700;
					margin-bottom: 8px;
					}
					h1 { margin: 0; font-size: 27px; }
					.descripcion { color: #a9a7ae; font-size: 13px; line-height: 1.5; }
					.icono {
					width: 47px;
					height: 47px;
					border: 1px solid #ee3642;
					border-radius: 12px;
					background: #5c111a;
					display: grid;
					place-items: center;
					font-size: 24px;
					color: #ffc42f;
					box-shadow: 0 0 20px #ca263044;
					flex-shrink: 0;
					}
					.panel {
					background: linear-gradient(145deg, #171418, #0e0e12);
					border: 1px solid #5a3139;
					border-radius: 14px;
					padding: 25px;
					}
					label {
					display: block;
					font-size: 13px;
					font-weight: 600;
					margin-bottom: 9px;
					}
					.campo { margin-bottom: 21px; }
					input {
					width: 100%;
					padding: 13px 14px;
					background: #111216;
					color: white;
					border: 1px solid #554c55;
					border-radius: 9px;
					font: inherit;
					outline: none;
					}
					input:focus {
					border-color: #ff3d46;
					box-shadow: 0 0 10px #e41b303b;
					}
					input::placeholder { color: #85858f; }
					.requerido { color: #ff4753; }
					.mensaje {
					color: #ffb64e;
					min-height: 18px;
					font-size: 12px;
					margin-bottom: 12px;
					}
					.acciones {
					display: flex;
					justify-content: flex-end;
					gap: 12px;
					margin-top: 22px;
					}
					button {
					padding: 13px 23px;
					border-radius: 9px;
					font-weight: 700;
					border: 0;
					cursor: pointer;
					transition: .2s;
					}
					.cancelar {
					background: #242328;
					color: #e5e5e5;
					border: 1px solid #56535b;
					}
					.cancelar:hover { background: #353039; }
					.guardar {
					color: #140c0d;
					background: linear-gradient(105deg, #ff3543, #ffbd2b);
					box-shadow: 0 0 16px #e5233533;
					}
					.guardar:hover:not(:disabled) {
					filter: brightness(1.12);
					transform: translateY(-2px);
					}
					.guardar:disabled { opacity: .55; cursor: not-allowed; }
					@media (max-width: 500px) {
					.contenedor { padding: 17px; }
					.panel { padding: 18px; }
					.acciones { flex-wrap: wrap; }
					}
					.modal-exito[hidden] { display: none; }
					.modal-exito {
					position: fixed;
					inset: 0;
					background: rgba(0, 0, 0, .8);
					display: grid;
					place-items: center;
					z-index: 100;
					padding: 20px;
					}
					.modal-exito-panel {
					width: min(100%, 420px);
					padding: 32px 26px;
					text-align: center;
					background: linear-gradient(145deg, #22161b, #101115);
					border: 1px solid #79404a;
					border-radius: 16px;
					box-shadow: 0 20px 65px #000b;
					}
					.exito-simbolo {
					width: 62px;
					height: 62px;
					display: grid;
					place-items: center;
					border-radius: 50%;
					margin: 0 auto 18px;
					background: #113d29;
					border: 1px solid #34855d;
					color: #83edab;
					font-size: 32px;
					font-weight: 800;
					}
					.modal-exito-panel h2 { margin: 0 0 10px; font-size: 23px; }
					.modal-exito-panel p { color: #c9c5cb; font-size: 13px; margin: 0 0 24px; }
					.modal-exito-panel button { min-width: 124px; }

					select{width:100%;padding:13px 14px;background:#111216;color:white;border:1px solid #554c55;border-radius:9px;font:inherit;outline:none}
					select:focus{border-color:#ff3d46;box-shadow:0 0 10px #e41b303b}
				</style>
	</head>
	<body>
		<div class="contenedor">
			<div class="encabezado">
				<div>
					<h1>Nueva compatibilidad</h1>
				</div>
			</div>
			<div class="panel">
				<form id="formCompatibilidad">
					<div class="campo">
						<label for="producto">
							Repuesto <span class="requerido">*</span>
						</label>
						<select id="producto" required="">
							<option value="">Selecciona un repuesto</option>
						</select>
					</div>
					<div class="campo">
						<label for="vehiculo">
							Vehículo <span class="requerido">*</span>
						</label>
						<select id="vehiculo" required="">
							<option value="">Selecciona un vehículo</option>
						</select>
					</div>
					<div id="mensaje" class="mensaje" role="alert"></div>
					<div class="acciones">
						<button class="cancelar" type="button" id="cancelar">Cancelar</button>
						<button class="guardar" type="submit" id="guardar">Guardar compatibilidad</button>
					</div>
				</form>
			</div>
		</div>
		<div id="modalExito" class="modal-exito" hidden="">
			<div class="modal-exito-panel" role="dialog" aria-modal="true" aria-labelledby="tituloExito">
				<div class="exito-simbolo" aria-hidden="true">✓</div>
				<h2 id="tituloExito">¡Compatibilidad guardada!</h2>
				<p>La compatibilidad se registró correctamente.</p>
				<button type="button" class="guardar" id="aceptarExito">Aceptar</button>
			</div>
		</div>
		<script>
			const $=id=>document.getElementById(id);
			const obtener=(obj,...nombres)=>{for(const n of nombres){if(obj&&obj[n]!==undefined&&obj[n]!==null)return obj[n];}return '';};
			const numero=(obj,n)=>Number(obtener(obj,n,n[0].toLowerCase()+n.slice(1)))||0;
			const escapar=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
			let productos=[],vehiculos=[],modelos=[],marcas=[],relaciones=[],guardando=false;
			const cargado={productos:false,vehiculos:false,modelos:false,marcas:false,compatibilidad:false};
			function enviar(m){if(window.parent!==window){window.parent.postMessage(m,'*');return true;}if(window.chrome?.webview?.postMessage){window.chrome.webview.postMessage(m);return true;}$('mensaje').textContent='No hay conexión con Windows Forms.';return false;}
			function porId(lista,id,nombre){return lista.find(x=>numero(x,nombre)===Number(id));}
			function mostrarOpciones(sel,lista,nombre,texto){const previo=sel.value;sel.innerHTML='<option value="">Selecciona una opción</option>'+lista.map(x=>`<option value="${numero(x,nombre)}">${escapar(texto(x))}</option>`).join('');if([...sel.options].some(o=>o.value===previo))sel.value=previo;else sel.value='';}
			function mostrarProductos(){mostrarOpciones($('producto'),productos.filter(x=>numero(x,'EstadoId')===1),'ProductoId',x=>`${obtener(x,'Nombre','nombre')||'Producto'} · ${obtener(x,'CodigoOEM','codigoOEM')||''}`);}
			function mostrarVehiculos(){mostrarOpciones($('vehiculo'),vehiculos.filter(x=>numero(x,'EstadoId')===1),'VehiculoId',x=>{const m=porId(modelos,numero(x,'ModeloId'),'ModeloId');const marca=porId(marcas,numero(m,'MarcaId'),'MarcaId');return `${obtener(marca,'Nombre','nombre')||'Marca'} ${obtener(m,'Nombre','nombre')||'Modelo'} · ${obtener(x,'Anio','anio')||''} · ${obtener(x,'TipoMotor','tipoMotor')||''} (#${numero(x,'VehiculoId')})`;});}
			function restaurar(){guardando=false;$('guardar').disabled=false;$('guardar').textContent='Guardar compatibilidad';}
			function recibirRespuesta(evento){if(evento.source&&window.parent!==window&&evento.source!==window.parent)return;let m=evento.data;if(typeof m==='string'){try{m=JSON.parse(m);}catch{return;}}if(!m||typeof m!=='object')return;
			const lista={'productos:list':'productos','vehiculos:list':'vehiculos','modelos:list':'modelos','marcas:list':'marcas','compatibilidad:list':'compatibilidad'};
			if(lista[m.type]){const nombre=lista[m.type],datos=Array.isArray(m.data)?m.data:[];if(nombre==='productos')productos=datos;if(nombre==='vehiculos')vehiculos=datos;if(nombre==='modelos')modelos=datos;if(nombre==='marcas')marcas=datos;if(nombre==='compatibilidad')relaciones=datos;cargado[nombre]=true;mostrarProductos();mostrarVehiculos();return;}
			if(m.type==='compatibilidad:guardado'){$('modalExito').hidden=false;$('aceptarExito').focus();return;}
			if(m.type==='compatibilidad:error'||m.type==='error'){$('mensaje').textContent=m.message||'No se pudo guardar la compatibilidad.';restaurar();}}
			$('cancelar').addEventListener('click',()=>enviar({type:'cancelar'}));$('aceptarExito').addEventListener('click',()=>enviar({type:'cancelar'}));
			$('formCompatibilidad').addEventListener('submit',e=>{e.preventDefault();if(guardando)return;const p=Number($('producto').value),v=Number($('vehiculo').value);if(!p||!v){$('mensaje').textContent='Selecciona un producto y un vehículo.';return;}if(relaciones.some(x=>numero(x,'ProductoId')===p&&numero(x,'VehiculoId')===v)){$('mensaje').textContent='Esta compatibilidad ya existe. Si está inactiva, debes habilitarla desde el listado.';return;}if(!Object.values(cargado).every(Boolean)){$('mensaje').textContent='Aún no se han cargado los catálogos.';return;}guardando=true;$('guardar').disabled=true;$('guardar').textContent='Guardando...';$('mensaje').textContent='';if(!enviar({type:'guardar',data:{ProductoId:p,VehiculoId:v}}))restaurar();});
			window.addEventListener('message',recibirRespuesta);if(window.chrome?.webview?.addEventListener)window.chrome.webview.addEventListener('message',recibirRespuesta);
			for(const type of ['productos','vehiculos','modelos','marcas','compatibilidad'])enviar({type:type+':selectAll'});
		</script>
	</body>
</html>
