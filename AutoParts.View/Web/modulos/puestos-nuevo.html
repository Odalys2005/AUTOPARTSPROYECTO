<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts | Nuevo puesto</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
        .contenedor { max-width: 1500px; margin: 0 auto; padding: 35px; }
        .encabezado { margin-bottom: 28px; }
        h1 { margin: 0; font-size: clamp(28px,3vw,39px); font-weight: 800; letter-spacing: -1px; }
        h1 span { color: #ffbd2e; }
        .panel { background: linear-gradient(145deg,#171418,#0e0e12); border: 1px solid #5a3139; border-radius: 14px; padding: 25px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 9px; }
        .campo { margin-bottom: 22px; }
        input, textarea { width: 100%; padding: 13px 14px; background: #111216; color: white; border: 1px solid #554c55; border-radius: 9px; font: inherit; outline: none; }
        input:focus, textarea:focus { border-color: #ff3d46; box-shadow: 0 0 10px #e41b303b; }
        textarea { min-height: 115px; resize: vertical; }
        .requerido { color: #ff4753; }
        .mensaje { color: #ffb64e; min-height: 18px; font-size: 12px; margin-bottom: 12px; }
        .acciones { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
        button { padding: 13px 23px; border-radius: 9px; font: inherit; font-weight: 700; border: 0; cursor: pointer; transition: .2s; }
        .cancelar { background: #242328; color: #e5e5e5; border: 1px solid #56535b; }
        .cancelar:hover { background: #353039; }
        .guardar { color: #140c0d; background: linear-gradient(105deg,#ff3543,#ffbd2b); box-shadow: 0 0 16px #e5233533; }
        .guardar:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-2px); }
        .guardar:disabled { opacity: .55; cursor: not-allowed; }
        .modal[hidden] { display: none !important; }
        .modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: #000c; }
        .modal-panel { width: min(100%,430px); padding: 30px 26px; text-align: center; background: linear-gradient(145deg,#21161b,#111115); border: 1px solid #81424a; border-radius: 16px; box-shadow: 0 25px 80px #000a; }
        .icono-exito { display: grid; place-items: center; margin: 0 auto 17px; width: 65px; height: 65px; border-radius: 50%; background: #113925; border: 1px solid #318d61; color: #8cf0af; }
        .modal-panel h2 { margin: 0 0 10px; font-size: 22px; }
        .modal-panel p { margin: 0 0 24px; color: #c6c3c9; font-size: 14px; line-height: 1.6; }
        .modal-panel .guardar { min-width: 130px; }
        @media(max-width:500px) { .contenedor { padding: 18px; } .panel { padding: 18px; } .acciones button { flex: 1; } }
    </style>
</head>
<body>
    <main class="contenedor">
        <header class="encabezado"><h1>Nuevo <span>puesto</span></h1></header>
        <section class="panel">
            <form id="formPuesto">
                <div class="campo">
                    <label for="nombre">Nombre del puesto <span class="requerido">*</span></label>
                    <input id="nombre" type="text" maxlength="100" autocomplete="off" required>
                </div>
                <div class="campo">
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" maxlength="500"></textarea>
                </div>
                <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>
                <div class="acciones">
                    <button class="cancelar" id="cancelar" type="button">Cancelar</button>
                    <button class="guardar" id="guardar" type="submit">Guardar puesto</button>
                </div>
            </form>
        </section>
    </main>
    <div id="modalExito" class="modal" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="tituloExito" aria-describedby="descripcionExito">
            <div class="icono-exito" aria-hidden="true">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <h2 id="tituloExito">¡Puesto guardado!</h2>
            <p id="descripcionExito">El puesto se registró correctamente.</p>
            <button type="button" id="aceptarExito" class="guardar">Aceptar</button>
        </div>
    </div>
    <script>
        'use strict';
        const formulario = document.getElementById('formPuesto');
        const nombre = document.getElementById('nombre');
        const descripcion = document.getElementById('descripcion');
        const guardar = document.getElementById('guardar');
        const mensaje = document.getElementById('mensaje');
        const modalExito = document.getElementById('modalExito');
        let guardando = false;
        let guardadoExitoso = false;

        function enviar(datos) {
            if (window.parent !== window) { window.parent.postMessage(datos, '*'); return true; }
            if (window.chrome?.webview?.postMessage) { window.chrome.webview.postMessage(datos); return true; }
            mensaje.textContent = 'No hay conexión con Windows Forms.';
            return false;
        }
        function restaurarGuardado() {
            guardando = false;
            guardar.disabled = false;
            guardar.textContent = 'Guardar puesto';
        }
        document.getElementById('cancelar').addEventListener('click', () => {
            if (!guardando && !guardadoExitoso) enviar({ type: 'cancelar' });
        });
        formulario.addEventListener('submit', evento => {
            evento.preventDefault();
            if (guardando || guardadoExitoso) return;
            const nombreValor = nombre.value.trim();
            const descripcionValor = descripcion.value.trim();
            if (!nombreValor || nombreValor.length > 100) {
                mensaje.textContent = 'Ingresa un nombre válido de hasta 100 caracteres.';
                nombre.focus();
                return;
            }
            if (descripcionValor.length > 500) {
                mensaje.textContent = 'La descripción no puede superar los 500 caracteres.';
                descripcion.focus();
                return;
            }
            guardando = true;
            guardar.disabled = true;
            guardar.textContent = 'Guardando...';
            mensaje.textContent = '';
            if (!enviar({ type: 'guardar', data: { Nombre: nombreValor, Descripcion: descripcionValor || null, EstadoId: 1 } })) restaurarGuardado();
        });
        function recibirMensaje(evento) {
            if (window.parent !== window && evento.source && evento.source !== window.parent) return;
            let respuesta = evento.data;
            if (typeof respuesta === 'string') {
                try { respuesta = JSON.parse(respuesta); } catch { return; }
            }
            if (!respuesta || typeof respuesta !== 'object') return;
            if (respuesta.type === 'puestos:guardado') {
                guardadoExitoso = true;
                guardando = false;
                mensaje.textContent = '';
                modalExito.hidden = false;
                document.getElementById('aceptarExito').focus();
            } else if (respuesta.type === 'error' || respuesta.type === 'puestos:error') {
                if (!guardando) return;
                mensaje.textContent = respuesta.message || 'No se pudo guardar el puesto.';
                restaurarGuardado();
            }
        }
        document.getElementById('aceptarExito').addEventListener('click', () => enviar({ type: 'cancelar' }));
        window.addEventListener('message', recibirMensaje);
        if (window.chrome?.webview?.addEventListener) window.chrome.webview.addEventListener('message', recibirMensaje);
    </script>
</body>
</html>
