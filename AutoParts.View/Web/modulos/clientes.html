<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AutoParts | Clientes</title><style>
					:root { color-scheme: dark; }
					* { box-sizing: border-box; }
					body {
					margin: 0;
					min-height: 100vh;
					color: #f5f5f7;
					font-family: 'Segoe UI', Arial, sans-serif;
					background: radial-gradient(ellipse at 95% 0%, rgba(136, 16, 25, 0.18), transparent 38%), #090a0d;
					}
					button, input { font: inherit; }
					button { cursor: pointer; }
					.contenedor {
					max-width: 1500px;
					margin: auto;
					padding: 35px;
					}
					.encabezado {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 20px;
					margin-bottom: 30px;
					}
					.etiqueta {
					display: flex;
					align-items: center;
					gap: 9px;
					color: #ffbd37;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: 3px;
					margin-bottom: 12px;
					}
					h1 {
					margin: 0;
					font-size: clamp(28px, 3vw, 39px);
					font-weight: 800;
					letter-spacing: -1px;
					}
					h1 span { color: #ffbd2e; }
					.subtitulo {
					color: #a9aab3;
					font-size: 13px;
					margin-top: 9px;
					line-height: 1.6;
					}
					.btn-nueva {
					display: flex;
					align-items: center;
					justify-content: center;
					gap: 10px;
					padding: 14px 20px;
					border: 1px solid #ff6053;
					border-radius: 10px;
					background: linear-gradient(110deg, #b10b1f, #e52a37, #ffac28);
					color: #fff;
					font-size: 13px;
					font-weight: 750;
					box-shadow: 0 0 18px rgba(233, 31, 48, 0.27), inset 0 1px 1px #ffffff30;
					transition: transform .2s, filter .2s;
					}
					.btn-nueva[hidden]{display:none!important}
					.btn-nueva:hover {
					transform: translateY(-2px);
					filter: brightness(1.12);
					}
					.panel {
					border: 1px solid #4d3038;
					border-radius: 15px;
					background: linear-gradient(140deg, #171519, #0d0e11 65%, #140f12);
					box-shadow: 0 12px 35px #0005, inset 0 0 18px #0004;
					overflow: hidden;
					}
					.panel-superior {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 16px;
					padding: 23px 25px;
					border-bottom: 1px solid #34292e;
					}
					.panel-titulo h2 {
					font-size: 18px;
					margin: 0 0 7px;
					}
					.panel-titulo p {
					font-size: 12px;
					color: #9798a1;
					margin: 0;
					}
					.herramientas {
					display: flex;
					align-items: center;
					flex-wrap: nowrap;
					gap: 9px;
					}
					.buscador {
					display: flex;
					align-items: center;
					background: #111216;
					border: 1px solid #51454c;
					border-radius: 9px;
					width: min(340px, 100%);
					min-width: 0;
					flex: 1 1 240px;
					height: 44px;
					padding: 0 13px;
					}
					.buscador:focus-within {
					border-color: #ff414e;
					box-shadow: 0 0 12px #ff334020;
					}
					.buscador svg {
					flex-shrink: 0;
					color: #a7a7b0;
					}
					.buscador input {
					border: none;
					background: transparent;
					color: white;
					outline: none;
					width: 100%;
					padding: 0 10px;
					font-size: 12px;
					}
					.buscador input::placeholder { color: #898992; }
					.btn-actualizar {
					width: 44px;
					height: 44px;
					padding: 0;
					display: inline-flex;
					align-items: center;
					justify-content: center;
					flex: 0 0 44px;
					color: #e8e8eb;
					background: #211a1f;
					border: 1px solid #60444d;
					border-radius: 9px;
					transition: .2s;
					}
					.btn-actualizar:hover {
					background: #3a2027;
					border-color: #ed4247;
					}
					.tabla-contenedor {
					overflow-x: auto;
					min-height: 240px;
					}
					table {
					border-collapse: collapse;
					width: 100%;
					font-size: 13px;
					}
					thead { background: #1b1b21; }
					th {
					padding: 16px 23px;
					color: #babac4;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: .5px;
					text-align: left;
					white-space: nowrap;
					border-bottom: 1px solid #373035;
					}
					td {
					padding: 16px 23px;
					border-bottom: 1px solid #2c2a30;
					color: #e4e4e9;
					}
					tbody tr { transition: background .15s; }
					tbody tr:hover { background: #25181e; }
					.codigo {
					color: #ffbe42;
					font-weight: 700;
					}
					.nombre {
					color: #fff;
					font-weight: 650;
					}
					.estado {
					display: inline-flex;
					align-items: center;
					gap: 8px;
					border-radius: 30px;
					padding: 6px 12px;
					font-size: 11px;
					font-weight: 700;
					}
					.estado::before {
					content: "";
					width: 6px;
					height: 6px;
					border-radius: 50%;
					background: currentColor;
					}
					.estado.activo {
					background: #103d29;
					border: 1px solid #17643e;
					color: #78ecaa;
					}
					.estado.inactivo {
					background: #40272a;
					border: 1px solid #704147;
					color: #ff8e94;
					}
					.estado.otro {
					background: #403514;
					border: 1px solid #746027;
					color: #ffd274;
					}
					.vacio {
					text-align: center;
					padding: 65px 20px;
					color: #9ea0ab;
					}
					.vacio svg {
					color: #ffb92e;
					margin-bottom: 12px;
					opacity: .8;
					}
					.vacio strong {
					display: block;
					color: #e6e6eb;
					margin-bottom: 7px;
					}
					.vacio p {
					font-size: 12px;
					margin: 0;
					}
					.panel-inferior {
					display: flex;
					justify-content: space-between;
					align-items: center;
					flex-wrap: wrap;
					gap: 10px;
					padding: 16px 25px;
					border-top: 1px solid #34292e;
					font-size: 12px;
					color: #9999a3;
					}
					.total strong { color: #ffbd31; }
					.indicador {
					display: flex;
					align-items: center;
					gap: 8px;
					}
					.punto {
					width: 7px;
					height: 7px;
					background: #ffbd35;
					border-radius: 50%;
					box-shadow: 0 0 10px #ffbd35;
					}
					@media (max-width: 850px) {
					.contenedor { padding: 20px; }
					.panel-superior { padding: 18px; }
					.herramientas { width: 100%; }
					.buscador {
					flex: 1;
					min-width: 0;
					}
					th, td { padding: 14px 13px; }
					.panel-inferior { padding: 16px; }
					}
				
.acciones-cliente{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boton-cliente{border:1px solid #65444c;background:#241a20;border-radius:8px;padding:8px 12px;color:#f4f4f5;font-size:12px;font-weight:700}
.boton-cliente:hover{border-color:#ffbd35;background:#35212a}
.boton-cliente.desactivar{border-color:#91434c;color:#ff9ca2}
.boton-cliente:disabled{opacity:.4;cursor:not-allowed}
.mensaje-cliente{padding:12px 25px;color:#ffbd69;font-size:12px;min-height:38px}
.modal-cliente[hidden]{display:none!important}
.modal-cliente{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}
.modal-panel-cliente{width:min(100%,480px);background:linear-gradient(145deg,#21161b,#111115);border:1px solid #81424a;border-radius:16px;padding:26px;box-shadow:0 25px 80px #000a}
.modal-panel-cliente h2{margin:0 0 18px;color:#fff}
.modal-panel-cliente label{display:block;font-size:13px;margin-bottom:8px}
.modal-panel-cliente input{width:100%;padding:13px;background:#101115;border:1px solid #6b444d;border-radius:9px;color:#fff;outline:none}
.modal-acciones-cliente{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.modal-acciones-cliente button{border-radius:9px;padding:11px 17px;font-weight:700}
.modal-guardar-cliente{background:linear-gradient(105deg,#e42739,#ffbd2b);border:0;color:#140b0d}

.boton-cliente.habilitar{border-color:#247e54;color:#91f2bb;background:#11291e}
.boton-cliente.habilitar:hover{border-color:#5fd39a;background:#173b29}
.modal-descripcion-cliente{color:#c1b8bf;font-size:13px;line-height:1.7;margin:0}
.modal-nombre-cliente{color:#ffbd35;font-weight:800}
.modal-confirmar-cliente{background:#9e2533;border:1px solid #f15d69;color:#fff}
.modal-confirmar-cliente.habilitar{background:#155a3b;border-color:#48c78b;color:#e3ffef}

.modal-resultado-cliente{text-align:center;width:min(100%,430px)}
.icono-resultado-cliente{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;margin:0 auto 17px;border:1px solid #318d61;background:#113925;color:#8cf0af;font-size:33px;font-weight:800}
.modal-resultado-cliente h2{margin:0 0 10px}
.modal-resultado-cliente p{color:#c6c3c9;font-size:14px;line-height:1.6;margin:0 0 23px}
.modal-resultado-cliente .modal-acciones-cliente{justify-content:center}
.modal-resultado-cliente .modal-guardar-cliente{min-width:120px;cursor:pointer}

.modal-detalles-cliente{width:min(100%,460px)}
.modal-detalles-cliente h2{margin-bottom:24px}
.detalle-fila-cliente{padding:15px 0;border-bottom:1px solid #3d2b33}
.detalle-fila-cliente:first-of-type{padding-top:0}
.detalle-etiqueta-cliente{display:block;color:#a8a3ac;font-size:12px;margin-bottom:8px}
.detalle-valor-cliente{color:#fff;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.modal-detalles-cliente .modal-acciones-cliente{margin-top:24px}
.modal-detalles-cliente .modal-guardar-cliente{min-width:110px;cursor:pointer}
.boton-cliente.ver{border-color:#675277;color:#e4c8ff}
.boton-cliente.ver:hover{background:#30213b;border-color:#ab75d1}
.acciones-cliente{gap:9px;flex-wrap:nowrap}
.acciones-cliente .boton-cliente{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:10px;transition:background .2s,border-color .2s,transform .2s}
.acciones-cliente .boton-cliente svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.acciones-cliente .boton-cliente:hover:not(:disabled){transform:translateY(-2px)}
.acciones-cliente .boton-cliente.ver{color:#62b9ff;border-color:#285f91;background:#0e2234}
.acciones-cliente .boton-cliente.ver:hover{color:#94d2ff;background:#18374f;border-color:#419cdb}
.acciones-cliente .boton-cliente.editar{color:#75e4a4;border-color:#276546;background:#10291d}
.acciones-cliente .boton-cliente.editar:hover{color:#a2f5c1;background:#173d2a;border-color:#43b878}
.acciones-cliente .boton-cliente.desactivar{color:#ff818d;border-color:#81333e;background:#31151d}
.acciones-cliente .boton-cliente.desactivar:hover{color:#ffb0b9;background:#4c1d27;border-color:#ef5366}
.acciones-cliente .boton-cliente.habilitar{color:#74e8ad;border-color:#297d55;background:#102d20}
.acciones-cliente .boton-cliente.habilitar:hover{color:#adffd0;background:#19432e;border-color:#4ac587}

.tabla-contenedor{overflow-x:auto}table{min-width:1050px} .acciones-cliente{white-space:nowrap} .correo-cliente{overflow-wrap:anywhere} .modal-panel-cliente.modal-editar-cliente{width:min(100%,590px);max-height:90vh;overflow-y:auto} .campos-editar-cliente{display:grid;grid-template-columns:1fr 1fr;gap:14px} .campo-cliente label{margin-bottom:6px} .campo-cliente input{width:100%} .campo-cliente.ancho{grid-column:1/-1} .detalle-fila-cliente{display:flex;justify-content:space-between;gap:18px} .detalle-valor-cliente{text-align:right;font-size:14px} .modal-panel-cliente.modal-detalles-cliente{max-height:90vh;overflow-y:auto} .estado-cliente{display:inline-flex} @media(max-width:600px){.campos-editar-cliente{grid-template-columns:1fr}.detalle-fila-cliente{display:block}.detalle-valor-cliente{text-align:left}}
</style></head>
<body>
<main class="contenedor">
<header class="encabezado"><div><div class="etiqueta">AUTOPARTS · ADMINISTRACIÓN</div><h1>Gestión de <span>Clientes</span></h1></div>
<button class="btn-nueva" type="button" id="btnNuevoCliente"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Nuevo cliente</button></header>
<section class="panel"><div class="panel-superior"><div class="panel-titulo"><h2>Listado de clientes</h2></div><div class="herramientas"><div class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="buscarCliente" type="search" placeholder="Buscar clientes..." autocomplete="off"></div><button class="btn-actualizar" id="btnActualizar" type="button" title="Actualizar clientes" aria-label="Actualizar clientes"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/></svg></button></div></div>
<div id="avisoCliente" class="mensaje-cliente" role="status" aria-live="polite"></div>
<div class="tabla-contenedor"><table><thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>DUI</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="clienteRows"><tr><td colspan="8"><div class="vacio">Cargando clientes...</div></td></tr></tbody></table></div>
<footer class="panel-inferior"><div class="total">Total de clientes: <strong id="totalClientes">0</strong></div><div class="indicador"><span class="punto"></span> AutoParts · Gestión de clientes</div></footer></section></main>
<div id="modalEditarCliente" class="modal-cliente" hidden><div class="modal-panel-cliente modal-editar-cliente" role="dialog" aria-modal="true" aria-labelledby="tituloEditarCliente"><h2 id="tituloEditarCliente">Editar cliente</h2><form id="formEditarCliente"><div class="campos-editar-cliente"><div class="campo-cliente"><label for="editarNombre">Nombre *</label><input id="editarNombre" type="text" maxlength="100" required autocomplete="off"></div>
<div class="campo-cliente"><label for="editarApellido">Apellido *</label><input id="editarApellido" type="text" maxlength="100" required autocomplete="off"></div>
<div class="campo-cliente"><label for="editarDui">DUI *</label><input id="editarDui" type="text" maxlength="10" required autocomplete="off"></div>
<div class="campo-cliente"><label for="editarNit">NIT</label><input id="editarNit" type="text" maxlength="20"  autocomplete="off"></div>
<div class="campo-cliente"><label for="editarTelefono">Teléfono *</label><input id="editarTelefono" type="tel" maxlength="25" required autocomplete="off"></div>
<div class="campo-cliente"><label for="editarCorreo">Correo electrónico *</label><input id="editarCorreo" type="email" maxlength="150" required autocomplete="off"></div>
<div class="campo-cliente"><label for="editarDireccion">Dirección</label><input id="editarDireccion" type="text" maxlength="50"  autocomplete="off"></div></div><div class="modal-acciones-cliente"><button type="button" class="boton-cliente" id="cancelarEditarCliente">Cancelar</button><button type="submit" class="modal-guardar-cliente" id="guardarEditarCliente">Guardar cambios</button></div></form></div></div>
<div id="modalConfirmarCliente" class="modal-cliente" hidden><div class="modal-panel-cliente" role="dialog" aria-modal="true"><h2 id="tituloConfirmarCliente">Confirmar cambio</h2><p class="modal-descripcion-cliente" id="descripcionConfirmarCliente"></p><div class="modal-acciones-cliente"><button type="button" class="boton-cliente" id="cancelarCambioCliente">Cancelar</button><button type="button" class="modal-confirmar-cliente" id="confirmarCambioCliente">Confirmar</button></div></div></div>
<div id="modalVerCliente" class="modal-cliente" hidden><div class="modal-panel-cliente modal-detalles-cliente" role="dialog" aria-modal="true"><h2>Detalles del cliente</h2><div id="detallesCliente"></div><div class="modal-acciones-cliente"><button type="button" class="modal-guardar-cliente" id="cerrarVerCliente">Cerrar</button></div></div></div>
<div id="modalResultadoCliente" class="modal-cliente" hidden><div class="modal-panel-cliente modal-resultado-cliente" role="dialog" aria-modal="true"><div class="icono-resultado-cliente" aria-hidden="true">✓</div><h2 id="tituloResultadoCliente">Operación realizada</h2><p id="textoResultadoCliente"></p><div class="modal-acciones-cliente"><button type="button" class="modal-guardar-cliente" id="aceptarResultadoCliente">Aceptar</button></div></div></div>
<script>
'use strict';
let rolActualClientes = null;
const puedeGestionarClientes = () => rolActualClientes === 1 || rolActualClientes === 2;
function aplicarPermisosClientes(){
    document.getElementById('btnNuevoCliente').hidden = !puedeGestionarClientes();
    if (!puedeGestionarClientes()) document.querySelectorAll('#clienteRows [data-editar], #clienteRows [data-cambiar-estado]').forEach(boton => boton.remove());
}
let clientes = [];
let clienteEditandoId = 0;
let clienteCambioId = 0;
let ultimaAccionCliente = '';
let operacionPendiente = false;
const $ = id => document.getElementById(id);
function escapar(valor){return String(valor ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function obtener(obj,...nombres){for(const n of nombres){if(obj && obj[n]!==undefined && obj[n]!==null)return obj[n];}return '';}
function dato(c,n){return obtener(c,n,n.charAt(0).toLowerCase()+n.slice(1),n.toLowerCase());}
function enviarACSharp(m){if(window.parent!==window){window.parent.postMessage(m,'*');return true;}if(window.chrome?.webview?.postMessage){window.chrome.webview.postMessage(m);return true;}aviso('Esta pantalla requiere el Dashboard de AutoParts o WebView2.');return false;}
function aviso(s){$('avisoCliente').textContent=s||'';}
function mostrarMensaje(s){$('clienteRows').innerHTML='<tr><td colspan="8"><div class="vacio"><strong>'+escapar(s)+'</strong></div></td></tr>';}
function nombreCompleto(c){return [dato(c,'Nombre'),dato(c,'Apellido')].filter(Boolean).join(' ');}
function buscarCliente(id){return clientes.find(c=>Number(dato(c,'ClienteId'))===id);}
function mostrarResultado(t,s){$('tituloResultadoCliente').textContent=t;$('textoResultadoCliente').textContent=s;$('modalResultadoCliente').hidden=false;$('aceptarResultadoCliente').focus();}
function pintarClientes(){const texto=$('buscarCliente').value.trim().toLocaleLowerCase('es');const filtrados=clientes.filter(c=>[dato(c,'ClienteId'),dato(c,'Nombre'),dato(c,'Apellido'),dato(c,'DUI'),dato(c,'NIT'),dato(c,'Telefono'),dato(c,'Correo'),dato(c,'Direccion'),Number(dato(c,'EstadoId'))===1?'activo':'inactivo'].some(v=>String(v).toLocaleLowerCase('es').includes(texto)));$('totalClientes').textContent=String(filtrados.length);if(!filtrados.length){mostrarMensaje(texto?'No se encontraron coincidencias.':'No hay clientes registrados.');return;}
$('clienteRows').innerHTML=filtrados.map(c=>{const id=Number(dato(c,'ClienteId'));const nombre=nombreCompleto(c);const activo=Number(dato(c,'EstadoId'))===1;return `<tr><td class="codigo">#${escapar(id)}</td><td class="nombre">${escapar(dato(c,'Nombre'))}</td><td>${escapar(dato(c,'Apellido'))}</td><td>${escapar(dato(c,'DUI'))}</td><td>${escapar(dato(c,'Telefono'))}</td><td class="correo-cliente">${escapar(dato(c,'Correo'))}</td><td><span class="estado ${activo?'activo':'inactivo'}">${activo?'Activo':'Inactivo'}</span></td><td><div class="acciones-cliente"><button type="button" class="boton-cliente ver" data-ver="${id}" title="Ver detalles" aria-label="Ver ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button><button type="button" class="boton-cliente editar" data-editar="${id}" title="Editar cliente" aria-label="Editar ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button><button type="button" class="boton-cliente ${activo?'desactivar':'habilitar'}" data-cambiar-estado="${id}" title="${activo?'Eliminar (desactivar)':'Habilitar'}" aria-label="${activo?'Desactivar':'Habilitar'} ${escapar(nombre)}">${activo?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6"/><path d="M10 10v7M14 10v7"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'}</button></div></td></tr>`;}).join('');aplicarPermisosClientes();}
function solicitarClientes(){aviso('');mostrarMensaje('Cargando clientes...');enviarACSharp({type:'clientes:selectAll'});}
function abrirVer(id){const c=buscarCliente(id);if(!c||operacionPendiente)return;const datos=[['Nombre',dato(c,'Nombre')],['Apellido',dato(c,'Apellido')],['DUI',dato(c,'DUI')],['NIT',dato(c,'NIT')],['Teléfono',dato(c,'Telefono')],['Correo electrónico',dato(c,'Correo')],['Dirección',dato(c,'Direccion')],['Estado',Number(dato(c,'EstadoId'))===1?'Activo':'Inactivo']];$('detallesCliente').innerHTML=datos.map(([t,v])=>`<div class="detalle-fila-cliente"><span class="detalle-etiqueta-cliente">${escapar(t)}</span><span class="detalle-valor-cliente">${escapar(v||'—')}</span></div>`).join('');$('modalVerCliente').hidden=false;$('cerrarVerCliente').focus();}
function abrirEditor(id){
    const c=buscarCliente(id);
    if(!puedeGestionarClientes()||!c||operacionPendiente)return;
    clienteEditandoId=id;
    const campos={
        Nombre:'editarNombre',
        Apellido:'editarApellido',
        DUI:'editarDui',
        NIT:'editarNit',
        Telefono:'editarTelefono',
        Correo:'editarCorreo',
        Direccion:'editarDireccion'
    };
    for(const [campo,elemento] of Object.entries(campos))$(elemento).value=String(dato(c,campo));
    $('modalEditarCliente').hidden=false;
    $('editarNombre').focus();
}
function cerrarEditor(){if(operacionPendiente)return;$('modalEditarCliente').hidden=true;clienteEditandoId=0;}
function abrirConfirmacion(id){const c=buscarCliente(id);if(!puedeGestionarClientes()||!c||operacionPendiente)return;clienteCambioId=id;const activo=Number(dato(c,'EstadoId'))===1;$('tituloConfirmarCliente').textContent=activo?'¿Eliminar cliente?':'¿Habilitar cliente?';$('descripcionConfirmarCliente').textContent=`¿Seguro que deseas ${activo?'desactivar':'habilitar'} al cliente "${nombreCompleto(c)}"?`;$('confirmarCambioCliente').textContent=activo?'Sí, desactivar':'Sí, habilitar';$('confirmarCambioCliente').classList.toggle('habilitar',!activo);$('modalConfirmarCliente').hidden=false;$('cancelarCambioCliente').focus();}
function cerrarConfirmacion(){if(operacionPendiente)return;$('modalConfirmarCliente').hidden=true;clienteCambioId=0;}
function cambiarEstado(){if(!puedeGestionarClientes()||operacionPendiente||clienteCambioId<=0)return;const c=buscarCliente(clienteCambioId);if(!c)return;const activo=Number(dato(c,'EstadoId'))===1;const id=clienteCambioId;$('modalConfirmarCliente').hidden=true;clienteCambioId=0;operacionPendiente=true;ultimaAccionCliente=activo?'desactivar':'habilitar';aviso(activo?'Desactivando cliente...':'Habilitando cliente...');if(!enviarACSharp({type:'clientes:desactivarIntegrado',data:{ClienteId:id}}))operacionPendiente=false;}
function recibirRespuesta(evento){if(evento.source&&window.parent!==window&&evento.source!==window.parent)return;let m=evento.data;if(typeof m==='string'){try{m=JSON.parse(m);}catch{return;}}if(!m||typeof m!=='object')return;if(m.type==='autoparts:rolActual'){rolActualClientes=Number(m.rolId);aplicarPermisosClientes();pintarClientes();return;}if(m.type==='clientes:list'){clientes=Array.isArray(m.data)?m.data:[];pintarClientes();return;}if(m.type==='clientes:actualizada'||m.type==='clientes:desactivada'){const a=m.type==='clientes:actualizada'?'actualizar':ultimaAccionCliente;operacionPendiente=false;ultimaAccionCliente='';$('guardarEditarCliente').disabled=false;cerrarEditor();solicitarClientes();mostrarResultado(a==='actualizar'?'Cliente actualizado':a==='habilitar'?'Cliente habilitado':'Cliente desactivado',a==='actualizar'?'El cliente se actualizó correctamente.':a==='habilitar'?'El cliente se habilitó correctamente.':'El cliente se desactivó correctamente.');return;}if(m.type==='clientes:error'||m.type==='error'){operacionPendiente=false;$('guardarEditarCliente').disabled=false;aviso(m.message||'No se pudo completar la operación.');}}
$('clienteRows').addEventListener('click',e=>{const ver=e.target.closest('[data-ver]');const editar=e.target.closest('[data-editar]');const cambiar=e.target.closest('[data-cambiar-estado]');if(ver)abrirVer(Number(ver.dataset.ver));if(editar)abrirEditor(Number(editar.dataset.editar));if(cambiar)abrirConfirmacion(Number(cambiar.dataset.cambiarEstado));});
$('formEditarCliente').addEventListener('submit',e=>{
    e.preventDefault();
    if(!puedeGestionarClientes()||operacionPendiente||clienteEditandoId<=0)return;
    const d={
        ClienteId:clienteEditandoId,
        Nombre:$('editarNombre').value.trim(),
        Apellido:$('editarApellido').value.trim(),
        DUI:$('editarDui').value.trim(),
        NIT:$('editarNit').value.trim()||null,
        Telefono:$('editarTelefono').value.trim(),
        Correo:$('editarCorreo').value.trim(),
        Direccion:$('editarDireccion').value.trim()||null
    };
    if(!d.Nombre||!d.Apellido||!d.DUI||!d.Telefono||!d.Correo){aviso('Completa los campos obligatorios.');return;}
    if(!/^\d{8}-\d$/.test(d.DUI)){aviso('El DUI debe tener el formato 00000000-0.');$('editarDui').focus();return;}
    if(!$('formEditarCliente').reportValidity())return;
    operacionPendiente=true;
    ultimaAccionCliente='actualizar';
    $('guardarEditarCliente').disabled=true;
    aviso('Guardando cambios...');
    if(!enviarACSharp({type:'clientes:actualizarIntegrado',data:d})){
        operacionPendiente=false;
        $('guardarEditarCliente').disabled=false;
    }
});
$('cerrarVerCliente').addEventListener('click',()=>{$('modalVerCliente').hidden=true;});$('cancelarEditarCliente').addEventListener('click',cerrarEditor);$('aceptarResultadoCliente').addEventListener('click',()=>{$('modalResultadoCliente').hidden=true;});$('cancelarCambioCliente').addEventListener('click',cerrarConfirmacion);$('confirmarCambioCliente').addEventListener('click',cambiarEstado);$('btnNuevoCliente').addEventListener('click',()=>{if(puedeGestionarClientes())enviarACSharp({type:'clientes:abrirNuevo'});});$('btnActualizar').addEventListener('click',solicitarClientes);$('buscarCliente').addEventListener('input',pintarClientes);window.addEventListener('message',recibirRespuesta);if(window.chrome?.webview?.addEventListener)window.chrome.webview.addEventListener('message',recibirRespuesta);aplicarPermisosClientes();if(window.parent!==window)window.parent.postMessage({type:'autoparts:solicitarRol'},'*');solicitarClientes();
</script></body></html>
