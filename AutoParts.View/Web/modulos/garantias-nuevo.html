<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoParts | Nueva garantía</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 100% 0%, rgba(136,16,25,.20), transparent 44%), #090a0d; color: #f5f5f7; font-family: 'Segoe UI', Arial, sans-serif; }
    button, select, input, textarea { font: inherit; }
    .contenedor { max-width: 1110px; margin: auto; padding: 34px; }
    .encabezado { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 29px; }
    .etiqueta { display: flex; align-items: center; gap: 9px; color: #ffbd37; font-size: 11px; font-weight: 750; letter-spacing: 2.7px; margin-bottom: 12px; }
    .etiqueta::before { content: ''; width: 22px; height: 3px; background: #ff3543; border-radius: 10px; box-shadow: 0 0 12px #ff243a; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 36px); font-weight: 800; letter-spacing: -.6px; }
    h1 span { color: #ffbd2e; }
    .descripcion { color: #adaeb8; margin: 10px 0 0; font-size: 13px; line-height: 1.6; }
    .icono { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 12px; border: 1px solid #f43848; background: #3b1119; color: #ffbd35; box-shadow: 0 0 18px #e9243444; flex-shrink: 0; }
    .panel { background: linear-gradient(140deg, #171519, #0d0e11 70%, #140f12); border: 1px solid #56323c; border-radius: 15px; padding: 30px; box-shadow: 0 12px 35px #0005; }
    .seccion { font-size: 11px; letter-spacing: 2px; font-weight: 750; color: #ffbd35; margin: 0 0 25px; }
    .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; }
    .campo { min-width: 0; }
    .campo.ancho { grid-column: 1 / -1; }
    .campo label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 9px; color: #f4f4f6; }
    .requerido { color: #ff4653; }
    .campo input, .campo select, .campo textarea { display: block; width: 100%; min-height: 47px; border-radius: 9px; border: 1px solid #554a52; background: #111216; padding: 0 14px; color: #fff; outline: 0; transition: border-color .2s, box-shadow .2s; }
    .campo textarea { min-height: 113px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
    .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: #ff3543; box-shadow: 0 0 14px #ff354333; }
    .campo input::placeholder, .campo textarea::placeholder { color: #777982; }
    .campo select:disabled { opacity: .58; }
    .mensaje { min-height: 22px; margin-top: 25px; color: #ffc075; font-size: 12px; line-height: 1.5; }
    .mensaje:empty { min-height: 0; }
    .mensaje.exito { color: #79eaaa; }
    .acciones { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; border-top: 1px solid #382d34; padding-top: 23px; margin-top: 24px; }
    .acciones button { border-radius: 9px; border: 1px solid transparent; padding: 13px 25px; font-weight: 750; font-size: 13px; cursor: pointer; transition: filter .2s, transform .2s; }
    .cancelar { color: #e6e6eb; background: #25232a; border-color: #58535c; }
    .cancelar:hover { background: #37313a; }
    .guardar { color: #190d0d; background: linear-gradient(110deg, #ff3543, #ffbd2b); box-shadow: 0 0 16px #e5233533; }
    .guardar:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-2px); }
    .guardar:disabled { opacity: .5; cursor: not-allowed; }
    @media (max-width: 720px) { .contenedor { padding: 20px; } .panel { padding: 20px; } .campos { grid-template-columns: 1fr; gap: 18px; } .campo.ancho { grid-column: auto; } }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <div>
        <div class="etiqueta">SERVICIO POSVENTA</div>
        <h1>Nueva <span>Garantía</span></h1>
        <p class="descripcion">Registro de solicitud por posible defecto de fabricación.</p>
      </div>
      <div class="icono" aria-hidden="true">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8m-8 4h8m-8 4h5"/></svg>
      </div>
    </header>
    <section class="panel">
      <form id="formRegistro" novalidate>
        <p class="seccion">DATOS DE LA SOLICITUD</p>
        <div class="campos">
          <div class="campo ancho">
            <label for="DetalleVentaId">Producto vendido / detalle de venta <span class="requerido">*</span></label>
            <select id="DetalleVentaId" required disabled><option value="">Cargando ventas...</option></select>
          </div>
          <div class="campo">
            <label for="CantidadReclamada">Cantidad reclamada <span class="requerido">*</span></label>
            <input type="number" id="CantidadReclamada" required min="1" step="1" placeholder="1">
          </div>
          <div class="campo ancho">
            <label for="DescripcionFalla">Descripción de la falla <span class="requerido">*</span></label>
            <textarea id="DescripcionFalla" required maxlength="1000" placeholder="Describe la falla reportada..."></textarea>
          </div>
          <div class="campo ancho">
            <label for="Observaciones">Observaciones</label>
            <textarea id="Observaciones" maxlength="1000" placeholder=""></textarea>
          </div>
        </div>
        <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
        <div class="acciones">
          <button type="button" id="cancelar" class="cancelar">Cancelar</button>
          <button type="submit" id="guardar" class="guardar" disabled>Registrar solicitud</button>
        </div>
      </form>
    </section>
  </main>
  <script>
    'use strict';
    const formulario = document.getElementById('formRegistro');
    const selector = document.getElementById('DetalleVentaId');
    const cantidad = document.getElementById('CantidadReclamada');
    const descripcion = document.getElementById('DescripcionFalla');
    const observaciones = document.getElementById('Observaciones');
    const mensaje = document.getElementById('mensaje');
    const guardar = document.getElementById('guardar');
    let detalles = [];
    let productos = [];
    let ventas = [];
    let guardando = false;
    let cargaronDetalles = false;
    let esperaCarga;
    let esperaRegistro;

    function campo(obj, nombre) {
      if (!obj || typeof obj !== 'object') return undefined;
      return obj[nombre] ?? obj[nombre[0].toLowerCase() + nombre.slice(1)];
    }

    function emitir(mensaje) {
      if (window.parent !== window) {
        window.parent.postMessage(mensaje, '*');
        return true;
      }
      if (window.chrome?.webview?.postMessage) {
        window.chrome.webview.postMessage(mensaje);
        return true;
      }
      return false;
    }

    function informar(texto, exito = false) {
      mensaje.textContent = texto;
      mensaje.classList.toggle('exito', exito);
    }

    function actualizarBoton() {
      guardar.disabled = guardando || !cargaronDetalles || !detalles.length;
    }

    function pintarDetalles() {
      const anterior = selector.value;
      selector.replaceChildren();
      const primera = document.createElement('option');
      primera.value = '';
      primera.textContent = 'Selecciona el detalle de venta';
      selector.appendChild(primera);
      const productosPorId = new Map(productos.map(p => [Number(campo(p, 'ProductoId')), p]));
      const ventasPorId = new Map(ventas.map(v => [Number(campo(v, 'VentaId')), v]));
      for (const detalle of detalles) {
        const detalleId = Number(campo(detalle, 'DetalleVentaId'));
        const ventaId = Number(campo(detalle, 'VentaId'));
        const productoId = Number(campo(detalle, 'ProductoId'));
        const unidades = Number(campo(detalle, 'Cantidad'));
        const dias = Number(campo(detalle, 'DiasGarantiaVenta'));
        if (!detalleId || !unidades || !dias) continue;
        const p = productosPorId.get(productoId);
        const v = ventasPorId.get(ventaId);
        const etiqueta = [
          `Detalle #${detalleId}`,
          `Venta #${ventaId}`,
          (campo(v, 'NumeroFactura') || ''),
          (campo(p, 'Nombre') || `Producto #${productoId}`),
          `Cant. ${unidades}`,
          `${dias} días`
        ].filter(Boolean).join(' · ');
        const opcion = document.createElement('option');
        opcion.value = String(detalleId);
        opcion.textContent = etiqueta;
        selector.appendChild(opcion);
      }
      if ([...selector.options].some(o => o.value === anterior)) selector.value = anterior;
      selector.disabled = selector.options.length < 2 || guardando;
      actualizarBoton();
    }

    function recibir(evento) {
      let dato = evento.data;
      if (typeof dato === 'string') {
        try { dato = JSON.parse(dato); } catch { return; }
      }
      if (!dato || typeof dato !== 'object') return;
      if (dato.type === 'detalles-venta:list') {
        detalles = Array.isArray(dato.data) ? dato.data : [];
        cargaronDetalles = true;
        clearTimeout(esperaCarga);
        pintarDetalles();
        if (!detalles.length) informar('No hay detalles de venta registrados.');
        else if (selector.disabled) informar('No hay ventas con garantía configurada.');
      } else if (dato.type === 'productos:list') {
        productos = Array.isArray(dato.data) ? dato.data : [];
        pintarDetalles();
      } else if (dato.type === 'ventas:list') {
        ventas = Array.isArray(dato.data) ? dato.data : [];
        pintarDetalles();
      } else if (dato.type === 'garantias:solicitudRegistrada') {
        clearTimeout(esperaRegistro);
        guardando = false;
        guardar.disabled = true;
        selector.disabled = true;
        cantidad.disabled = true;
        descripcion.disabled = true;
        observaciones.disabled = true;
        const r = dato.data || {};
        informar(`Solicitud registrada correctamente. Garantía #${campo(r, 'GarantiaId') || '—'} · Estado: ${campo(r, 'EstadoGarantia') || 'SOLICITADA'}.`, true);
      } else if (dato.type === 'garantias:solicitudError' || dato.type === 'error') {
        clearTimeout(esperaRegistro);
        guardando = false;
        selector.disabled = selector.options.length < 2;
        actualizarBoton();
        informar(dato.message || 'No se pudo registrar la solicitud.');
      }
    }

    window.addEventListener('message', recibir);
    if (window.parent === window && window.chrome?.webview?.addEventListener) {
      window.chrome.webview.addEventListener('message', recibir);
    }

    selector.addEventListener('change', () => {
      const detalle = detalles.find(d => Number(campo(d, 'DetalleVentaId')) === Number(selector.value));
      const maximo = Number(campo(detalle, 'Cantidad'));
      cantidad.max = maximo > 0 ? String(maximo) : '';
      if (maximo > 0 && Number(cantidad.value) > maximo) cantidad.value = String(maximo);
    });

    formulario.addEventListener('submit', e => {
      e.preventDefault();
      if (guardando) return;
      const detalleId = Number(selector.value);
      const unidades = Number(cantidad.value);
      const falla = descripcion.value.trim();
      const obs = observaciones.value.trim();
      const detalle = detalles.find(d => Number(campo(d, 'DetalleVentaId')) === detalleId);
      if (!detalleId || !detalle) return informar('Selecciona un detalle de venta válido.');
      if (!Number.isSafeInteger(unidades) || unidades <= 0) return informar('Ingresa una cantidad válida.');
      if (unidades > Number(campo(detalle, 'Cantidad'))) return informar('La cantidad excede las unidades de la venta.');
      if (!falla || falla.length > 1000) return informar('Describe la falla (máximo 1000 caracteres).');
      if (obs.length > 1000) return informar('Las observaciones superan 1000 caracteres.');
      if (!formulario.checkValidity()) { formulario.reportValidity(); return; }

      const solicitud = {
        type: 'garantias:registrarSolicitud',
        data: {
          DetalleVentaId: detalleId,
          CantidadReclamada: unidades,
          DescripcionFalla: falla,
          Observaciones: obs || null
        }
      };
      if (!emitir(solicitud)) return informar('Abre este formulario dentro de AutoParts.');
      guardando = true;
      informar('Registrando solicitud...');
      actualizarBoton();
      clearTimeout(esperaRegistro);
      esperaRegistro = setTimeout(() => {
        if (guardando) {
          guardando = false;
          actualizarBoton();
          informar('No se recibió confirmación. Actualiza el listado antes de intentar registrarla otra vez.');
        }
      }, 15000);
    });

    document.getElementById('cancelar').addEventListener('click', () => emitir({ type: 'cancelar' }));

    if (!emitir({ type: 'detalles-venta:selectAll' })) {
      informar('Abre este formulario desde el Dashboard de AutoParts.');
    } else {
      emitir({ type: 'productos:selectAll' });
      emitir({ type: 'ventas:selectAll' });
      esperaCarga = setTimeout(() => {
        if (!cargaronDetalles) informar('No se recibió la lista de ventas. Comprueba la conexión con SQL Server.');
      }, 12000);
    }
  </script>
</body>
</html>
