<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>AutoParts | Marcas</title>
				<style>
					:root { color-scheme: dark; }
					* { box-sizing: border-box; }
					body {
					margin: 0;
					min-height: 100vh;
					color: #f5f5f7;
					font-family: 'Segoe UI', Arial, sans-serif;
					background: radial-gradient(ellipse at 95% 0%, rgba(136, 16, 25, 0.18), transparent 38%), #090a0d;
					}
					button, input { font: inherit; }
					button { cursor: pointer; }
					.contenedor {
					max-width: 1500px;
					margin: auto;
					padding: 35px;
					}
					.encabezado {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 20px;
					margin-bottom: 30px;
					}
					.etiqueta {
					display: flex;
					align-items: center;
					gap: 9px;
					color: #ffbd37;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: 3px;
					margin-bottom: 12px;
					}
					h1 {
					margin: 0;
					font-size: clamp(28px, 3vw, 39px);
					font-weight: 800;
					letter-spacing: -1px;
					}
					h1 span { color: #ffbd2e; }
					.subtitulo {
					color: #a9aab3;
					font-size: 13px;
					margin-top: 9px;
					line-height: 1.6;
					}
					.btn-nueva {
					display: flex;
					align-items: center;
					justify-content: center;
					gap: 10px;
					padding: 14px 20px;
					border: 1px solid #ff6053;
					border-radius: 10px;
					background: linear-gradient(110deg, #b10b1f, #e52a37, #ffac28);
					color: #fff;
					font-size: 13px;
					font-weight: 750;
					box-shadow: 0 0 18px rgba(233, 31, 48, 0.27), inset 0 1px 1px #ffffff30;
					transition: transform .2s, filter .2s;
					}
					.btn-nueva:hover {
					transform: translateY(-2px);
					filter: brightness(1.12);
					}
					.panel {
					border: 1px solid #4d3038;
					border-radius: 15px;
					background: linear-gradient(140deg, #171519, #0d0e11 65%, #140f12);
					box-shadow: 0 12px 35px #0005, inset 0 0 18px #0004;
					overflow: hidden;
					}
					.panel-superior {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 16px;
					padding: 23px 25px;
					border-bottom: 1px solid #34292e;
					}
					.panel-titulo h2 {
					font-size: 18px;
					margin: 0 0 7px;
					}
					.panel-titulo p {
					font-size: 12px;
					color: #9798a1;
					margin: 0;
					}
					.herramientas {
					display: flex;
					align-items: center;
					flex-wrap: nowrap;
					gap: 9px;
					}
					.buscador {
					display: flex;
					align-items: center;
					background: #111216;
					border: 1px solid #51454c;
					border-radius: 9px;
					width: min(340px, 100%);
					min-width: 0;
					flex: 1 1 240px;
					height: 44px;
					padding: 0 13px;
					}
					.buscador:focus-within {
					border-color: #ff414e;
					box-shadow: 0 0 12px #ff334020;
					}
					.buscador svg {
					flex-shrink: 0;
					color: #a7a7b0;
					}
					.buscador input {
					border: none;
					background: transparent;
					color: white;
					outline: none;
					width: 100%;
					padding: 0 10px;
					font-size: 12px;
					}
					.buscador input::placeholder { color: #898992; }
					.btn-actualizar {
					width: 44px;
					height: 44px;
					padding: 0;
					display: inline-flex;
					align-items: center;
					justify-content: center;
					flex: 0 0 44px;
					color: #e8e8eb;
					background: #211a1f;
					border: 1px solid #60444d;
					border-radius: 9px;
					transition: .2s;
					}
					.btn-actualizar:hover {
					background: #3a2027;
					border-color: #ed4247;
					}
					.tabla-contenedor {
					overflow-x: auto;
					min-height: 240px;
					}
					table {
					border-collapse: collapse;
					width: 100%;
					font-size: 13px;
					}
					thead { background: #1b1b21; }
					th {
					padding: 16px 23px;
					color: #babac4;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: .5px;
					text-align: left;
					white-space: nowrap;
					border-bottom: 1px solid #373035;
					}
					td {
					padding: 16px 23px;
					border-bottom: 1px solid #2c2a30;
					color: #e4e4e9;
					}
					tbody tr { transition: background .15s; }
					tbody tr:hover { background: #25181e; }
					.codigo {
					color: #ffbe42;
					font-weight: 700;
					}
					.nombre {
					color: #fff;
					font-weight: 650;
					}
					.estado {
					display: inline-flex;
					align-items: center;
					gap: 8px;
					border-radius: 30px;
					padding: 6px 12px;
					font-size: 11px;
					font-weight: 700;
					}
					.estado::before {
					content: "";
					width: 6px;
					height: 6px;
					border-radius: 50%;
					background: currentColor;
					}
					.estado.activo {
					background: #103d29;
					border: 1px solid #17643e;
					color: #78ecaa;
					}
					.estado.inactivo {
					background: #40272a;
					border: 1px solid #704147;
					color: #ff8e94;
					}
					.estado.otro {
					background: #403514;
					border: 1px solid #746027;
					color: #ffd274;
					}
					.vacio {
					text-align: center;
					padding: 65px 20px;
					color: #9ea0ab;
					}
					.vacio svg {
					color: #ffb92e;
					margin-bottom: 12px;
					opacity: .8;
					}
					.vacio strong {
					display: block;
					color: #e6e6eb;
					margin-bottom: 7px;
					}
					.vacio p {
					font-size: 12px;
					margin: 0;
					}
					.panel-inferior {
					display: flex;
					justify-content: space-between;
					align-items: center;
					flex-wrap: wrap;
					gap: 10px;
					padding: 16px 25px;
					border-top: 1px solid #34292e;
					font-size: 12px;
					color: #9999a3;
					}
					.total strong { color: #ffbd31; }
					.indicador {
					display: flex;
					align-items: center;
					gap: 8px;
					}
					.punto {
					width: 7px;
					height: 7px;
					background: #ffbd35;
					border-radius: 50%;
					box-shadow: 0 0 10px #ffbd35;
					}
					@media (max-width: 850px) {
					.contenedor { padding: 20px; }
					.panel-superior { padding: 18px; }
					.herramientas { width: 100%; }
					.buscador {
					flex: 1;
					min-width: 0;
					}
					th, td { padding: 14px 13px; }
					.panel-inferior { padding: 16px; }
					}
				
.acciones-marca{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boton-marca{border:1px solid #65444c;background:#241a20;border-radius:8px;padding:8px 12px;color:#f4f4f5;font-size:12px;font-weight:700}
.boton-marca:hover{border-color:#ffbd35;background:#35212a}
.boton-marca.desactivar{border-color:#91434c;color:#ff9ca2}
.boton-marca:disabled{opacity:.4;cursor:not-allowed}
.mensaje-marca{padding:12px 25px;color:#ffbd69;font-size:12px;min-height:38px}
.modal-marca[hidden]{display:none!important}
.modal-marca{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}
.modal-panel-marca{width:min(100%,480px);background:linear-gradient(145deg,#21161b,#111115);border:1px solid #81424a;border-radius:16px;padding:26px;box-shadow:0 25px 80px #000a}
.modal-panel-marca h2{margin:0 0 18px;color:#fff}
.modal-panel-marca label{display:block;font-size:13px;margin-bottom:8px}
.modal-panel-marca input{width:100%;padding:13px;background:#101115;border:1px solid #6b444d;border-radius:9px;color:#fff;outline:none}
.modal-acciones-marca{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.modal-acciones-marca button{border-radius:9px;padding:11px 17px;font-weight:700}
.modal-guardar-marca{background:linear-gradient(105deg,#e42739,#ffbd2b);border:0;color:#140b0d}

.boton-marca.habilitar{border-color:#247e54;color:#91f2bb;background:#11291e}
.boton-marca.habilitar:hover{border-color:#5fd39a;background:#173b29}
.modal-descripcion-marca{color:#c1b8bf;font-size:13px;line-height:1.7;margin:0}
.modal-nombre-marca{color:#ffbd35;font-weight:800}
.modal-confirmar-marca{background:#9e2533;border:1px solid #f15d69;color:#fff}
.modal-confirmar-marca.habilitar{background:#155a3b;border-color:#48c78b;color:#e3ffef}

.modal-resultado-marca{text-align:center;width:min(100%,430px)}
.icono-resultado-marca{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;margin:0 auto 17px;border:1px solid #318d61;background:#113925;color:#8cf0af;font-size:33px;font-weight:800}
.modal-resultado-marca h2{margin:0 0 10px}
.modal-resultado-marca p{color:#c6c3c9;font-size:14px;line-height:1.6;margin:0 0 23px}
.modal-resultado-marca .modal-acciones-marca{justify-content:center}
.modal-resultado-marca .modal-guardar-marca{min-width:120px;cursor:pointer}

.modal-detalles-marca{width:min(100%,460px)}
.modal-detalles-marca h2{margin-bottom:24px}
.detalle-fila-marca{padding:15px 0;border-bottom:1px solid #3d2b33}
.detalle-fila-marca:first-of-type{padding-top:0}
.detalle-etiqueta-marca{display:block;color:#a8a3ac;font-size:12px;margin-bottom:8px}
.detalle-valor-marca{color:#fff;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.modal-detalles-marca .modal-acciones-marca{margin-top:24px}
.modal-detalles-marca .modal-guardar-marca{min-width:110px;cursor:pointer}
.boton-marca.ver{border-color:#675277;color:#e4c8ff}
.boton-marca.ver:hover{background:#30213b;border-color:#ab75d1}
.acciones-marca{gap:9px;flex-wrap:nowrap}
.acciones-marca .boton-marca{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:10px;transition:background .2s,border-color .2s,transform .2s}
.acciones-marca .boton-marca svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.acciones-marca .boton-marca:hover:not(:disabled){transform:translateY(-2px)}
.acciones-marca .boton-marca.ver{color:#62b9ff;border-color:#285f91;background:#0e2234}
.acciones-marca .boton-marca.ver:hover{color:#94d2ff;background:#18374f;border-color:#419cdb}
.acciones-marca .boton-marca.editar{color:#75e4a4;border-color:#276546;background:#10291d}
.acciones-marca .boton-marca.editar:hover{color:#a2f5c1;background:#173d2a;border-color:#43b878}
.acciones-marca .boton-marca.desactivar{color:#ff818d;border-color:#81333e;background:#31151d}
.acciones-marca .boton-marca.desactivar:hover{color:#ffb0b9;background:#4c1d27;border-color:#ef5366}
.acciones-marca .boton-marca.habilitar{color:#74e8ad;border-color:#297d55;background:#102d20}
.acciones-marca .boton-marca.habilitar:hover{color:#adffd0;background:#19432e;border-color:#4ac587}
</style>
			</head>
	<body>
		<main class="contenedor">
			<header class="encabezado">
				<div>
					<div class="etiqueta">AUTOPARTS · ADMINISTRACIÓN</div>
					<h1>
						Gestión de <span>Marcas</span>
					</h1>
				</div>
				<button class="btn-nueva" type="button" id="btnNuevoMarca">
					<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
						<path d="M12 5v14M5 12h14"/>
					</svg>
					Nueva marca
				</button>
			</header>

			<section class="panel">
				<div class="panel-superior">
					<div class="panel-titulo">
						<h2>Listado de marcas</h2>
					</div>
					<div class="herramientas">
						<div class="buscador">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
								<circle cx="11" cy="11" r="7"/>
								<path d="m16 16 5 5"/>
							</svg>
							<input id="buscarMarca" type="search" autocomplete="off" placeholder="Buscar marcas..." aria-label="Buscar marcas">
                    </div>
						<button class="btn-actualizar" type="button" id="btnActualizar" title="Actualizar marcas" aria-label="Actualizar marcas">
							<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M20 11a8 8 0 1 0-2 6"/>
								<path d="M20 4v7h-7"/>
							</svg>
						</button>
					</div>
				</div>

				<div id="avisoMarca" class="mensaje-marca" role="status" aria-live="polite"></div>
                <div class="tabla-contenedor">
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>Nombre</th>
                                <th>Estado</th>
                                <th>Acciones</th>
							</tr>
						</thead>
						<tbody id="marcaRows">
							<tr>
								<td colspan="4">
									<div class="vacio">Cargando marcas...</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<footer class="panel-inferior">
					<div class="total">
						Total de marcas: <strong id="totalMarcas">0</strong>
					</div>
					<div class="indicador">
						<span class="punto"></span>
						AutoParts · Gestión de marcas
					</div>
				</footer>
			</section>
		</main>

        <div id="modalEditarMarca" class="modal-marca" hidden>
<div class="modal-panel-marca" role="dialog" aria-modal="true" aria-labelledby="tituloEditarMarca">
<h2 id="tituloEditarMarca">Editar marca</h2>
<form id="formEditarMarca">
<label for="nombreEditarMarca">Nombre de la marca</label>
<input id="nombreEditarMarca" type="text" maxlength="100" required autocomplete="off">
<div class="modal-acciones-marca">
<button type="button" class="boton-marca" id="cancelarEditarMarca">Cancelar</button>
<button type="submit" class="modal-guardar-marca" id="guardarEditarMarca">Guardar cambios</button>
</div></form></div></div>
        <div id="modalConfirmarMarca" class="modal-marca" hidden>
            <div class="modal-panel-marca" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmarMarca" aria-describedby="descripcionConfirmarMarca">
                <h2 id="tituloConfirmarMarca">Confirmar cambio</h2>
                <p id="descripcionConfirmarMarca" class="modal-descripcion-marca"></p>
                <div class="modal-acciones-marca">
                    <button type="button" class="boton-marca" id="cancelarCambioMarca">Cancelar</button>
                    <button type="button" class="modal-confirmar-marca" id="confirmarCambioMarca">Confirmar</button>
                </div>
            </div>
        </div>
<div id="modalVerMarca" class="modal-marca" hidden>
    <div class="modal-panel-marca modal-detalles-marca" role="dialog" aria-modal="true" aria-labelledby="tituloVerMarca">
        <h2 id="tituloVerMarca">Detalles de la marca</h2>
        <div class="detalle-fila-marca">
            <span class="detalle-etiqueta-marca">Nombre de la marca</span>
            <div class="detalle-valor-marca" id="verNombreMarca"></div>
        </div>
        <div class="detalle-fila-marca">
            <span class="detalle-etiqueta-marca">Estado</span>
            <span id="verEstadoMarca" class="estado"></span>
        </div>
        <div class="modal-acciones-marca">
            <button type="button" class="modal-guardar-marca" id="cerrarVerMarca">Cerrar</button>
        </div>
    </div>
</div>
<div id="modalResultadoMarca" class="modal-marca" hidden>
    <div class="modal-panel-marca modal-resultado-marca" role="dialog" aria-modal="true" aria-labelledby="tituloResultadoMarca" aria-describedby="textoResultadoMarca">
        <div class="icono-resultado-marca" aria-hidden="true">✓</div>
        <h2 id="tituloResultadoMarca">Operación realizada</h2>
        <p id="textoResultadoMarca"></p>
        <div class="modal-acciones-marca">
            <button type="button" class="modal-guardar-marca" id="aceptarResultadoMarca">Aceptar</button>
        </div>
    </div>
</div>
<script>
            'use strict';
            let marcas = [];
            let marcaEditandoId = 0;
            let marcaCambioId = 0;
            let ultimaAccionMarca = '';
            let operacionPendiente = false;
            const $ = id => document.getElementById(id);

            function escapar(valor) {
                return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[caracter]));
            }

            function obtener(objeto, ...nombres) {
                for (const nombre of nombres) {
                    if (objeto && objeto[nombre] !== undefined && objeto[nombre] !== null)
                        return objeto[nombre];
                }
                return '';
            }

            function enviarACSharp(mensaje) {
                if (window.parent !== window) {
                    window.parent.postMessage(mensaje, '*');
                    return true;
                }
                if (window.chrome?.webview?.postMessage) {
                    window.chrome.webview.postMessage(mensaje);
                    return true;
                }
                aviso('Esta pantalla requiere el Dashboard de AutoParts o WebView2.');
                return false;
            }

            function aviso(texto) {
                $('avisoMarca').textContent = texto || '';
            }

            function mostrarResultadoMarca(titulo, texto) {
                $('tituloResultadoMarca').textContent = titulo;
                $('textoResultadoMarca').textContent = texto;
                $('modalResultadoMarca').hidden = false;
                $('aceptarResultadoMarca').focus();
            }

            function cerrarResultadoMarca() {
                $('modalResultadoMarca').hidden = true;
            }

            function mostrarMensaje(texto) {
                $('marcaRows').innerHTML = '<tr><td colspan="4"><div class="vacio"><strong>' +
                    escapar(texto) + '</strong></div></td></tr>';
            }

            function pintarMarcas() {
                const texto = $('buscarMarca').value.trim().toLocaleLowerCase('es');
                const filtrados = marcas.filter(marca => {
                    const id = obtener(marca, 'MarcaId', 'marcaId');
                    const nombre = obtener(marca, 'Nombre', 'nombre');
                    const estado = Number(obtener(marca, 'EstadoId', 'estadoId'));
                    return [id, nombre, estado === 1 ? 'activo' : 'inactivo']
                        .some(valor => String(valor).toLocaleLowerCase('es').includes(texto));
                });
                $('totalMarcas').textContent = String(filtrados.length);
                if (!filtrados.length) {
                    mostrarMensaje(texto ? 'No se encontraron coincidencias.' : 'No hay marcas registrados.');
                    return;
                }
                $('marcaRows').innerHTML = filtrados.map(marca => {
                    const id = Number(obtener(marca, 'MarcaId', 'marcaId'));
                    const nombre = obtener(marca, 'Nombre', 'nombre');
                    const estado = Number(obtener(marca, 'EstadoId', 'estadoId'));
                    const activo = estado === 1;
                    return `<tr>
                        <td class="codigo">#${escapar(id)}</td>
                        <td class="nombre">${escapar(nombre)}</td>
                        <td><span class="estado ${activo ? 'activo' : 'inactivo'}">${activo ? 'Activo' : 'Inactivo'}</span></td>
                        <td><div class="acciones-marca">
                            <button type="button" class="boton-marca ver" data-ver="${id}" title="Ver detalles" aria-label="Ver detalles de ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                            <button type="button" class="boton-marca editar" data-editar="${id}" title="Editar marca" aria-label="Editar ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button>
                            <button type="button" class="boton-marca ${activo ? 'desactivar' : 'habilitar'}" data-cambiar-estado="${id}" title="${activo ? 'Eliminar (desactivar)' : 'Habilitar'}" aria-label="${activo ? 'Eliminar' : 'Habilitar'} ${escapar(nombre)}">${activo ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6"/><path d="M10 10v7M14 10v7"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'}</button>
                        </div></td>
                    </tr>`;
                }).join('');
            }

            function solicitarMarcas() {
                aviso('');
                mostrarMensaje('Cargando marcas...');
                enviarACSharp({ type: 'marcas:selectAll' });
            }

            function abrirVerMarca(id) {
                const marca = marcas.find(x => Number(obtener(x, 'MarcaId', 'marcaId')) === id);
                if (!marca || operacionPendiente) return;
                const estado = Number(obtener(marca, 'EstadoId', 'estadoId'));
                $('verNombreMarca').textContent = String(obtener(marca, 'Nombre', 'nombre'));
                const etiqueta = $('verEstadoMarca');
                etiqueta.textContent = estado === 1 ? 'Activo' : estado === 2 ? 'Inactivo' : 'Desconocido';
                etiqueta.className = 'estado ' + (estado === 1 ? 'activo' : estado === 2 ? 'inactivo' : 'otro');
                $('modalVerMarca').hidden = false;
                $('cerrarVerMarca').focus();
            }

            function cerrarVerMarca() {
                $('modalVerMarca').hidden = true;
            }

            function abrirEditor(id) {
                const marca = marcas.find(x => Number(obtener(x, 'MarcaId', 'marcaId')) === id);
                if (!marca || operacionPendiente) return;
                marcaEditandoId = id;
                $('nombreEditarMarca').value = String(obtener(marca, 'Nombre', 'nombre'));
                $('modalEditarMarca').hidden = false;
                $('nombreEditarMarca').focus();
            }

            function cerrarEditor() {
                $('modalEditarMarca').hidden = true;
                marcaEditandoId = 0;
            }

            function abrirConfirmacionMarca(id) {
                const marca = marcas.find(x => Number(obtener(x, 'MarcaId', 'marcaId')) === id);
                if (!marca || operacionPendiente) return;
                const activo = Number(obtener(marca, 'EstadoId', 'estadoId')) === 1;
                marcaCambioId = id;
                const accion = activo ? 'desactivar' : 'habilitar';
                $('tituloConfirmarMarca').textContent = activo ? '¿Eliminar marca?' : '¿Habilitar marca?';
                $('descripcionConfirmarMarca').textContent = activo
                    ? `¿Seguro que deseas desactivar la marca "${obtener(marca, 'Nombre', 'nombre')}"?`
                    : `¿Seguro que deseas habilitar la marca "${obtener(marca, 'Nombre', 'nombre')}"?`;
                $('confirmarCambioMarca').textContent = activo ? 'Sí, desactivar' : 'Sí, habilitar';
                $('confirmarCambioMarca').classList.toggle('habilitar', !activo);
                $('modalConfirmarMarca').hidden = false;
                $('cancelarCambioMarca').focus();
            }

            function cerrarConfirmacionMarca() {
                if (operacionPendiente) return;
                $('modalConfirmarMarca').hidden = true;
                marcaCambioId = 0;
            }

            function cambiarEstadoMarca() {
                if (operacionPendiente || marcaCambioId <= 0) return;
                const marca = marcas.find(x => Number(obtener(x, 'MarcaId', 'marcaId')) === marcaCambioId);
                if (!marca) return;
                const activo = Number(obtener(marca, 'EstadoId', 'estadoId')) === 1;
                const id = marcaCambioId;
                $('modalConfirmarMarca').hidden = true;
                marcaCambioId = 0;
                operacionPendiente = true;
                ultimaAccionMarca = activo ? 'desactivar' : 'habilitar';
                aviso(activo ? 'Desactivando marca...' : 'Habilitando marca...');
                if (!enviarACSharp({ type: 'marcas:desactivarIntegrado', data: { MarcaId: id } })) {
                    operacionPendiente = false;
                }
            }

            function recibirRespuesta(evento) {
                if (evento.source && window.parent !== window && evento.source !== window.parent) return;
                let mensaje = evento.data;
                if (typeof mensaje === 'string') {
                    try { mensaje = JSON.parse(mensaje); } catch { return; }
                }
                if (!mensaje || typeof mensaje !== 'object') return;
                if (mensaje.type === 'marcas:list') {
                    marcas = Array.isArray(mensaje.data) ? mensaje.data : [];
                    pintarMarcas();
                    return;
                }
                if (mensaje.type === 'marcas:actualizada' || mensaje.type === 'marcas:desactivada') {
                    const accion = mensaje.type === 'marcas:actualizada' ? 'actualizar' : ultimaAccionMarca;
                    operacionPendiente = false;
                    ultimaAccionMarca = '';
                    $('guardarEditarMarca').disabled = false;
                    cerrarEditor();
                    solicitarMarcas();
                    const titulo = accion === 'actualizar' ? 'Marca actualizada' :
                        accion === 'habilitar' ? 'Marca habilitada' : 'Marca desactivada';
                    const texto = accion === 'actualizar' ? 'La marca se actualizó correctamente.' :
                        accion === 'habilitar' ? 'La marca se habilitó correctamente.' :
                        'La marca se desactivó correctamente.';
                    mostrarResultadoMarca(titulo, texto);
                    return;
                }
                if (mensaje.type === 'marcas:error' || mensaje.type === 'error') {
                    operacionPendiente = false;
                    $('guardarEditarMarca').disabled = false;
                    aviso(mensaje.message || 'No se pudo completar la operación.');
                }
            }

            $('marcaRows').addEventListener('click', evento => {
                const ver = evento.target.closest('[data-ver]');
                const editar = evento.target.closest('[data-editar]');
                const cambiar = evento.target.closest('[data-cambiar-estado]');
                if (ver) abrirVerMarca(Number(ver.dataset.ver));
                if (editar) abrirEditor(Number(editar.dataset.editar));
                if (cambiar) abrirConfirmacionMarca(Number(cambiar.dataset.cambiarEstado));
            });
            $('formEditarMarca').addEventListener('submit', evento => {
                evento.preventDefault();
                if (operacionPendiente || marcaEditandoId <= 0) return;
                const nombre = $('nombreEditarMarca').value.trim();
                if (!nombre || nombre.length > 100) {
                    aviso('Ingresa un nombre de 1 a 100 caracteres.');
                    return;
                }
                const original = marcas.find(x => Number(obtener(x, 'MarcaId', 'marcaId')) === marcaEditandoId);
                if (!original) { aviso('No se encontró la marca.'); return; }
                operacionPendiente = true;
                ultimaAccionMarca = 'actualizar';
                $('guardarEditarMarca').disabled = true;
                aviso('Guardando cambios...');
                if (!enviarACSharp({
                    type: 'marcas:actualizarIntegrado',
                    data: { MarcaId: marcaEditandoId, Nombre: nombre }
                })) {
                    operacionPendiente = false;
                    $('guardarEditarMarca').disabled = false;
                }
            });
            $('cerrarVerMarca').addEventListener('click', cerrarVerMarca);
            $('cancelarEditarMarca').addEventListener('click', cerrarEditor);
            $('aceptarResultadoMarca').addEventListener('click', cerrarResultadoMarca);
            $('cancelarCambioMarca').addEventListener('click', cerrarConfirmacionMarca);
            $('confirmarCambioMarca').addEventListener('click', cambiarEstadoMarca);
            $('btnNuevoMarca').addEventListener('click', () => enviarACSharp({ type: 'marcas:abrirNuevo' }));
            $('btnActualizar').addEventListener('click', solicitarMarcas);
            $('buscarMarca').addEventListener('input', pintarMarcas);
            window.addEventListener('message', recibirRespuesta);
            if (window.chrome?.webview?.addEventListener)
                window.chrome.webview.addEventListener('message', recibirRespuesta);
            solicitarMarcas();
        </script>
	</body>
</html>
