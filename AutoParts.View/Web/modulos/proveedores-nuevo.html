<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts | Nuevo proveedor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .contenedor { padding: 29px; }
        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 27px; }
        .panel {
            background: linear-gradient(145deg, #171418, #0e0e12);
            border: 1px solid #5a3139;
            border-radius: 14px;
            padding: 25px;
        }
        .campos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 18px;
        }
        .campo { margin-bottom: 21px; min-width: 0; }
        .campo.ancho { grid-column: 1 / -1; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            background: #111216;
            color: white;
            border: 1px solid #554c55;
            border-radius: 9px;
            font: inherit;
            outline: none;
        }
        input:focus {
            border-color: #ff3d46;
            box-shadow: 0 0 10px #e41b303b;
        }
        input::placeholder { color: #85858f; }
        .requerido { color: #ff4753; }
        .mensaje {
            color: #ffb64e;
            min-height: 18px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        button {
            padding: 13px 23px;
            border-radius: 9px;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            transition: .2s;
        }
        .cancelar {
            background: #242328;
            color: #e5e5e5;
            border: 1px solid #56535b;
        }
        .cancelar:hover { background: #353039; }
        .guardar {
            color: #140c0d;
            background: linear-gradient(105deg, #ff3543, #ffbd2b);
            box-shadow: 0 0 16px #e5233533;
        }
        .guardar:hover:not(:disabled) {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }
        .guardar:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 650px) {
            .contenedor { padding: 17px; }
            .panel { padding: 18px; }
            .campos { grid-template-columns: 1fr; }
            .campo.ancho { grid-column: auto; }
            .acciones { flex-wrap: wrap; }
        }
        .modal-exito[hidden] { display: none; }
        .modal-exito {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .8);
            display: grid;
            place-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-exito-panel {
            width: min(100%, 420px);
            padding: 32px 26px;
            text-align: center;
            background: linear-gradient(145deg, #22161b, #101115);
            border: 1px solid #79404a;
            border-radius: 16px;
            box-shadow: 0 20px 65px #000b;
        }
        .exito-simbolo {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: #113d29;
            border: 1px solid #34855d;
            color: #83edab;
            font-size: 32px;
            font-weight: 800;
        }
        .modal-exito-panel h2 { margin: 0 0 10px; font-size: 23px; }
        .modal-exito-panel p { color: #c9c5cb; font-size: 13px; margin: 0 0 24px; }
        .modal-exito-panel button { min-width: 124px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div>
                <h1>Nuevo proveedor</h1>
            </div>
        </div>
        <div class="panel">
            <form id="formProveedor">
                <div class="campos">
                    <div class="campo ancho">
                        <label for="nombreEmpresa">Nombre de la empresa <span class="requerido">*</span></label>
                        <input type="text" id="nombreEmpresa" maxlength="100" required autocomplete="organization">
                    </div>
                    <div class="campo">
                        <label for="nit">NIT <span class="requerido">*</span></label>
                        <input type="text" id="nit" maxlength="20" required>
                    </div>
                    <div class="campo">
                        <label for="telefono">Teléfono <span class="requerido">*</span></label>
                        <input type="tel" id="telefono" maxlength="25" required autocomplete="tel">
                    </div>
                    <div class="campo">
                        <label for="correo">Correo electrónico <span class="requerido">*</span></label>
                        <input type="email" id="correo" maxlength="150" required autocomplete="email">
                    </div>
                    <div class="campo">
                        <label for="contacto">Persona de contacto <span class="requerido">*</span></label>
                        <input type="text" id="contacto" maxlength="100" required>
                    </div>
                </div>
                <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>
                <div class="acciones">
                    <button class="cancelar" type="button" id="cancelar">Cancelar</button>
                    <button class="guardar" type="submit" id="guardar">Guardar proveedor</button>
                </div>
            </form>
        </div>
    </div>
    <div id="modalExito" class="modal-exito" hidden>
        <div class="modal-exito-panel" role="dialog" aria-modal="true" aria-labelledby="tituloExito">
            <div class="exito-simbolo" aria-hidden="true">✓</div>
            <h2 id="tituloExito">¡Proveedor guardado!</h2>
            <p>El proveedor se registró correctamente.</p>
            <button type="button" class="guardar" id="aceptarExito">Aceptar</button>
        </div>
    </div>
    <script>
        const formulario = document.getElementById('formProveedor');
        const campos = {
            NombreEmpresa: document.getElementById('nombreEmpresa'),
            NIT: document.getElementById('nit'),
            Telefono: document.getElementById('telefono'),
            Correo: document.getElementById('correo'),
            Contacto: document.getElementById('contacto')
        };
        const guardar = document.getElementById('guardar');
        const mensaje = document.getElementById('mensaje');
        let guardando = false;

        function enviar(datos) {
            if (window.parent !== window) {
                window.parent.postMessage(datos, '*');
                return true;
            }
            if (window.chrome?.webview?.postMessage) {
                window.chrome.webview.postMessage(datos);
                return true;
            }
            mensaje.textContent = 'No hay conexión con Windows Forms.';
            return false;
        }

        function restaurarGuardado() {
            guardando = false;
            guardar.disabled = false;
            guardar.textContent = 'Guardar proveedor';
        }

        document.getElementById('cancelar').addEventListener('click', () => {
            if (!guardando) enviar({ type: 'cancelar' });
        });

        formulario.addEventListener('submit', evento => {
            evento.preventDefault();
            if (guardando) return;

            const datos = Object.fromEntries(
                Object.entries(campos).map(([propiedad, control]) => [propiedad, control.value.trim()])
            );

            if (Object.values(datos).some(valor => !valor)) {
                mensaje.textContent = 'Completa todos los campos del proveedor.';
                return;
            }
            if (!formulario.reportValidity()) return;

            guardando = true;
            guardar.disabled = true;
            guardar.textContent = 'Guardando...';
            mensaje.textContent = '';

            if (!enviar({ type: 'guardar', data: datos })) restaurarGuardado();
        });

        document.getElementById('aceptarExito').addEventListener('click', () => {
            enviar({ type: 'cancelar' });
        });

        function recibirRespuesta(evento) {
            if (evento.source && window.parent !== window && evento.source !== window.parent) return;
            let respuesta = evento.data;
            if (typeof respuesta === 'string') {
                try { respuesta = JSON.parse(respuesta); } catch { return; }
            }
            if (!respuesta || typeof respuesta !== 'object') return;

            if (respuesta.type === 'proveedores:guardado') {
                document.getElementById('modalExito').hidden = false;
                document.getElementById('aceptarExito').focus();
                return;
            }
            if (respuesta.type === 'error' || respuesta.type === 'proveedores:error') {
                mensaje.textContent = respuesta.message || 'No se pudo guardar el proveedor.';
                restaurarGuardado();
            }
        }

        window.addEventListener('message', recibirRespuesta);
        if (window.chrome?.webview?.addEventListener) {
            window.chrome.webview.addEventListener('message', recibirRespuesta);
        }
    </script>
</body>
</html>
