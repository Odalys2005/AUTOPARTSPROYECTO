<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts | Nuevo vehículo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .contenedor { padding: 29px; }
        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .subtitulo {
            color: #ffbd35;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        h1 { margin: 0; font-size: 27px; }
        .descripcion { color: #a9a7ae; font-size: 13px; line-height: 1.5; }
        .icono {
            width: 47px;
            height: 47px;
            border: 1px solid #ee3642;
            border-radius: 12px;
            background: #5c111a;
            display: grid;
            place-items: center;
            font-size: 24px;
            color: #ffc42f;
            box-shadow: 0 0 20px #ca263044;
            flex-shrink: 0;
        }
        .panel {
            background: linear-gradient(145deg, #171418, #0e0e12);
            border: 1px solid #5a3139;
            border-radius: 14px;
            padding: 25px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }
        .campo { margin-bottom: 21px; }
        input {
            width: 100%;
            padding: 13px 14px;
            background: #111216;
            color: white;
            border: 1px solid #554c55;
            border-radius: 9px;
            font: inherit;
            outline: none;
        }
        input:focus {
            border-color: #ff3d46;
            box-shadow: 0 0 10px #e41b303b;
        }
        input::placeholder { color: #85858f; }
        .requerido { color: #ff4753; }
        .mensaje {
            color: #ffb64e;
            min-height: 18px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        button {
            padding: 13px 23px;
            border-radius: 9px;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            transition: .2s;
        }
        .cancelar {
            background: #242328;
            color: #e5e5e5;
            border: 1px solid #56535b;
        }
        .cancelar:hover { background: #353039; }
        .guardar {
            color: #140c0d;
            background: linear-gradient(105deg, #ff3543, #ffbd2b);
            box-shadow: 0 0 16px #e5233533;
        }
        .guardar:hover:not(:disabled) {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }
        .guardar:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 500px) {
            .contenedor { padding: 17px; }
            .panel { padding: 18px; }
            .acciones { flex-wrap: wrap; }
        }
        .modal-exito[hidden] { display: none; }
        .modal-exito {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .8);
            display: grid;
            place-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-exito-panel {
            width: min(100%, 420px);
            padding: 32px 26px;
            text-align: center;
            background: linear-gradient(145deg, #22161b, #101115);
            border: 1px solid #79404a;
            border-radius: 16px;
            box-shadow: 0 20px 65px #000b;
        }
        .exito-simbolo {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: #113d29;
            border: 1px solid #34855d;
            color: #83edab;
            font-size: 32px;
            font-weight: 800;
        }
        .modal-exito-panel h2 { margin: 0 0 10px; font-size: 23px; }
        .modal-exito-panel p { color: #c9c5cb; font-size: 13px; margin: 0 0 24px; }
        .modal-exito-panel button { min-width: 124px; }
    
        select { width: 100%; padding: 13px 14px; background: #111216; color: white; border: 1px solid #554c55; border-radius: 9px; font: inherit; outline: none; }
        select:focus { border-color: #ff3d46; box-shadow: 0 0 10px #e41b303b; }
        select:disabled { opacity: .6; }
        .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }
        .campo.ancho { grid-column: 1 / -1; }
        @media (max-width: 650px) { .campos { grid-template-columns: 1fr; } .campo.ancho { grid-column: auto; } }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div>
                <h1>Nuevo vehículo</h1>
            </div>
        </div>
        <div class="panel">
            <form id="formVehiculo" novalidate>
                <div class="campos">
                    <div class="campo">
                        <label for="marca">Marca <span class="requerido">*</span></label>
                        <select id="marca" required disabled><option value="">Cargando marcas...</option></select>
                    </div>
                    <div class="campo">
                        <label for="modelo">Modelo <span class="requerido">*</span></label>
                        <select id="modelo" required disabled><option value="">Primero selecciona una marca</option></select>
                    </div>
                    <div class="campo">
                        <label for="anio">Año del vehículo <span class="requerido">*</span></label>
                        <input id="anio" type="number" min="1886" max="32767" step="1"  inputmode="numeric" required>
                    </div>
                    <div class="campo">
                        <label for="cilindrada">Cilindrada <span class="requerido">*</span></label>
                        <input id="cilindrada" type="number" min="0.01" max="999.99" step="0.01"  inputmode="decimal" required>
                    </div>
                    <div class="campo ancho">
                        <label for="tipoMotor">Tipo de motor <span class="requerido">*</span></label>
                        <input id="tipoMotor" type="text" maxlength="100"  autocomplete="off" required>
                    </div>
                </div>
                <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>
                <div class="acciones">
                    <button class="cancelar" type="button" id="cancelar">Cancelar</button>
                    <button class="guardar" type="submit" id="guardar" disabled>Guardar vehículo</button>
                </div>
            </form>
        </div>
    </div>
    <div id="modalResultado" class="modal-exito" hidden>
        <div class="modal-exito-panel" role="dialog" aria-modal="true" aria-labelledby="tituloResultado">
            <div class="exito-simbolo" aria-hidden="true">✓</div>
            <h2 id="tituloResultado">¡Vehículo guardado!</h2>
            <p>El vehículo se registró correctamente.</p>
            <button type="button" class="guardar" id="aceptarResultado">Aceptar</button>
        </div>
    </div>
    <script>
        "use strict";
        const form = document.getElementById('formVehiculo');
        const marcaSelect = document.getElementById('marca');
        const modeloSelect = document.getElementById('modelo');
        const anioInput = document.getElementById('anio');
        const cilindradaInput = document.getElementById('cilindrada');
        const motorInput = document.getElementById('tipoMotor');
        const mensaje = document.getElementById('mensaje');
        const botonGuardar = document.getElementById('guardar');
        const modalResultado = document.getElementById('modalResultado');
        let marcas = [];
        let modelos = [];
        let marcasCargadas = false;
        let modelosCargados = false;
        let guardando = false;
        let temporizadorCarga;

        function obtener(objeto, ...llaves) {
            for (const llave of llaves) {
                if (objeto != null && objeto[llave] !== undefined && objeto[llave] !== null) return objeto[llave];
            }
            return '';
        }

        function enviar(mensajeEnviado) {
            if (window.parent !== window) {
                window.parent.postMessage(mensajeEnviado, '*');
                return true;
            }
            if (window.chrome?.webview?.postMessage) {
                window.chrome.webview.postMessage(mensajeEnviado);
                return true;
            }
            mostrarError('Este formulario debe abrirse dentro de AutoParts (WebView2).');
            return false;
        }

        function mostrarError(texto) {
            mensaje.textContent = texto;
        }

        function actualizarBoton() {
            botonGuardar.disabled = guardando || !marcasCargadas || !modelosCargados || marcaSelect.disabled || modeloSelect.disabled;
        }

        function rellenar(select, lista, claveId, placeholder) {
            const anterior = select.value;
            select.replaceChildren();
            const primera = document.createElement('option');
            primera.value = '';
            primera.textContent = placeholder;
            select.append(primera);
            for (const elemento of lista) {
                const id = Number(obtener(elemento, claveId, claveId.charAt(0).toLowerCase() + claveId.slice(1)));
                const nombre = obtener(elemento, 'Nombre', 'nombre');
                if (!Number.isInteger(id) || id <= 0 || !nombre) continue;
                const opcion = document.createElement('option');
                opcion.value = String(id);
                opcion.textContent = String(nombre);
                select.append(opcion);
            }
            select.disabled = select.options.length < 2;
            if ([...select.options].some(x => x.value === anterior)) select.value = anterior;
            actualizarBoton();
        }

        function filtrarModelos() {
            const marcaId = Number(marcaSelect.value);
            const disponibles = modelos.filter(modelo =>
                marcaId > 0 &&
                Number(obtener(modelo, 'MarcaId', 'marcaId')) === marcaId &&
                Number(obtener(modelo, 'EstadoId', 'estadoId')) === 1
            );
            rellenar(modeloSelect, disponibles, 'ModeloId',
                !marcaId ? 'Primero selecciona una marca' :
                disponibles.length ? 'Selecciona un modelo' : 'No hay modelos activos para esta marca');
            if (marcaId && modelosCargados && !disponibles.length) {
                mostrarError('Registra o habilita primero un modelo en el módulo Modelos.');
            } else if (disponibles.length) {
                mostrarError('');
            }
        }

        function recibir(evento) {
            let respuesta = evento.data;
            if (typeof respuesta === 'string') {
                try { respuesta = JSON.parse(respuesta); } catch { return; }
            }
            if (!respuesta || typeof respuesta !== 'object') return;

            if (respuesta.type === 'marcas:list') {
                marcas = (Array.isArray(respuesta.data) ? respuesta.data : []).filter(marca =>
                    Number(obtener(marca, 'EstadoId', 'estadoId')) === 1
                );
                marcasCargadas = true;
                rellenar(marcaSelect, marcas, 'MarcaId', marcas.length ? 'Selecciona una marca' : 'No hay marcas activas');
                filtrarModelos();
                if (!marcas.length) mostrarError('Registra o habilita una marca en el módulo Marcas.');
            } else if (respuesta.type === 'modelos:list') {
                modelos = Array.isArray(respuesta.data) ? respuesta.data : [];
                modelosCargados = true;
                filtrarModelos();
                if (!modelos.some(modelo => Number(obtener(modelo, 'EstadoId', 'estadoId')) === 1)) {
                    mostrarError('Registra o habilita un modelo en el módulo Modelos.');
                }
            } else if (respuesta.type === 'vehiculos:guardado') {
                clearTimeout(temporizadorCarga);
                guardando = false;
                botonGuardar.textContent = 'Guardar vehículo';
                actualizarBoton();
                mostrarError('');
                modalResultado.hidden = false;
                document.getElementById('aceptarResultado').focus();
            } else if (respuesta.type === 'vehiculos:error' || respuesta.type === 'error') {
                clearTimeout(temporizadorCarga);
                guardando = false;
                botonGuardar.textContent = 'Guardar vehículo';
                actualizarBoton();
                mostrarError(respuesta.message || 'No se pudo registrar el vehículo.');
            }

            if (marcasCargadas && modelosCargados) clearTimeout(temporizadorCarga);
        }

        window.addEventListener('message', recibir);
        if (window.chrome?.webview?.addEventListener) window.chrome.webview.addEventListener('message', recibir);
        marcaSelect.addEventListener('change', filtrarModelos);
        document.getElementById('cancelar').addEventListener('click', () => enviar({ type: 'cancelar' }));
        document.getElementById('aceptarResultado').addEventListener('click', () => enviar({ type: 'cancelar' }));

        form.addEventListener('submit', evento => {
            evento.preventDefault();
            if (guardando || !modalResultado.hidden) return;

            const marcaId = Number(marcaSelect.value);
            const modeloId = Number(modeloSelect.value);
            const anio = Number(anioInput.value);
            const cilindrada = Number(cilindradaInput.value);
            const tipoMotor = motorInput.value.trim();
            const anioMaximo = Math.min(new Date().getFullYear() + 2, 32767);

            if (!marcas.some(marca => Number(obtener(marca, 'MarcaId', 'marcaId')) === marcaId)) {
                mostrarError('Selecciona una marca activa.');
                marcaSelect.focus();
                return;
            }
            if (!modelos.some(modelo =>
                Number(obtener(modelo, 'ModeloId', 'modeloId')) === modeloId &&
                Number(obtener(modelo, 'MarcaId', 'marcaId')) === marcaId &&
                Number(obtener(modelo, 'EstadoId', 'estadoId')) === 1
            )) {
                mostrarError('Selecciona un modelo activo de la marca elegida.');
                modeloSelect.focus();
                return;
            }
            if (!anioInput.value || !Number.isInteger(anio) || anio < 1886 || anio > anioMaximo) {
                mostrarError(`El año debe estar entre 1886 y ${anioMaximo}.`);
                anioInput.focus();
                return;
            }
            if (!cilindradaInput.value || !Number.isFinite(cilindrada) || cilindrada <= 0 || cilindrada > 999.99 ||
                Math.abs(Math.round(cilindrada * 100) - cilindrada * 100) > 1e-7) {
                mostrarError('La cilindrada debe ser positiva, hasta 999.99 y con máximo dos decimales.');
                cilindradaInput.focus();
                return;
            }
            if (!tipoMotor || tipoMotor.length > 100) {
                mostrarError('Ingresa el tipo de motor (máximo 100 caracteres).');
                motorInput.focus();
                return;
            }

            guardando = true;
            actualizarBoton();
            botonGuardar.textContent = 'Guardando...';
            mostrarError('');

            if (!enviar({
                type: 'guardar',
                data: { ModeloId: modeloId, Anio: anio, Cilindrada: cilindrada, TipoMotor: tipoMotor }
            })) {
                guardando = false;
                botonGuardar.textContent = 'Guardar vehículo';
                actualizarBoton();
            }
        });

        temporizadorCarga = setTimeout(() => {
            if (!marcasCargadas || !modelosCargados) {
                mostrarError('No se recibieron las listas de Marcas o Modelos. Revisa la conexión con AutoParts.');
            }
        }, 10000);

        enviar({ type: 'marcas:selectAll' });
        enviar({ type: 'modelos:selectAll' });
    </script>
</body>
</html>
