<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width,initial-scale=1.0">
				<title>AutoParts | Nuevo vehículo</title>
				<style>
					* { box-sizing: border-box; }
					body {
					margin: 0;
					min-height: 100vh;
					background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
					color: white;
					font-family: 'Segoe UI', Arial, sans-serif;
					}
					.contenedor { padding: 29px; }
					.encabezado {
					display: flex;
					justify-content: space-between;
					align-items: center;
					gap: 15px;
					margin-bottom: 25px;
					}
					.subtitulo {
					color: #ffbd35;
					font-size: 11px;
					letter-spacing: 3px;
					font-weight: 700;
					margin-bottom: 8px;
					}
					h1 { margin: 0; font-size: 27px; }
					.icono {
					width: 47px;
					height: 47px;
					border: 1px solid #ee3642;
					border-radius: 12px;
					background: #5c111a;
					display: grid;
					place-items: center;
					font-size: 24px;
					color: #ffc42f;
					box-shadow: 0 0 20px #ca263044;
					flex-shrink: 0;
					}
					.panel {
					background: linear-gradient(145deg, #171418, #0e0e12);
					border: 1px solid #5a3139;
					border-radius: 14px;
					padding: 25px;
					}
					label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 9px; }
					.campo { margin-bottom: 21px; }
					input, select {
					width: 100%;
					padding: 13px 14px;
					background: #111216;
					color: white;
					border: 1px solid #554c55;
					border-radius: 9px;
					font: inherit;
					outline: none;
					}
					input:focus, select:focus {
					border-color: #ff3d46;
					box-shadow: 0 0 10px #e41b303b;
					}
					input::placeholder { color: #85858f; }
					select:disabled { opacity: .6; }
					.requerido { color: #ff4753; }
					.mensaje { color: #ffb64e; min-height: 18px; font-size: 12px; margin-bottom: 12px; }
					.acciones { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
					button {
					padding: 13px 23px;
					border-radius: 9px;
					font-weight: 700;
					border: 0;
					cursor: pointer;
					transition: .2s;
					}
					.cancelar { background: #242328; color: #e5e5e5; border: 1px solid #56535b; }
					.cancelar:hover { background: #353039; }
					.guardar {
					color: #140c0d;
					background: linear-gradient(105deg, #ff3543, #ffbd2b);
					box-shadow: 0 0 16px #e5233533;
					}
					.guardar:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-2px); }
					.guardar:disabled { opacity: .55; cursor: not-allowed; }
					@media (max-width: 500px) {
					.contenedor { padding: 17px; }
					.panel { padding: 18px; }
					.acciones { flex-wrap: wrap; }
					}

					.contenedor { max-width:900px; margin:0 auto; }
					.campos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; }
					.campo.ancho { grid-column:1/-1; }
					.seccion { font-size:11px; font-weight:750; letter-spacing:2px; color:#ffbd35; margin:0 0 22px; }
					@media (max-width:650px) { .campos{grid-template-columns:1fr;} .campo.ancho{grid-column:auto;} }

					.contenedor { max-width:950px; margin:0 auto; }
					.campos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; }
					.campo.ancho { grid-column:1/-1; }
					.seccion { font-size:11px; font-weight:750; letter-spacing:2px; color:#ffbd35; margin:0 0 22px; }
					.requerido { color:#ff4753; }
					.mensaje { line-height:1.5; }
					input::-webkit-inner-spin-button { opacity:.7; }
					@media(max-width:650px) { .campos { grid-template-columns:1fr; } .campo.ancho { grid-column:auto; } }
				</style>
			</head>
	<body>
		<main class="contenedor">
			<header class="encabezado">
				<div>
					<div class="subtitulo">AUTOPARTS · CATÁLOGO AUTOMOTRIZ</div>
					<h1>Nuevo vehículo</h1>
				</div>
				<div class="icono">
					<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M4 15l2-6h12l2 6M3 15h18M6 15v4m12-4v4"/>
						<path d="M7 12h.01M17 12h.01"/>
					</svg>
				</div>
			</header>
			<section class="panel">
				<p class="seccion">IDENTIFICACIÓN DEL VEHÍCULO</p>
				<form id="formVehiculo" novalidate="">
					<div class="campos">
						<div class="campo">
							<label for="marca">
								Marca <span class="requerido">*</span>
							</label>
							<select id="marca" required="" disabled="">
								<option value="">Cargando marcas...</option>
							</select>
						</div>
						<div class="campo">
							<label for="modelo">
								Modelo <span class="requerido">*</span>
							</label>
							<select id="modelo" required="" disabled="">
								<option value="">Primero selecciona una marca</option>
							</select>
						</div>
						<div class="campo">
							<label for="anio">
								Año del vehículo <span class="requerido">*</span>
							</label>
							<input id="anio" type="number" min="1886" max="2100" step="1" placeholder="Ej. 2020" inputmode="numeric" required="">
                </div>
						<div class="campo">
							<label for="cilindrada">
								Cilindrada <span class="requerido">*</span>
							</label>
							<input id="cilindrada" type="number" min="0.01" max="999.99" step="0.01" placeholder="Ej. 1.60" inputmode="decimal" required="">
                </div>
						<div class="campo ancho">
							<label for="tipoMotor">
								Tipo de motor <span class="requerido">*</span>
							</label>
							<input id="tipoMotor" type="text" maxlength="100" placeholder="Ej. Gasolina, Diésel, Híbrido..." autocomplete="off" required="">
                </div>
						<div class="campo ancho">
							<label for="estado">
								Estado <span class="requerido">*</span>
							</label>
							<select id="estado" required="" disabled="">
								<option value="">Cargando estados...</option>
							</select>
						</div>
					</div>
					<div class="mensaje" id="mensaje" role="alert" aria-live="polite"></div>
					<div class="acciones">
						<button type="button" class="cancelar" id="cancelar">Cancelar</button>
						<button type="submit" class="guardar" id="guardar" disabled="">Guardar vehículo</button>
					</div>
				</form>
			</section>
		</main>
		<script>
			"use strict";
			const form = document.getElementById('formVehiculo');
			const marcaSelect = document.getElementById('marca');
			const modeloSelect = document.getElementById('modelo');
			const estadoSelect = document.getElementById('estado');
			const anioInput = document.getElementById('anio');
			const cilindradaInput = document.getElementById('cilindrada');
			const motorInput = document.getElementById('tipoMotor');
			const mensaje = document.getElementById('mensaje');
			const botonGuardar = document.getElementById('guardar');
			let marcas = [], modelos = [], estados = [];
			let marcasCargadas = false, modelosCargados = false, estadosCargados = false;
			let guardando = false, temporizadorCarga;

			function obtener(o,...llaves) {
			for (const k of llaves) if (o != null && o[k] !== undefined && o[k] !== null) return o[k];
			return '';
			}
			function enviar(mensaje) {
			if (window.parent !== window) { window.parent.postMessage(mensaje, '*'); return true; }
			if (window.chrome?.webview?.postMessage) { window.chrome.webview.postMessage(mensaje); return true; }
			mostrarError('Este formulario debe abrirse dentro de AutoParts (WebView2).');
			return false;
			}
			function mostrarError(texto) { mensaje.textContent = texto; }
			function rellenar(select, lista, claveId, placeholder) {
			const anterior = select.value;
			select.replaceChildren();
			const inicial = document.createElement('option');
			inicial.value = '';
			inicial.textContent = placeholder;
			select.append(inicial);
			for (const elemento of lista) {
			const id = Number(obtener(elemento, claveId, claveId.charAt(0).toLowerCase()+claveId.slice(1)));
			const nombre = obtener(elemento, 'Nombre','nombre');
			if (!Number.isInteger(id) || id <= 0 || !nombre) continue;
			const op = document.createElement('option');
			op.value = String(id);
			op.textContent = String(nombre);
			select.append(op);
			}
			select.disabled = select.options.length < 2;
    if ([...select.options].some(x=>x.value === anterior)) select.value = anterior;
    actualizarBoton();
}
function filtrarModelos() {
    const marcaId = Number(marcaSelect.value);
    const disponibles = modelos.filter(m => marcaId > 0 && Number(obtener(m,'MarcaId','marcaId')) === marcaId);
			rellenar(modeloSelect, disponibles, 'ModeloId',
			!marcaId ? 'Primero selecciona una marca' : disponibles.length ? 'Selecciona un modelo' : 'Sin modelos para esta marca');
			if (marcaId && modelosCargados && !disponibles.length) {
			mostrarError('Esta marca aún no tiene modelos. Registra primero uno en el módulo Modelos.');
			} else if (marcaId && disponibles.length) mostrarError('');
			}
			function actualizarBoton() {
			botonGuardar.disabled = guardando || !marcasCargadas || !modelosCargados || !estadosCargados
			|| marcaSelect.disabled || modeloSelect.disabled || estadoSelect.disabled;
			}
			function recibir(evento) {
			let res = evento.data;
			if (typeof res === 'string') { try { res = JSON.parse(res); } catch { return; } }
			if (!res || typeof res !== 'object') return;
			if (res.type === 'marcas:list') {
			marcas = Array.isArray(res.data) ? res.data : [];
			marcasCargadas = true;
			rellenar(marcaSelect, marcas, 'MarcaId', marcas.length ? 'Selecciona una marca' : 'No hay marcas disponibles');
			filtrarModelos();
			if (!marcas.length) mostrarError('Debes registrar una marca antes de crear un vehículo.');
			} else if (res.type === 'modelos:list') {
			modelos = Array.isArray(res.data) ? res.data : [];
			modelosCargados = true;
			filtrarModelos();
			if (!modelos.length) mostrarError('Debes registrar un modelo antes de crear un vehículo.');
			} else if (res.type === 'estados') {
			estados = Array.isArray(res.data) ? res.data : [];
			estadosCargados = true;
			rellenar(estadoSelect, estados, 'EstadoId', estados.length ? 'Selecciona un estado' : 'No hay estados disponibles');
			if (!estados.length) mostrarError('No hay estados registrados.');
			} else if (res.type === 'error') {
			clearTimeout(temporizadorCarga);
			guardando = false;
			botonGuardar.textContent = 'Guardar vehículo';
			actualizarBoton();
			mostrarError(res.message || 'Ocurrió un error al consultar o guardar el vehículo.');
			}
			if (marcasCargadas && modelosCargados && estadosCargados) clearTimeout(temporizadorCarga);
			}
			window.addEventListener('message', recibir);
			if (window.chrome?.webview?.addEventListener) window.chrome.webview.addEventListener('message', recibir);
			marcaSelect.addEventListener('change', filtrarModelos);
			document.getElementById('cancelar').addEventListener('click', () => enviar({type:'cancelar'}));
			form.addEventListener('submit', evento => {
			evento.preventDefault();
			if (guardando) return;
			const marcaId = Number(marcaSelect.value);
			const modeloId = Number(modeloSelect.value);
			const anio = Number(anioInput.value);
			const cilindrada = Number(cilindradaInput.value);
			const motor = motorInput.value.trim();
			const estadoId = Number(estadoSelect.value);
			const anioMaximo = new Date().getFullYear() + 2;
			if (!Number.isInteger(marcaId) || !marcas.some(m => Number(obtener(m,'MarcaId','marcaId')) === marcaId)) {
			mostrarError('Selecciona una marca registrada.'); marcaSelect.focus(); return;
			}
			if (!Number.isInteger(modeloId) || !modelos.some(m =>
			Number(obtener(m,'ModeloId','modeloId')) === modeloId &&
			Number(obtener(m,'MarcaId','marcaId')) === marcaId)) {
			mostrarError('Selecciona un modelo correspondiente a la marca elegida.'); modeloSelect.focus(); return;
			}
			if (!Number.isInteger(anio) || anio < 1886 || anio > anioMaximo) {
        mostrarError(`El año debe estar entre 1886 y ${anioMaximo}.`); anioInput.focus(); return;
    }
    if (!Number.isFinite(cilindrada) || cilindrada <= 0 || cilindrada > 999.99 ||
			Math.abs(Math.round(cilindrada * 100) - cilindrada * 100) > 1e-7) {
			mostrarError('La cilindrada debe ser positiva, hasta 999.99 y con máximo dos decimales.');
			cilindradaInput.focus(); return;
			}
			if (!motor || motor.length > 100) {
			mostrarError('Ingresa el tipo de motor (máximo 100 caracteres).'); motorInput.focus(); return;
			}
			if (!Number.isInteger(estadoId) || !estados.some(e => Number(obtener(e,'EstadoId','estadoId')) === estadoId)) {
			mostrarError('Selecciona un estado válido.'); estadoSelect.focus(); return;
			}
			const datos = { ModeloId:modeloId, Anio:anio, Cilindrada:cilindrada, TipoMotor:motor, EstadoId:estadoId };
			guardando = true;
			actualizarBoton();
			botonGuardar.textContent = 'Guardando...';
			mostrarError('');
			if (!enviar({type:'guardar', data:datos})) {
			guardando = false;
			botonGuardar.textContent = 'Guardar vehículo';
			actualizarBoton();
			}
			});
			temporizadorCarga = setTimeout(() => {
			if (!marcasCargadas || !modelosCargados || !estadosCargados) {
			mostrarError('No se recibieron las listas de Marcas, Modelos o Estados. Revisa MainForm.cs y los archivos de integración WebView2.');
			}
			}, 10000);
			enviar({type:'marcas:selectAll'});
			enviar({type:'modelos:selectAll'});
			enviar({type:'obtenerEstados'});
		</script>
	</body>
</html>
