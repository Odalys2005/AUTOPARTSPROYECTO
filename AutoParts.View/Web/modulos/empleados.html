<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AutoParts | Empleados</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0%,rgba(136,16,25,.19),transparent 44%),#090a0d;color:#f5f5f7;font-family:'Segoe UI',Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.contenedor{max-width:1520px;margin:0 auto;padding:34px}
.etiqueta{display:flex;align-items:center;gap:9px;color:#ffbd37;font-size:11px;font-weight:750;letter-spacing:2.7px;margin-bottom:12px}

h1{margin:0;font-size:clamp(28px,3vw,38px);letter-spacing:-.8px;font-weight:800}h1 span{color:#ffbd2e}
.subtitulo{margin-top:9px;color:#adaeb8;font-size:13px;line-height:1.6}
.encabezado{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:31px}
.btn-principal{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid #ff6053;border-radius:10px;padding:14px 20px;background:linear-gradient(110deg,#b10b1f,#e52a37,#ffac28);color:#fff;font-size:13px;font-weight:750;box-shadow:0 0 18px rgba(233,31,48,.27);transition:filter .2s,transform .2s;white-space:nowrap}
.btn-principal:hover{filter:brightness(1.13);transform:translateY(-2px)}
.panel{border:1px solid #4d3038;border-radius:15px;background:linear-gradient(140deg,#171519,#0d0e11 65%,#140f12);box-shadow:0 12px 35px #0005;overflow:hidden}
.panel-cabecera{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:17px;padding:24px 25px;border-bottom:1px solid #352c32}
.panel-cabecera h2{font-size:18px;margin:0 0 7px}.panel-cabecera p{font-size:12px;color:#9a9aa4;margin:0}
.herramientas{display:flex;flex-wrap:wrap;align-items:center;gap:11px}
.buscador{display:flex;align-items:center;gap:10px;height:44px;border:1px solid #51454c;background:#111216;border-radius:9px;padding:0 13px;width:min(345px,100%)}
.buscador:focus-within{border-color:#ff3d46;box-shadow:0 0 12px #ff334022}.buscador svg{color:#aba9b0;flex-shrink:0}
.buscador input{width:100%;border:0;outline:0;background:transparent;color:white;font-size:12px}.buscador input::placeholder{color:#898992}
.btn-actualizar{display:flex;align-items:center;gap:8px;height:44px;border:1px solid #60444d;background:#211a1f;border-radius:9px;padding:0 15px;color:#eee;font-size:12px;transition:.2s}.btn-actualizar:hover{background:#3a2027;border-color:#ee4247}
.aviso{padding:0 25px;font-size:12px;color:#ffbd69;line-height:1.6}.aviso:empty{display:none}.aviso:not(:empty){padding-top:14px;padding-bottom:12px}
.tabla-wrap{overflow-x:auto;min-height:240px}table{width:100%;min-width:1360px;border-collapse:collapse;font-size:12px}thead{background:#1b1b21}
th{text-align:left;color:#bcbcc6;border-bottom:1px solid #373035;padding:16px 18px;font-size:11px;font-weight:750;letter-spacing:.25px;white-space:nowrap}
td{border-bottom:1px solid #2d2a30;padding:16px 18px;color:#e5e5e9;vertical-align:middle}tbody tr:hover{background:#25181e}
.codigo{color:#ffbd35;font-weight:750;font-variant-numeric:tabular-nums}.principal{font-weight:700;color:#fff;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:6px 11px;font-size:11px;font-weight:750;white-space:nowrap}
.chip.ok{color:#79eaaa;border:1px solid #17643e;background:#103d29}.chip.sin{color:#ffd274;border:1px solid #746027;background:#403514}
.chip:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.vacio{text-align:center;padding:66px 20px;color:#9ea0ab}.vacio svg{color:#ffbd35;margin-bottom:11px}.vacio strong{display:block;color:#e8e8ee;margin-bottom:7px;font-size:14px}.vacio p{font-size:12px;margin:0}
.pie{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;padding:16px 25px;border-top:1px solid #34292e;color:#9999a3;font-size:12px}.pie strong{color:#ffbd35}
@media(max-width:960px){.contenedor{padding:22px}}
@media(max-width:600px){.encabezado{align-items:flex-start}.panel-cabecera{padding:18px}.herramientas{width:100%}.buscador{flex:1;min-width:190px}.pie{padding:16px 18px}}

.celda-dui,.celda-telefono{white-space:nowrap;min-width:118px;font-variant-numeric:tabular-nums}
.celda-correo{white-space:nowrap;min-width:230px}
.celda-acciones{white-space:nowrap;min-width:155px}
.acciones-fila{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.btn-icono{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;background:#17171d;border:1px solid currentColor;padding:0;transition:background .18s,transform .18s}
.btn-icono svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-icono:hover:not(:disabled){transform:translateY(-2px);background:#29232c}
.btn-icono:disabled{opacity:.38;cursor:not-allowed}
.btn-icono.ver{color:#60baff}.btn-icono.editar{color:#75e6a6}.btn-icono.eliminar{color:#ff8089}.btn-icono.habilitar{color:#75e6a6}
.btn-actualizar{width:44px;justify-content:center;padding:0;flex:0 0 44px}
.herramientas{flex-wrap:nowrap;gap:9px}.buscador{min-width:0;flex:1}
.chip.inactivo{color:#ff9299;border:1px solid #743d47;background:#3a2229}
.modal[hidden]{display:none!important}.modal{position:fixed;inset:0;z-index:60;background:#000c;display:grid;place-items:center;padding:18px}
.modal-panel{background:linear-gradient(145deg,#21171d,#101115);border:1px solid #75424b;border-radius:16px;box-shadow:0 24px 75px #000a;width:min(100%,530px);padding:26px;max-height:90vh;overflow-y:auto}
.modal-panel h2{font-size:22px;margin:0 0 24px}.modal-panel label{display:block;color:#dedbe1;font-size:12px;margin:0 0 7px;font-weight:650}
.modal-panel input,.modal-panel select{width:100%;height:44px;border:1px solid #624750;border-radius:9px;background:#101115;color:white;padding:0 12px;outline:none;font:inherit;font-size:13px}
.modal-panel input:focus,.modal-panel select:focus{border-color:#e7444e}
.campos-edicion{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.campo-completo{grid-column:1/-1}
.detalle{display:grid;grid-template-columns:130px 1fr;gap:10px;border-bottom:1px solid #392a31;padding:12px 0;font-size:13px}.detalle span:first-child{color:#ada5ad}.detalle span:last-child{overflow-wrap:anywhere;color:#f4f2f5;font-weight:650}
.modal-acciones{display:flex;justify-content:flex-end;gap:11px;margin-top:24px;flex-wrap:wrap}
.modal-acciones button{border-radius:9px;border:1px solid #5e5157;background:#252329;color:#eee;padding:11px 17px;font-weight:700;cursor:pointer}
.modal-acciones .principal{background:linear-gradient(110deg,#c62035,#f0a52b);border:0;color:#fff}
.modal-acciones .peligro{background:#9d2334;border-color:#d44f5e;color:#fff}
.modal-acciones .habilitar{background:#155a3b;border-color:#47c78b;color:#fff}
.modal-panel p{line-height:1.7;color:#c5bac1;margin:0}.modal-panel strong{color:#ffc44a}
.resultado{text-align:center;max-width:420px}.resultado .verificado{display:grid;place-items:center;margin:0 auto 18px;width:60px;height:60px;border-radius:50%;background:#123725;border:1px solid #399b69;color:#8defb2;font-size:31px}.resultado .modal-acciones{justify-content:center}
@media(max-width:540px){.campos-edicion{grid-template-columns:1fr}.campo-completo{grid-column:auto}.detalle{grid-template-columns:95px 1fr}.modal-panel{padding:20px}}
</style>
</head>
<body>
<main class="contenedor">
    <header class="encabezado">
        <div>
                        <h1>Gestión de <span>Empleados</span></h1>
        </div>
        <button type="button" class="btn-principal" id="btnNuevo">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Nuevo empleado
        </button>
    </header>
    <section class="panel">
        <div class="panel-cabecera">
            <div><h2>Listado de empleados</h2></div>
            <div class="herramientas">
                <label class="buscador" aria-label="Buscar empleado">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
                    <input type="search" id="buscar" autocomplete="off" placeholder="Buscar nombre, DUI, puesto...">
                </label>
                <button type="button" id="btnActualizar" class="btn-actualizar" title="Actualizar" aria-label="Actualizar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
                </button>
            </div>
        </div>
        <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
        <div class="tabla-wrap">
            <table>
                <thead><tr>
                    <th>ID</th><th>Empleado</th><th>DUI</th><th>Teléfono</th><th>Correo</th><th>Puesto</th><th>Estado</th><th>Acciones</th>
                </tr></thead>
                <tbody id="filas">
                    <tr><td class="vacio" colspan="8"><strong>Cargando empleados...</strong></td></tr>
                </tbody>
            </table>
        </div>
        <div class="pie"><span>Empleados mostrados: <strong id="conteo">0</strong></span><span>AutoParts · Personal</span></div>
    </section>
</main>

<div id="modalVer" class="modal" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="tituloVer"><h2 id="tituloVer">Detalles del empleado</h2><div id="detalles"></div><div class="modal-acciones"><button type="button" class="principal" id="cerrarVer">Cerrar</button></div></section></div>
<div id="modalEditar" class="modal" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="tituloEditar"><h2 id="tituloEditar">Editar empleado</h2><form id="formEditar"><div class="campos-edicion">
<div><label for="editarNombre">Nombre</label><input id="editarNombre" maxlength="100" required></div>
<div><label for="editarApellido">Apellido</label><input id="editarApellido" maxlength="100" required></div>
<div><label for="editarDUI">DUI</label><input id="editarDUI" maxlength="10" required></div>
<div><label for="editarTelefono">Teléfono</label><input id="editarTelefono" maxlength="25" required></div>
<div class="campo-completo"><label for="editarCorreo">Correo electrónico</label><input id="editarCorreo" maxlength="150" type="email" required></div>
<div class="campo-completo"><label for="editarPuesto">Puesto</label><select id="editarPuesto" required></select></div>
</div><div class="modal-acciones"><button type="button" id="cancelarEditar">Cancelar</button><button type="submit" class="principal" id="guardarEditar">Guardar cambios</button></div></form></section></div>
<div id="modalConfirmar" class="modal" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmar"><h2 id="tituloConfirmar">Confirmar cambio</h2><p id="textoConfirmar"></p><div class="modal-acciones"><button type="button" id="cancelarConfirmar">Cancelar</button><button type="button" class="peligro" id="aceptarConfirmar">Confirmar</button></div></section></div>
<div id="modalResultado" class="modal" hidden><section class="modal-panel resultado" role="dialog" aria-modal="true" aria-labelledby="tituloResultado"><div class="verificado" aria-hidden="true">✓</div><h2 id="tituloResultado">Operación realizada</h2><p id="textoResultado"></p><div class="modal-acciones"><button type="button" class="principal" id="cerrarResultado">Aceptar</button></div></section></div>
<script>
"use strict";
const filas = document.getElementById('filas');
const filtro = document.getElementById('buscar');
const aviso = document.getElementById('aviso');
let empleados = [], puestos = [], estados = [];
let empleadoEditando = 0, empleadoCambiar = 0, operacionPendiente = false, accionEstado = "";
let empleadosListos = false;
let temporizadorCarga;

function obtener(obj, ...claves) {
    for (const clave of claves) if (obj && obj[clave] !== undefined && obj[clave] !== null) return obj[clave];
    return '';
}
function numeroId(obj, nombre) { return Number(obtener(obj, nombre, nombre[0].toLowerCase() + nombre.slice(1))) || 0; }
function escapar(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function enviar(mensaje) {
    if (window.parent !== window) { window.parent.postMessage(mensaje, '*'); return true; }
    if (window.chrome?.webview?.postMessage) { window.chrome.webview.postMessage(mensaje); return true; }
    aviso.textContent = 'Abre este módulo desde AutoParts para consultar los datos.';
    return false;
}
function nombrePuesto(e) {
    const id = numeroId(e, 'PuestoId');
    const puesto = puestos.find(p => numeroId(p, 'PuestoId') === id);
    return puesto ? String(obtener(puesto, 'Nombre', 'nombre')) : (id ? `Puesto #${id}` : 'Sin puesto');
}
function nombreEstado(e) {
    const id = numeroId(e, 'EstadoId');
    const estado = estados.find(x => numeroId(x, 'EstadoId') === id);
    return estado ? String(obtener(estado, 'Nombre', 'nombre')) : (id ? `Estado #${id}` : 'Sin estado');
}
function filaMensaje(titulo, descripcion = '') {
    filas.innerHTML = `<tr><td class="vacio" colspan="8"><svg width="37" height="37" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/></svg><strong>${escapar(titulo)}</strong>${descripcion ? `<p>${escapar(descripcion)}</p>` : ''}</td></tr>`;
}
function pintar() {
    if (!empleadosListos) return;
    const texto = filtro.value.trim().toLocaleLowerCase('es');
    const resultado = empleados.filter(e => {
        const valores = [numeroId(e, 'EmpleadoId'), obtener(e, 'Nombre', 'nombre'), obtener(e, 'Apellido', 'apellido'), obtener(e, 'DUI', 'dui'), obtener(e, 'Telefono', 'telefono'), obtener(e, 'Correo', 'correo'), nombrePuesto(e), nombreEstado(e)];
        return valores.some(v => String(v).toLocaleLowerCase('es').includes(texto));
    });
    document.getElementById('conteo').textContent = String(resultado.length);
    if (resultado.length === 0) {
        filaMensaje(texto ? 'No se encontraron empleados.' : 'No hay empleados registrados.');
        return;
    }
    filas.innerHTML = resultado.map(e => {
        const nombre = [obtener(e, 'Nombre', 'nombre'), obtener(e, 'Apellido', 'apellido')].filter(Boolean).join(' ');
        const estado = nombreEstado(e);
        const activo = numeroId(e, 'EstadoId') === 1;
        const id = numeroId(e, 'EmpleadoId');
        return `<tr>
            <td class="codigo">#${escapar(numeroId(e, 'EmpleadoId'))}</td>
            <td><span class="principal">${escapar(nombre)}</span></td>
            <td class="celda-dui">${escapar(obtener(e, 'DUI', 'dui'))}</td>
            <td class="celda-telefono">${escapar(obtener(e, 'Telefono', 'telefono'))}</td>
            <td class="celda-correo">${escapar(obtener(e, 'Correo', 'correo'))}</td>
            <td>${escapar(nombrePuesto(e))}</td>
            <td><span class="chip ${activo ? 'ok' : 'inactivo'}">${escapar(estado)}</span></td>
            <td class="celda-acciones"><div class="acciones-fila">
                <button type="button" class="btn-icono ver" title="Ver" aria-label="Ver empleado" data-ver="${id}"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                <button type="button" class="btn-icono editar" title="Editar" aria-label="Editar empleado" data-editar="${id}"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/></svg></button>
                <button type="button" class="btn-icono ${activo ? 'eliminar' : 'habilitar'}" title="${activo ? 'Eliminar' : 'Habilitar'}" aria-label="${activo ? 'Eliminar' : 'Habilitar'} empleado" data-estado="${id}">${activo ? `<svg viewBox="0 0 24 24"><path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6M14 11v6"/></svg>` : `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>`}</button>
            </div></td>
        </tr>`;
    }).join('');
}
function recibir(evento) {
    let dato = evento.data;
    if (typeof dato === 'string') { try { dato = JSON.parse(dato); } catch { return; } }
    if (!dato || typeof dato !== 'object') return;
    if (dato.type === 'empleados:list') {
        clearTimeout(temporizadorCarga);
        empleados = Array.isArray(dato.data) ? dato.data : [];
        empleadosListos = true;
        aviso.textContent = '';
        pintar();
    } else if (dato.type === 'puestos:list') {
        puestos = Array.isArray(dato.data) ? dato.data : [];
        pintar();
    } else if (dato.type === 'estados') {
        estados = Array.isArray(dato.data) ? dato.data : [];
        pintar();
     } else if (dato.type === 'empleados:actualizada' || dato.type === 'empleados:desactivada') {
        operacionPendiente = false;
        document.getElementById('guardarEditar').disabled = false;
        document.getElementById('modalEditar').hidden = true;
        document.getElementById('modalConfirmar').hidden = true;
        document.getElementById('tituloResultado').textContent = dato.type === 'empleados:actualizada' ? 'Empleado actualizado' : accionEstado === 'habilitar' ? 'Empleado habilitado' : 'Empleado desactivado';
        document.getElementById('textoResultado').textContent = dato.type === 'empleados:actualizada' ? 'El empleado se actualizó correctamente.' : accionEstado === 'habilitar' ? 'El empleado se habilitó correctamente.' : 'El empleado se desactivó correctamente.';
        document.getElementById('modalResultado').hidden = false;
        cargar();
    } else if (dato.type === 'empleados:error' || dato.type === 'error') {
        operacionPendiente = false;
        document.getElementById('guardarEditar').disabled = false;
        aviso.textContent = String(dato.message || 'No se pudo completar la operación.');
        clearTimeout(temporizadorCarga);
        if (!empleadosListos) filaMensaje('No fue posible cargar empleados.');
    }
}
window.addEventListener('message', recibir);
if (window.chrome?.webview?.addEventListener && window.parent === window) {
    window.chrome.webview.addEventListener('message', recibir);
}
function cargar() {
    empleadosListos = false;
    filas.innerHTML = '<tr><td class="vacio" colspan="8"><strong>Cargando empleados...</strong></td></tr>';
    aviso.textContent = '';
    document.getElementById('conteo').textContent = '0';
    clearTimeout(temporizadorCarga);
    if (!enviar({ type: 'empleados:selectAll' })) return;
    enviar({ type: 'puestos:selectAll' });
    enviar({ type: 'obtenerEstados' });
    temporizadorCarga = setTimeout(() => {
        if (!empleadosListos) {
            filaMensaje('No se recibió respuesta de AutoParts.');
            aviso.textContent = 'Comprueba la conexión del módulo con MainForm.cs.';
        }
    }, 12000);
}
document.getElementById('btnNuevo').addEventListener('click', () => enviar({ type: 'empleados:abrirNuevo' }));
document.getElementById('btnActualizar').addEventListener('click', cargar);
filtro.addEventListener('input', pintar);

function empleadoPorId(id){return empleados.find(e=>numeroId(e,'EmpleadoId')===id);}
function textoEmpleado(e){return [obtener(e,'Nombre','nombre'),obtener(e,'Apellido','apellido')].filter(Boolean).join(' ');}
function campoTexto(id,e,nombre,alternativo){document.getElementById(id).value=String(obtener(e,nombre,alternativo)??'');}
function abrirVer(id){
    if(operacionPendiente)return;
    const e=empleadoPorId(id);if(!e)return;
    const campos=[['Nombre',textoEmpleado(e)],['DUI',obtener(e,'DUI','dui')],['Teléfono',obtener(e,'Telefono','telefono')],['Correo',obtener(e,'Correo','correo')],['Puesto',nombrePuesto(e)],['Estado',nombreEstado(e)]];
    document.getElementById('detalles').innerHTML=campos.map(([label,value])=>`<div class="detalle"><span>${escapar(label)}</span><span>${escapar(value)}</span></div>`).join('');
    document.getElementById('modalVer').hidden=false;
}
function abrirEditar(id){
    if(operacionPendiente)return;
    const e=empleadoPorId(id);if(!e)return;
    empleadoEditando=id;
    campoTexto('editarNombre',e,'Nombre','nombre');
    campoTexto('editarApellido',e,'Apellido','apellido');
    campoTexto('editarDUI',e,'DUI','dui');
    campoTexto('editarTelefono',e,'Telefono','telefono');
    campoTexto('editarCorreo',e,'Correo','correo');
    const actual=numeroId(e,'PuestoId');
    const selector=document.getElementById('editarPuesto');selector.innerHTML='';
    for(const puesto of puestos){
        const idP=numeroId(puesto,'PuestoId');
        const activo=numeroId(puesto,'EstadoId')===1;
        if(!activo && idP!==actual)continue;
        const opcion=document.createElement('option');opcion.value=String(idP);
        opcion.textContent=String(obtener(puesto,'Nombre','nombre'))+(activo?'':' (inactivo)');
        opcion.disabled=!activo;
        selector.appendChild(opcion);
    }
    if(![...selector.options].some(o=>o.value===String(actual))){
        const opcion=document.createElement('option');opcion.value=String(actual);opcion.textContent='Puesto #'+actual+' (no disponible)';opcion.disabled=true;selector.appendChild(opcion);
    }
    selector.value=String(actual);
    document.getElementById('modalEditar').hidden=false;
}
function abrirCambio(id){
    if(operacionPendiente)return;
    const e=empleadoPorId(id);if(!e)return;
    empleadoCambiar=id;
    const activo=numeroId(e,'EstadoId')===1;
    accionEstado=activo?'desactivar':'habilitar';
    document.getElementById('tituloConfirmar').textContent=activo?'¿Eliminar empleado?':'¿Habilitar empleado?';
    document.getElementById('textoConfirmar').textContent=`¿Seguro que deseas ${activo?'desactivar':'habilitar'} a "${textoEmpleado(e)}"?`;
    const btn=document.getElementById('aceptarConfirmar');btn.textContent=activo?'Sí, desactivar':'Sí, habilitar';btn.classList.toggle('habilitar',!activo);btn.classList.toggle('peligro',activo);
    document.getElementById('modalConfirmar').hidden=false;
}
filas.addEventListener('click',evento=>{
    const boton=evento.target.closest('button[data-ver],button[data-editar],button[data-estado]');
    if(!boton)return;
    const id=Number(boton.dataset.ver||boton.dataset.editar||boton.dataset.estado);
    if(boton.dataset.ver)abrirVer(id);
    else if(boton.dataset.editar)abrirEditar(id);
    else abrirCambio(id);
});
document.getElementById('cerrarVer').addEventListener('click',()=>document.getElementById('modalVer').hidden=true);
document.getElementById('cancelarEditar').addEventListener('click',()=>{if(!operacionPendiente)document.getElementById('modalEditar').hidden=true;});
document.getElementById('cancelarConfirmar').addEventListener('click',()=>{if(!operacionPendiente)document.getElementById('modalConfirmar').hidden=true;});
document.getElementById('cerrarResultado').addEventListener('click',()=>document.getElementById('modalResultado').hidden=true);
document.getElementById('formEditar').addEventListener('submit',evento=>{
    evento.preventDefault();if(operacionPendiente||empleadoEditando<=0)return;
    const leer=id=>document.getElementById(id).value.trim();
    const puestoId=Number(leer('editarPuesto'));
    if(!Number.isInteger(puestoId)||puestoId<=0){aviso.textContent='Selecciona un puesto activo.';return;}
    const original=empleadoPorId(empleadoEditando);if(!original)return;
    operacionPendiente=true;document.getElementById('guardarEditar').disabled=true;aviso.textContent='Guardando cambios...';
    if(!enviar({type:'empleados:actualizarIntegrado',data:{EmpleadoId:empleadoEditando,PuestoId:puestoId,Nombre:leer('editarNombre'),Apellido:leer('editarApellido'),DUI:leer('editarDUI'),Telefono:leer('editarTelefono'),Correo:leer('editarCorreo'),EstadoId:numeroId(original,'EstadoId')}})){
        operacionPendiente=false;document.getElementById('guardarEditar').disabled=false;
    }
});
document.getElementById('aceptarConfirmar').addEventListener('click',()=>{
    if(operacionPendiente||empleadoCambiar<=0)return;
    operacionPendiente=true;
    document.getElementById('modalConfirmar').hidden=true;
    aviso.textContent=accionEstado==='habilitar'?'Habilitando empleado...':'Desactivando empleado...';
    if(!enviar({type:'empleados:desactivarIntegrado',data:{EmpleadoId:empleadoCambiar}}))operacionPendiente=false;
});

cargar();
</script>
</body>
</html>
