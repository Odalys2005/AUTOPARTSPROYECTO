<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoParts | Entrega de reemplazo</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 100% 0%,rgba(136,16,25,.2),transparent 44%),#090a0d;color:#f5f5f7;font-family:'Segoe UI',Arial,sans-serif}
button,select,textarea{font:inherit}
.contenedor{max-width:1050px;margin:auto;padding:34px}
.encabezado{margin-bottom:28px}.etiqueta{color:#ffbd37;font-size:11px;font-weight:750;letter-spacing:2.5px;margin-bottom:12px}
h1{font-size:clamp(28px,3vw,36px);margin:0;font-weight:800}h1 span{color:#ffbd2e}
.panel{padding:30px;border:1px solid #56323c;border-radius:15px;background:linear-gradient(140deg,#171519,#0d0e11 70%,#140f12);box-shadow:0 12px 35px #0005}
.seccion{color:#ffbd35;font-size:11px;letter-spacing:2px;font-weight:750;margin:0 0 24px}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 24px}
.campo{min-width:0}.ancho{grid-column:1/-1}
label{display:block;margin-bottom:9px;font-size:13px;font-weight:650}
select,textarea{width:100%;border:1px solid #554a52;background:#111216;border-radius:9px;color:#fff;padding:12px 14px;outline:0}
select{min-height:47px}textarea{min-height:110px;resize:vertical}
select:focus,textarea:focus{border-color:#ff3543;box-shadow:0 0 14px #ff354333}
.dato{min-height:47px;padding:14px;border:1px solid #43373e;border-radius:9px;background:#201c21;color:#ffbd35;font-size:13px}
.mensaje{margin-top:23px;color:#ffc075;font-size:13px;line-height:1.5}.mensaje:empty{display:none}
.acciones{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:12px;border-top:1px solid #382d34;padding-top:24px;margin-top:24px}
button{padding:13px 24px;border-radius:9px;font-size:13px;font-weight:750;cursor:pointer}
.cancelar{background:#25232a;border:1px solid #58535c;color:#e6e6eb}
.guardar{background:linear-gradient(110deg,#ff3543,#ffbd2b);border:0;color:#190d0d}
button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:720px){.contenedor{padding:20px}.panel{padding:20px}.campos{grid-template-columns:1fr}.ancho{grid-column:auto}}
</style>
</head>
<body>
<main class="contenedor">
<header class="encabezado"><div class="etiqueta">SERVICIO POSVENTA</div><h1>Entregar <span>reemplazo de garantía</span></h1></header>
<section class="panel">
<form id="formEntrega">
<p class="seccion">DATOS DE ENTREGA</p>
<div class="campos">
<div class="campo ancho"><label for="GarantiaId">Garantía aprobada o pendiente de reemplazo</label><select id="GarantiaId" required disabled><option value="">Cargando garantías...</option></select></div>
<div class="campo"><label>Cantidad a entregar</label><div class="dato" id="cantidad">—</div></div>
<div class="campo"><label>Estado actual</label><div class="dato" id="estado">—</div></div>
<div class="campo ancho"><label for="Observaciones">Observaciones de entrega (opcional)</label><textarea id="Observaciones" maxlength="1000"></textarea></div>
</div>
<div class="mensaje" id="mensaje" role="status" aria-live="polite"></div>
<div class="acciones"><button class="cancelar" type="button" id="cancelar">Cancelar</button><button class="guardar" type="submit" id="entregar" disabled>Confirmar entrega</button></div>
</form>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const colecciones={garantias:[],reemplazos:[]};
const recibidos={garantias:false,reemplazos:false};
let procesando=false,temporizador=null;
function campo(o,k){return o?.[k]??o?.[k.charAt(0).toLowerCase()+k.slice(1)]??null;}
function num(o,k){return Number(campo(o,k))||0;}
function aviso(texto){$('mensaje').textContent=texto;}
function emitir(m){if(window.parent!==window){window.parent.postMessage(m,'*');return true;}if(window.chrome?.webview?.postMessage){window.chrome.webview.postMessage(m);return true;}return false;}
function leer(e){let m=e.data;if(typeof m==='string'){try{m=JSON.parse(m);}catch{return null;}}return m&&typeof m==='object'?m:null;}
function candidatos(){const usados=new Set(colecciones.reemplazos.map(x=>num(x,'GarantiaId')));return colecciones.garantias.filter(g=>['APROBADA','PENDIENTE_REEMPLAZO'].includes(String(campo(g,'ResultadoEvaluacion')||'').trim().toUpperCase())&&!usados.has(num(g,'GarantiaId')));}
function actualizarSeleccion(){const id=Number($('GarantiaId').value);const g=candidatos().find(x=>num(x,'GarantiaId')===id);$('cantidad').textContent=g?String(num(g,'CantidadReclamada')):'—';$('estado').textContent=g?String(campo(g,'ResultadoEvaluacion')):'—';$('entregar').disabled=procesando||!g;}
function llenar(){if(!recibidos.garantias||!recibidos.reemplazos)return;const sel=$('GarantiaId'),anterior=sel.value;sel.replaceChildren();const op=document.createElement('option');op.value='';op.textContent='Selecciona una garantía';sel.appendChild(op);for(const g of candidatos()){const o=document.createElement('option');o.value=String(num(g,'GarantiaId'));o.textContent=`Garantía #${num(g,'GarantiaId')} · ${campo(g,'ResultadoEvaluacion')} · ${num(g,'CantidadReclamada')} unidad(es)`;sel.appendChild(o);}if([...sel.options].some(o=>o.value===anterior))sel.value=anterior;sel.disabled=procesando||sel.options.length===1;actualizarSeleccion();if(sel.options.length===1)aviso('No hay garantías aprobadas o pendientes disponibles para entregar.');}
function solicitar(){emitir({type:'garantias:selectAll'});emitir({type:'reemplazos-garantia:selectAll'});}
function recibir(e){const m=leer(e);if(!m||typeof m.type!=='string')return;
if(m.type==='garantias:list'){colecciones.garantias=Array.isArray(m.data)?m.data:[];recibidos.garantias=true;llenar();}
else if(m.type==='reemplazos-garantia:list'){colecciones.reemplazos=Array.isArray(m.data)?m.data:[];recibidos.reemplazos=true;llenar();}
else if(m.type==='reemplazos-garantia:resultadoEntrega'){clearTimeout(temporizador);procesando=false;const d=m.data||{},est=String(campo(d,'EstadoGarantia')||'');aviso(String(campo(d,'Mensaje')||(est==='REEMPLAZADA'?'Reemplazo entregado correctamente.':'La garantía continúa pendiente de reemplazo.')));$('GarantiaId').disabled=false;solicitar();actualizarSeleccion();}
else if(m.type==='reemplazos-garantia:entregaError'||m.type==='error'){clearTimeout(temporizador);procesando=false;aviso(String(m.message||'No pudo completarse la entrega.'));actualizarSeleccion();solicitar();}
}
window.addEventListener('message',recibir);
if(window.chrome?.webview?.addEventListener&&window.parent===window)window.chrome.webview.addEventListener('message',recibir);
$('GarantiaId').addEventListener('change',actualizarSeleccion);
$('cancelar').addEventListener('click',()=>emitir({type:'cancelar'}));
$('formEntrega').addEventListener('submit',e=>{e.preventDefault();if(procesando)return;const id=Number($('GarantiaId').value);if(!candidatos().some(g=>num(g,'GarantiaId')===id)){aviso('Selecciona una garantía válida.');return;}
if(!confirm('¿Confirmas la entrega del repuesto de reemplazo?'))return;
if(!emitir({type:'reemplazos-garantia:entregar',data:{GarantiaId:id,Observaciones:$('Observaciones').value.trim()||null}})){aviso('Abre el formulario desde AutoParts.');return;}
procesando=true;actualizarSeleccion();$('GarantiaId').disabled=true;aviso('Procesando entrega...');temporizador=setTimeout(()=>{if(procesando){procesando=false;aviso('No se recibió confirmación. Actualiza los datos antes de volver a intentarlo.');solicitar();}},15000);
});
solicitar();
</script>
</body>
</html>
