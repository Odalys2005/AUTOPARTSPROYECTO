<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>AutoParts | Nuevo modelo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .contenedor { padding: 29px; }
        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .subtitulo {
            color: #ffbd35;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        h1 { margin: 0; font-size: 27px; }
        .icono {
            width: 47px;
            height: 47px;
            border: 1px solid #ee3642;
            border-radius: 12px;
            background: #5c111a;
            display: grid;
            place-items: center;
            font-size: 24px;
            color: #ffc42f;
            box-shadow: 0 0 20px #ca263044;
            flex-shrink: 0;
        }
        .panel {
            background: linear-gradient(145deg, #171418, #0e0e12);
            border: 1px solid #5a3139;
            border-radius: 14px;
            padding: 25px;
        }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 9px; }
        .campo { margin-bottom: 21px; }
        input, select {
            width: 100%;
            padding: 13px 14px;
            background: #111216;
            color: white;
            border: 1px solid #554c55;
            border-radius: 9px;
            font: inherit;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #ff3d46;
            box-shadow: 0 0 10px #e41b303b;
        }
        input::placeholder { color: #85858f; }
        select:disabled { opacity: .6; }
        .requerido { color: #ff4753; }
        .mensaje { color: #ffb64e; min-height: 18px; font-size: 12px; margin-bottom: 12px; }
        .acciones { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
        button {
            padding: 13px 23px;
            border-radius: 9px;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            transition: .2s;
        }
        .cancelar { background: #242328; color: #e5e5e5; border: 1px solid #56535b; }
        .cancelar:hover { background: #353039; }
        .guardar {
            color: #140c0d;
            background: linear-gradient(105deg, #ff3543, #ffbd2b);
            box-shadow: 0 0 16px #e5233533;
        }
        .guardar:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-2px); }
        .guardar:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 500px) {
            .contenedor { padding: 17px; }
            .panel { padding: 18px; }
            .acciones { flex-wrap: wrap; }
        }
    
        .contenedor { max-width:900px; margin:0 auto; }
        .campos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; }
        .campo.ancho { grid-column:1/-1; }
        .seccion { font-size:11px; font-weight:750; letter-spacing:2px; color:#ffbd35; margin:0 0 22px; }
        @media (max-width:650px) { .campos{grid-template-columns:1fr;} .campo.ancho{grid-column:auto;} }
</style>
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <div class="subtitulo">AUTOPARTS · CATÁLOGO AUTOMOTRIZ</div>
                <h1>Nuevo modelo</h1>
            </div>
            <div class="icono"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
        </header>
        <section class="panel">
            <p class="seccion">INFORMACIÓN DEL MODELO</p>
            <form id="formModelo" novalidate>
                <div class="campo ancho">
                    <label for="nombre">Nombre del modelo <span class="requerido">*</span></label>
                    <input id="nombre" type="text" maxlength="100" placeholder="Ej. Corolla, Civic, Hilux..." autocomplete="off" required>
                </div>
                <div class="campos">
                    <div class="campo">
                        <label for="marca">Marca <span class="requerido">*</span></label>
                        <select id="marca" required disabled><option value="">Cargando marcas...</option></select>
                    </div>
                    <div class="campo">
                        <label for="estado">Estado <span class="requerido">*</span></label>
                        <select id="estado" required disabled><option value="">Cargando estados...</option></select>
                    </div>
                </div>
   
                <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>
                <div class="acciones">
                    <button id="cancelar" class="cancelar" type="button">Cancelar</button>
                    <button id="guardar" class="guardar" type="submit" disabled>Guardar modelo</button>
                </div>
            </form>
        </section>
    </main>
    <script>
        "use strict";
        const form = document.getElementById('formModelo');
        const marcaSelect = document.getElementById('marca');
        const estadoSelect = document.getElementById('estado');
        const nombreInput = document.getElementById('nombre');
        const mensaje = document.getElementById('mensaje');
        const botonGuardar = document.getElementById('guardar');
        let marcas = [];
        let marcasCargadas = false;
        let estadosCargados = false;
        let guardando = false;
        let temporizador;

        function obtener(objeto, ...llaves) {
            for (const llave of llaves) {
                if (objeto && objeto[llave] !== undefined && objeto[llave] !== null) return objeto[llave];
            }
            return '';
        }

        function enviar(mensaje) {
            if (window.parent !== window) { window.parent.postMessage(mensaje, '*'); return true; }
            if (window.chrome?.webview?.postMessage) { window.chrome.webview.postMessage(mensaje); return true; }
            mostrarError('Este formulario debe abrirse desde AutoParts (WebView2).');
            return false;
        }

        function mostrarError(texto) { mensaje.textContent = texto; }
        function actualizarBoton() {
            botonGuardar.disabled = guardando || !marcasCargadas || !estadosCargados ||
                marcaSelect.disabled || estadoSelect.disabled;
        }

        function llenarSelect(select, lista, campoId, placeholder) {
            const anterior = select.value;
            select.replaceChildren();
            const primera = document.createElement('option');
            primera.value = '';
            primera.textContent = placeholder;
            select.append(primera);
            for (const item of lista) {
                const id = Number(obtener(item, campoId, campoId.charAt(0).toLowerCase() + campoId.slice(1)));
                const nombre = obtener(item, 'Nombre', 'nombre');
                if (!Number.isInteger(id) || id <= 0 || !nombre) continue;
                const opcion = document.createElement('option');
                opcion.value = String(id);
                opcion.textContent = String(nombre);
                select.append(opcion);
            }
            select.disabled = select.options.length < 2;
            if ([...select.options].some(op => op.value === anterior)) select.value = anterior;
            actualizarBoton();
        }


        function recibir(evento) {
            let respuesta = evento.data;
            if (typeof respuesta === 'string') { try { respuesta = JSON.parse(respuesta); } catch { return; } }
            if (!respuesta || typeof respuesta !== 'object') return;
            if (respuesta.type === 'marcas:list') {
                marcas = Array.isArray(respuesta.data) ? respuesta.data : [];
                marcasCargadas = true;
                llenarSelect(marcaSelect, marcas, 'MarcaId', marcas.length ? 'Selecciona una marca' : 'No hay marcas disponibles');
                if (!marcas.length) mostrarError('Registra primero una marca en el módulo Marcas.');
            } else if (respuesta.type === 'estados') {
                const lista = Array.isArray(respuesta.data) ? respuesta.data : [];
                estadosCargados = true;
                llenarSelect(estadoSelect, lista, 'EstadoId', lista.length ? 'Selecciona un estado' : 'No hay estados disponibles');
                if (!lista.length) mostrarError('No existen estados registrados.');
            } else if (respuesta.type === 'error') {
                clearTimeout(temporizador);
                guardando = false;
                botonGuardar.textContent = 'Guardar modelo';
                actualizarBoton();
                mostrarError(respuesta.message || 'Ocurrió un error al cargar o guardar el modelo.');
            }
            if (marcasCargadas && estadosCargados) clearTimeout(temporizador);
        }

        window.addEventListener('message', recibir);
        if (window.chrome?.webview?.addEventListener) window.chrome.webview.addEventListener('message', recibir);
        document.getElementById('cancelar').addEventListener('click', () => enviar({ type: 'cancelar' }));

        form.addEventListener('submit', evento => {
            evento.preventDefault();
            if (guardando) return;
            const nombre = nombreInput.value.trim();
            const marcaId = Number(marcaSelect.value);
            const estadoId = Number(estadoSelect.value);
            if (!nombre || nombre.length > 100) {
                mostrarError('Ingresa un nombre de modelo de 1 a 100 caracteres.');
                nombreInput.focus();
                return;
            }
            if (!Number.isInteger(marcaId) || marcaId <= 0 || !marcas.some(m => Number(obtener(m, 'MarcaId', 'marcaId')) === marcaId)) {
                mostrarError('Selecciona una marca registrada.');
                return;
            }
            if (!Number.isInteger(estadoId) || estadoId <= 0) {
                mostrarError('Selecciona un estado válido.');
                return;
            }
            guardando = true;
            actualizarBoton();
            botonGuardar.textContent = 'Guardando...';
            mostrarError('');
            if (!enviar({ type: 'guardar', data: { MarcaId: marcaId, Nombre: nombre, EstadoId: estadoId } })) {
                guardando = false;
                botonGuardar.textContent = 'Guardar modelo';
                actualizarBoton();
            }
        });

        temporizador = setTimeout(() => {
            if (!marcasCargadas || !estadosCargados) {
                mostrarError('No se recibieron las listas de Marcas o Estados. Revisa la comunicación entre WebView2 y MainForm.cs.');
            }
        }, 10000);
        enviar({ type: 'marcas:selectAll' });
        enviar({ type: 'obtenerEstados' });
</script>
</body>
</html>
