<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts | Nuevo modelo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 100% 0%, #581016 0%, transparent 45%), #0a0a0d;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .contenedor { padding: 29px; }
        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .subtitulo {
            color: #ffbd35;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        h1 { margin: 0; font-size: 27px; }
        .descripcion { color: #a9a7ae; font-size: 13px; line-height: 1.5; }
        .icono {
            width: 47px;
            height: 47px;
            border: 1px solid #ee3642;
            border-radius: 12px;
            background: #5c111a;
            display: grid;
            place-items: center;
            font-size: 24px;
            color: #ffc42f;
            box-shadow: 0 0 20px #ca263044;
            flex-shrink: 0;
        }
        .panel {
            background: linear-gradient(145deg, #171418, #0e0e12);
            border: 1px solid #5a3139;
            border-radius: 14px;
            padding: 25px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }
        .campo { margin-bottom: 21px; }
        input, select {
            width: 100%;
            padding: 13px 14px;
            background: #111216;
            color: white;
            border: 1px solid #554c55;
            border-radius: 9px;
            font: inherit;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #ff3d46;
            box-shadow: 0 0 10px #e41b303b;
        }
        input::placeholder { color: #85858f; }
        select:disabled { opacity: .6; cursor: not-allowed; }
        .requerido { color: #ff4753; }
        .mensaje {
            color: #ffb64e;
            min-height: 18px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        button {
            padding: 13px 23px;
            border-radius: 9px;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            transition: .2s;
        }
        .cancelar {
            background: #242328;
            color: #e5e5e5;
            border: 1px solid #56535b;
        }
        .cancelar:hover { background: #353039; }
        .guardar {
            color: #140c0d;
            background: linear-gradient(105deg, #ff3543, #ffbd2b);
            box-shadow: 0 0 16px #e5233533;
        }
        .guardar:hover:not(:disabled) {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }
        .guardar:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 500px) {
            .contenedor { padding: 17px; }
            .panel { padding: 18px; }
            .acciones { flex-wrap: wrap; }
        }
        .modal-exito[hidden] { display: none; }
        .modal-exito {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .8);
            display: grid;
            place-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-exito-panel {
            width: min(100%, 420px);
            padding: 32px 26px;
            text-align: center;
            background: linear-gradient(145deg, #22161b, #101115);
            border: 1px solid #79404a;
            border-radius: 16px;
            box-shadow: 0 20px 65px #000b;
        }
        .exito-simbolo {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: #113d29;
            border: 1px solid #34855d;
            color: #83edab;
            font-size: 32px;
            font-weight: 800;
        }
        .modal-exito-panel h2 { margin: 0 0 10px; font-size: 23px; }
        .modal-exito-panel p { color: #c9c5cb; font-size: 13px; margin: 0 0 24px; }
        .modal-exito-panel button { min-width: 124px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div>
                
                <h1>Nuevo modelo</h1>
                
            </div>
            
        </div>
        <div class="panel">
            <form id="formModelo">
                <div class="campo">
                    <label for="marca">Marca <span class="requerido">*</span></label>
                    <select id="marca" required disabled>
                        <option value="">Cargando marcas...</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="nombre">Nombre del modelo <span class="requerido">*</span></label>
                    <input type="text" id="nombre" maxlength="100" required>
                </div>
                <div id="mensaje" class="mensaje" role="alert"></div>
                <div class="acciones">
                    <button class="cancelar" type="button" id="cancelar">Cancelar</button>
                    <button class="guardar" type="submit" id="guardar">Guardar modelo</button>
                </div>
            </form>
        </div>
    </div>
    <div id="modalExito" class="modal-exito" hidden>
        <div class="modal-exito-panel" role="dialog" aria-modal="true" aria-labelledby="tituloExito">
            <div class="exito-simbolo" aria-hidden="true">✓</div>
            <h2 id="tituloExito">¡Modelo guardado!</h2>
            <p>El modelo se registró correctamente.</p>
            <button type="button" class="guardar" id="aceptarExito">Aceptar</button>
        </div>
    </div>
    <script>
        const formulario = document.getElementById("formModelo");
        const nombre = document.getElementById("nombre");
        const marca = document.getElementById("marca");
        let marcas = [];
        let marcasCargadas = false;
        const guardar = document.getElementById("guardar");
        const mensaje = document.getElementById("mensaje");
        let guardando = false;

        function obtener(objeto, propiedad) {
            return objeto?.[propiedad] ??
                objeto?.[propiedad[0].toLowerCase() + propiedad.slice(1)];
        }

        function actualizarGuardar() {
            guardar.disabled = guardando || !marcasCargadas || marca.disabled;
        }

        function enviar(datos) {
            if (window.parent !== window) {
                window.parent.postMessage(datos, "*");
                return true;
            }
            if (window.chrome?.webview?.postMessage) {
                window.chrome.webview.postMessage(datos);
                return true;
            }
            mensaje.textContent = "No hay conexión con Windows Forms.";
            return false;
        }

        document.getElementById("cancelar").addEventListener("click", () => {
            enviar({ type: "cancelar" });
        });

        formulario.addEventListener("submit", e => {
            e.preventDefault();
            if (guardando) return;
            const nombreValor = nombre.value.trim();
            const marcaId = Number(marca.value);

            if (!nombreValor || nombreValor.length > 100) {
                mensaje.textContent = "Ingresa un nombre válido de hasta 100 caracteres.";
                nombre.focus();
                return;
            }
            if (!Number.isInteger(marcaId) || marcaId <= 0 ||
                !marcas.some(item => Number(obtener(item, "MarcaId")) === marcaId &&
                    Number(obtener(item, "EstadoId")) === 1)) {
                mensaje.textContent = "Selecciona una marca activa.";
                marca.focus();
                return;
            }
            if (!formulario.reportValidity()) return;

            guardando = true;
            actualizarGuardar();
            guardar.textContent = "Guardando...";
            mensaje.textContent = "";

            if (!enviar({ type: "guardar", data: { MarcaId: marcaId, Nombre: nombreValor } })) {
                restaurarGuardado();
            }
        });

        function restaurarGuardado() {
            guardando = false;
            guardar.textContent = "Guardar modelo";
            actualizarGuardar();
        }

        document.getElementById("aceptarExito").addEventListener("click", () => {
            enviar({ type: "cancelar" });
        });

        function recibirRespuesta(evento) {
            let respuesta = evento.data;
            if (typeof respuesta === "string") {
                try { respuesta = JSON.parse(respuesta); } catch { return; }
            }
            if (!respuesta || typeof respuesta !== "object") return;
            if (respuesta.type === "marcas:list") {
                marcas = Array.isArray(respuesta.data) ? respuesta.data : [];
                marcasCargadas = true;
                const activoAnterior = marca.value;
                marca.replaceChildren();
                const opcion = document.createElement("option");
                opcion.value = "";
                opcion.textContent = "Selecciona una marca";
                marca.appendChild(opcion);
                for (const item of marcas) {
                    const id = Number(obtener(item, "MarcaId"));
                    const estadoId = Number(obtener(item, "EstadoId"));
                    const texto = String(obtener(item, "Nombre") ?? "").trim();
                    if (!Number.isInteger(id) || id <= 0 || estadoId !== 1 || !texto) continue;
                    const alternativa = document.createElement("option");
                    alternativa.value = String(id);
                    alternativa.textContent = texto;
                    marca.appendChild(alternativa);
                }
                marca.disabled = marca.options.length <= 1;
                if ([...marca.options].some(o => o.value === activoAnterior)) {
                    marca.value = activoAnterior;
                }
                if (marca.disabled) {
                    mensaje.textContent = "No hay marcas activas disponibles.";
                } else {
                    mensaje.textContent = "";
                }
                actualizarGuardar();
                return;
            }
            if (respuesta.type === "modelos:guardado") {
                document.getElementById("modalExito").hidden = false;
                document.getElementById("aceptarExito").focus();
                return;
            }
            if (respuesta.type === "error" || respuesta.type === "modelos:error") {
                mensaje.textContent = respuesta.message || "No se pudo guardar el modelo.";
                restaurarGuardado();
            }
        }

        window.addEventListener("message", recibirRespuesta);
        if (window.chrome?.webview?.addEventListener) {
            window.chrome.webview.addEventListener("message", recibirRespuesta);
        }
        actualizarGuardar();
        enviar({ type: "marcas:selectAll" });
    </script>
</body>
</html>
