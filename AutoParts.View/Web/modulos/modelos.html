<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>AutoParts | Modelos</title>
				<style>
					:root { color-scheme: dark; }
					* { box-sizing: border-box; }
					body {
					margin: 0;
					min-height: 100vh;
					color: #f5f5f7;
					font-family: 'Segoe UI', Arial, sans-serif;
					background: radial-gradient(ellipse at 95% 0%, rgba(136, 16, 25, 0.18), transparent 38%), #090a0d;
					}
					button, input { font: inherit; }
					button { cursor: pointer; }
					.contenedor {
					max-width: 1500px;
					margin: auto;
					padding: 35px;
					}
					.encabezado {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 20px;
					margin-bottom: 30px;
					}
					.etiqueta {
					display: flex;
					align-items: center;
					gap: 9px;
					color: #ffbd37;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: 3px;
					margin-bottom: 12px;
					}
					h1 {
					margin: 0;
					font-size: clamp(28px, 3vw, 39px);
					font-weight: 800;
					letter-spacing: -1px;
					}
					h1 span { color: #ffbd2e; }
					.subtitulo {
					color: #a9aab3;
					font-size: 13px;
					margin-top: 9px;
					line-height: 1.6;
					}
					.btn-nueva {
					display: flex;
					align-items: center;
					justify-content: center;
					gap: 10px;
					padding: 14px 20px;
					border: 1px solid #ff6053;
					border-radius: 10px;
					background: linear-gradient(110deg, #b10b1f, #e52a37, #ffac28);
					color: #fff;
					font-size: 13px;
					font-weight: 750;
					box-shadow: 0 0 18px rgba(233, 31, 48, 0.27), inset 0 1px 1px #ffffff30;
					transition: transform .2s, filter .2s;
					}
					.btn-nueva:hover {
					transform: translateY(-2px);
					filter: brightness(1.12);
					}
					.panel {
					border: 1px solid #4d3038;
					border-radius: 15px;
					background: linear-gradient(140deg, #171519, #0d0e11 65%, #140f12);
					box-shadow: 0 12px 35px #0005, inset 0 0 18px #0004;
					overflow: hidden;
					}
					.panel-superior {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 16px;
					padding: 23px 25px;
					border-bottom: 1px solid #34292e;
					}
					.panel-titulo h2 {
					font-size: 18px;
					margin: 0 0 7px;
					}
					.panel-titulo p {
					font-size: 12px;
					color: #9798a1;
					margin: 0;
					}
					.herramientas {
					display: flex;
					align-items: center;
					flex-wrap: nowrap;
					gap: 9px;
					}
					.buscador {
					display: flex;
					align-items: center;
					background: #111216;
					border: 1px solid #51454c;
					border-radius: 9px;
					width: min(340px, 100%);
					min-width: 0;
					flex: 1 1 240px;
					height: 44px;
					padding: 0 13px;
					}
					.buscador:focus-within {
					border-color: #ff414e;
					box-shadow: 0 0 12px #ff334020;
					}
					.buscador svg {
					flex-shrink: 0;
					color: #a7a7b0;
					}
					.buscador input {
					border: none;
					background: transparent;
					color: white;
					outline: none;
					width: 100%;
					padding: 0 10px;
					font-size: 12px;
					}
					.buscador input::placeholder { color: #898992; }
					.btn-actualizar {
					width: 44px;
					height: 44px;
					padding: 0;
					display: inline-flex;
					align-items: center;
					justify-content: center;
					flex: 0 0 44px;
					color: #e8e8eb;
					background: #211a1f;
					border: 1px solid #60444d;
					border-radius: 9px;
					transition: .2s;
					}
					.btn-actualizar:hover {
					background: #3a2027;
					border-color: #ed4247;
					}
					.tabla-contenedor {
					overflow-x: auto;
					min-height: 240px;
					}
					table {
					border-collapse: collapse;
					width: 100%;
					font-size: 13px;
					}
					thead { background: #1b1b21; }
					th {
					padding: 16px 23px;
					color: #babac4;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: .5px;
					text-align: left;
					white-space: nowrap;
					border-bottom: 1px solid #373035;
					}
					td {
					padding: 16px 23px;
					border-bottom: 1px solid #2c2a30;
					color: #e4e4e9;
					}
					tbody tr { transition: background .15s; }
					tbody tr:hover { background: #25181e; }
					.codigo {
					color: #ffbe42;
					font-weight: 700;
					}
					.nombre {
					color: #fff;
					font-weight: 650;
					}
					.estado {
					display: inline-flex;
					align-items: center;
					gap: 8px;
					border-radius: 30px;
					padding: 6px 12px;
					font-size: 11px;
					font-weight: 700;
					}
					.estado::before {
					content: "";
					width: 6px;
					height: 6px;
					border-radius: 50%;
					background: currentColor;
					}
					.estado.activo {
					background: #103d29;
					border: 1px solid #17643e;
					color: #78ecaa;
					}
					.estado.inactivo {
					background: #40272a;
					border: 1px solid #704147;
					color: #ff8e94;
					}
					.estado.otro {
					background: #403514;
					border: 1px solid #746027;
					color: #ffd274;
					}
					.vacio {
					text-align: center;
					padding: 65px 20px;
					color: #9ea0ab;
					}
					.vacio svg {
					color: #ffb92e;
					margin-bottom: 12px;
					opacity: .8;
					}
					.vacio strong {
					display: block;
					color: #e6e6eb;
					margin-bottom: 7px;
					}
					.vacio p {
					font-size: 12px;
					margin: 0;
					}
					.panel-inferior {
					display: flex;
					justify-content: space-between;
					align-items: center;
					flex-wrap: wrap;
					gap: 10px;
					padding: 16px 25px;
					border-top: 1px solid #34292e;
					font-size: 12px;
					color: #9999a3;
					}
					.total strong { color: #ffbd31; }
					.indicador {
					display: flex;
					align-items: center;
					gap: 8px;
					}
					.punto {
					width: 7px;
					height: 7px;
					background: #ffbd35;
					border-radius: 50%;
					box-shadow: 0 0 10px #ffbd35;
					}
					@media (max-width: 850px) {
					.contenedor { padding: 20px; }
					.panel-superior { padding: 18px; }
					.herramientas { width: 100%; }
					.buscador {
					flex: 1;
					min-width: 0;
					}
					th, td { padding: 14px 13px; }
					.panel-inferior { padding: 16px; }
					}
				
.acciones-modelo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boton-modelo{border:1px solid #65444c;background:#241a20;border-radius:8px;padding:8px 12px;color:#f4f4f5;font-size:12px;font-weight:700}
.boton-modelo:hover{border-color:#ffbd35;background:#35212a}
.boton-modelo.desactivar{border-color:#91434c;color:#ff9ca2}
.boton-modelo:disabled{opacity:.4;cursor:not-allowed}
.mensaje-modelo{padding:12px 25px;color:#ffbd69;font-size:12px;min-height:38px}
.modal-modelo[hidden]{display:none!important}
.modal-modelo{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}
.modal-panel-modelo{width:min(100%,480px);background:linear-gradient(145deg,#21161b,#111115);border:1px solid #81424a;border-radius:16px;padding:26px;box-shadow:0 25px 80px #000a}
.modal-panel-modelo h2{margin:0 0 18px;color:#fff}
.modal-panel-modelo label{display:block;font-size:13px;margin-bottom:8px}
.modal-panel-modelo input{width:100%;padding:13px;background:#101115;border:1px solid #6b444d;border-radius:9px;color:#fff;outline:none}
.modal-acciones-modelo{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.modal-acciones-modelo button{border-radius:9px;padding:11px 17px;font-weight:700}
.modal-guardar-modelo{background:linear-gradient(105deg,#e42739,#ffbd2b);border:0;color:#140b0d}

.boton-modelo.habilitar{border-color:#247e54;color:#91f2bb;background:#11291e}
.boton-modelo.habilitar:hover{border-color:#5fd39a;background:#173b29}
.modal-descripcion-modelo{color:#c1b8bf;font-size:13px;line-height:1.7;margin:0}
.modal-nombre-modelo{color:#ffbd35;font-weight:800}
.modal-confirmar-modelo{background:#9e2533;border:1px solid #f15d69;color:#fff}
.modal-confirmar-modelo.habilitar{background:#155a3b;border-color:#48c78b;color:#e3ffef}

.modal-resultado-modelo{text-align:center;width:min(100%,430px)}
.icono-resultado-modelo{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;margin:0 auto 17px;border:1px solid #318d61;background:#113925;color:#8cf0af;font-size:33px;font-weight:800}
.modal-resultado-modelo h2{margin:0 0 10px}
.modal-resultado-modelo p{color:#c6c3c9;font-size:14px;line-height:1.6;margin:0 0 23px}

.modal-resultado-modelo .modal-guardar-modelo{min-width:120px;cursor:pointer}

.modal-detalles-modelo{width:min(100%,460px)}
.modal-detalles-modelo h2{margin-bottom:24px}
.detalle-fila-modelo{padding:15px 0;border-bottom:1px solid #3d2b33}
.detalle-fila-modelo:first-of-type{padding-top:0}
.detalle-etiqueta-modelo{display:block;color:#a8a3ac;font-size:12px;margin-bottom:8px}
.detalle-valor-modelo{color:#fff;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.modal-detalles-modelo .modal-acciones-modelo{margin-top:24px}
.modal-detalles-modelo .modal-guardar-modelo{min-width:110px;cursor:pointer}
.boton-modelo.ver{border-color:#675277;color:#e4c8ff}
.boton-modelo.ver:hover{background:#30213b;border-color:#ab75d1}
.acciones-modelo{gap:9px;flex-wrap:nowrap}
.acciones-modelo .boton-modelo{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:10px;transition:background .2s,border-color .2s,transform .2s}
.acciones-modelo .boton-modelo svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.acciones-modelo .boton-modelo:hover:not(:disabled){transform:translateY(-2px)}
.acciones-modelo .boton-modelo.ver{color:#62b9ff;border-color:#285f91;background:#0e2234}
.acciones-modelo .boton-modelo.ver:hover{color:#94d2ff;background:#18374f;border-color:#419cdb}
.acciones-modelo .boton-modelo.editar{color:#75e4a4;border-color:#276546;background:#10291d}
.acciones-modelo .boton-modelo.editar:hover{color:#a2f5c1;background:#173d2a;border-color:#43b878}
.acciones-modelo .boton-modelo.desactivar{color:#ff818d;border-color:#81333e;background:#31151d}
.acciones-modelo .boton-modelo.desactivar:hover{color:#ffb0b9;background:#4c1d27;border-color:#ef5366}
.acciones-modelo .boton-modelo.habilitar{color:#74e8ad;border-color:#297d55;background:#102d20}
.acciones-modelo .boton-modelo.habilitar:hover{color:#adffd0;background:#19432e;border-color:#4ac587}
.modal-panel-modelo select{width:100%;padding:13px;background:#101115;border:1px solid #6b444d;border-radius:9px;color:#fff;outline:none}
</style>
			</head>
	<body>
		<main class="contenedor">
			<header class="encabezado">
				<div>
					<div class="etiqueta">AUTOPARTS · ADMINISTRACIÓN</div>
					<h1>
						Gestión de <span>Modelos</span>
					</h1>
				</div>
				<button class="btn-nueva" type="button" id="btnNuevoModelo">
					<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
						<path d="M12 5v14M5 12h14"/>
					</svg>
					Nuevo modelo
				</button>
			</header>

			<section class="panel">
				<div class="panel-superior">
					<div class="panel-titulo">
						<h2>Listado de modelos</h2>
					</div>
					<div class="herramientas">
						<div class="buscador">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
								<circle cx="11" cy="11" r="7"/>
								<path d="m16 16 5 5"/>
							</svg>
							<input id="buscarModelo" type="search" autocomplete="off" placeholder="Buscar modelos..." aria-label="Buscar modelos">
                    </div>
						<button class="btn-actualizar" type="button" id="btnActualizar" title="Actualizar modelos" aria-label="Actualizar modelos">
							<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M20 11a8 8 0 1 0-2 6"/>
								<path d="M20 4v7h-7"/>
							</svg>
						</button>
					</div>
				</div>

				<div id="avisoModelo" class="mensaje-modelo" role="status" aria-live="polite"></div>
                <div class="tabla-contenedor">
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>Nombre</th>
                                <th>Marca</th>
                                <th>Estado</th>
                                <th>Acciones</th>
							</tr>
						</thead>
						<tbody id="modeloRows">
							<tr>
								<td colspan="5">
									<div class="vacio">Cargando modelos...</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<footer class="panel-inferior">
					<div class="total">
						Total de modelos: <strong id="totalModelos">0</strong>
					</div>
					<div class="indicador">
						<span class="punto"></span>
						AutoParts · Gestión de modelos
					</div>
				</footer>
			</section>
		</main>

        <div id="modalEditarModelo" class="modal-modelo" hidden>
<div class="modal-panel-modelo" role="dialog" aria-modal="true" aria-labelledby="tituloEditarModelo">
<h2 id="tituloEditarModelo">Editar modelo</h2>
<form id="formEditarModelo">
<label for="nombreEditarModelo">Nombre del modelo</label>
<input id="nombreEditarModelo" type="text" maxlength="100" required autocomplete="off">
<label for="marcaEditarModelo" style="margin-top:17px">Marca</label>
<select id="marcaEditarModelo" required></select>
<div class="modal-acciones-modelo">
<button type="button" class="boton-modelo" id="cancelarEditarModelo">Cancelar</button>
<button type="submit" class="modal-guardar-modelo" id="guardarEditarModelo">Guardar cambios</button>
</div></form></div></div>
        <div id="modalConfirmarModelo" class="modal-modelo" hidden>
            <div class="modal-panel-modelo" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmarModelo" aria-describedby="descripcionConfirmarModelo">
                <h2 id="tituloConfirmarModelo">Confirmar cambio</h2>
                <p id="descripcionConfirmarModelo" class="modal-descripcion-modelo"></p>
                <div class="modal-acciones-modelo">
                    <button type="button" class="boton-modelo" id="cancelarCambioModelo">Cancelar</button>
                    <button type="button" class="modal-confirmar-modelo" id="confirmarCambioModelo">Confirmar</button>
                </div>
            </div>
        </div>
<div id="modalVerModelo" class="modal-modelo" hidden>
    <div class="modal-panel-modelo modal-detalles-modelo" role="dialog" aria-modal="true" aria-labelledby="tituloVerModelo">
        <h2 id="tituloVerModelo">Detalles del modelo</h2>
        <div class="detalle-fila-modelo">
            <span class="detalle-etiqueta-modelo">Nombre del modelo</span>
            <div class="detalle-valor-modelo" id="verNombreModelo"></div>
        </div>
        <div class="detalle-fila-modelo">
            <span class="detalle-etiqueta-modelo">Marca</span>
            <div class="detalle-valor-modelo" id="verMarcaModelo"></div>
        </div>
        <div class="detalle-fila-modelo">
            <span class="detalle-etiqueta-modelo">Estado</span>
            <span id="verEstadoModelo" class="estado"></span>
        </div>
        <div class="modal-acciones-modelo">
            <button type="button" class="modal-guardar-modelo" id="cerrarVerModelo">Cerrar</button>
        </div>
    </div>
</div>
<div id="modalResultadoModelo" class="modal-modelo" hidden>
    <div class="modal-panel-modelo modal-resultado-modelo" role="dialog" aria-modal="true" aria-labelledby="tituloResultadoModelo" aria-describedby="textoResultadoModelo">
        <div class="icono-resultado-modelo" aria-hidden="true">✓</div>
        <h2 id="tituloResultadoModelo">Operación realizada</h2>
        <p id="textoResultadoModelo"></p>
        <div class="modal-acciones-modelo">
            <button type="button" class="modal-guardar-modelo" id="aceptarResultadoModelo">Aceptar</button>
        </div>
    </div>
</div>
<script>
            'use strict';
            let modelos = [];
            let marcas = [];
            let modeloEditandoId = 0;
            let modeloCambioId = 0;
            let ultimaAccionModelo = '';
            let operacionPendiente = false;
            const $ = id => document.getElementById(id);

            function escapar(valor) {
                return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[caracter]));
            }

            function obtener(objeto, ...nombres) {
                for (const nombre of nombres) {
                    if (objeto && objeto[nombre] !== undefined && objeto[nombre] !== null)
                        return objeto[nombre];
                }
                return '';
            }

            function enviarACSharp(mensaje) {
                if (window.parent !== window) {
                    window.parent.postMessage(mensaje, '*');
                    return true;
                }
                if (window.chrome?.webview?.postMessage) {
                    window.chrome.webview.postMessage(mensaje);
                    return true;
                }
                aviso('Esta pantalla requiere el Dashboard de AutoParts o WebView2.');
                return false;
            }

            function nombreMarca(modelo) {
                const id = Number(obtener(modelo, 'MarcaId', 'marcaId'));
                const marca = marcas.find(m => Number(obtener(m, 'MarcaId', 'marcaId')) === id);
                return String(obtener(marca, 'Nombre', 'nombre') || ('Marca #' + id));
            }

            function opcionesMarca(seleccionado) {
                const lista = marcas.filter(m => Number(obtener(m, 'EstadoId', 'estadoId')) === 1 ||
                    Number(obtener(m, 'MarcaId', 'marcaId')) === seleccionado);
                $('marcaEditarModelo').innerHTML = '<option value="">Selecciona una marca</option>' +
                    lista.map(m => `<option value="${Number(obtener(m, 'MarcaId', 'marcaId'))}">${escapar(obtener(m, 'Nombre', 'nombre'))}</option>`).join('');
                $('marcaEditarModelo').value = String(seleccionado);
            }

            function aviso(texto) {
                $('avisoModelo').textContent = texto || '';
            }

            function mostrarResultadoModelo(titulo, texto) {
                $('tituloResultadoModelo').textContent = titulo;
                $('textoResultadoModelo').textContent = texto;
                $('modalResultadoModelo').hidden = false;
                $('aceptarResultadoModelo').focus();
            }

            function cerrarResultadoModelo() {
                $('modalResultadoModelo').hidden = true;
            }

            function mostrarMensaje(texto) {
                $('modeloRows').innerHTML = '<tr><td colspan="5"><div class="vacio"><strong>' +
                    escapar(texto) + '</strong></div></td></tr>';
            }

            function pintarModelos() {
                const texto = $('buscarModelo').value.trim().toLocaleLowerCase('es');
                const filtrados = modelos.filter(modelo => {
                    const id = obtener(modelo, 'ModeloId', 'modeloId');
                    const nombre = obtener(modelo, 'Nombre', 'nombre');
                    const estado = Number(obtener(modelo, 'EstadoId', 'estadoId'));
                    return [id, nombre, nombreMarca(modelo), estado === 1 ? 'activo' : 'inactivo']
                        .some(valor => String(valor).toLocaleLowerCase('es').includes(texto));
                });
                $('totalModelos').textContent = String(filtrados.length);
                if (!filtrados.length) {
                    mostrarMensaje(texto ? 'No se encontraron coincidencias.' : 'No hay modelos registrados.');
                    return;
                }
                $('modeloRows').innerHTML = filtrados.map(modelo => {
                    const id = Number(obtener(modelo, 'ModeloId', 'modeloId'));
                    const nombre = obtener(modelo, 'Nombre', 'nombre');
                    const estado = Number(obtener(modelo, 'EstadoId', 'estadoId'));
                    const activo = estado === 1;
                    return `<tr>
                        <td class="codigo">#${escapar(id)}</td>
                        <td class="nombre">${escapar(nombre)}</td>
                        <td>${escapar(nombreMarca(modelo))}</td>
                        <td><span class="estado ${activo ? 'activo' : 'inactivo'}">${activo ? 'Activo' : 'Inactivo'}</span></td>
                        <td><div class="acciones-modelo">
                            <button type="button" class="boton-modelo ver" data-ver="${id}" title="Ver detalles" aria-label="Ver detalles de ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                            <button type="button" class="boton-modelo editar" data-editar="${id}" title="Editar modelo" aria-label="Editar ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button>
                            <button type="button" class="boton-modelo ${activo ? 'desactivar' : 'habilitar'}" data-cambiar-estado="${id}" title="${activo ? 'Eliminar (desactivar)' : 'Habilitar'}" aria-label="${activo ? 'Eliminar' : 'Habilitar'} ${escapar(nombre)}" >${activo ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6"/><path d="M10 10v7M14 10v7"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'}</button>
                        </div></td>
                    </tr>`;
                }).join('');
            }

            function solicitarModelos() {
                aviso('');
                mostrarMensaje('Cargando modelos...');
                enviarACSharp({ type: 'modelos:selectAll' });
                enviarACSharp({ type: 'marcas:selectAll' });
            }

            function abrirVerModelo(id) {
                const modelo = modelos.find(x => Number(obtener(x, 'ModeloId', 'modeloId')) === id);
                if (!modelo || operacionPendiente) return;
                const estado = Number(obtener(modelo, 'EstadoId', 'estadoId'));
                $('verNombreModelo').textContent = String(obtener(modelo, 'Nombre', 'nombre'));
                $('verMarcaModelo').textContent = nombreMarca(modelo);
                const etiqueta = $('verEstadoModelo');
                etiqueta.textContent = estado === 1 ? 'Activo' : estado === 2 ? 'Inactivo' : 'Desconocido';
                etiqueta.className = 'estado ' + (estado === 1 ? 'activo' : estado === 2 ? 'inactivo' : 'otro');
                $('modalVerModelo').hidden = false;
                $('cerrarVerModelo').focus();
            }

            function cerrarVerModelo() {
                $('modalVerModelo').hidden = true;
            }

            function abrirEditor(id) {
                const modelo = modelos.find(x => Number(obtener(x, 'ModeloId', 'modeloId')) === id);
                if (!modelo || operacionPendiente) return;
                modeloEditandoId = id;
                $('nombreEditarModelo').value = String(obtener(modelo, 'Nombre', 'nombre'));
                opcionesMarca(Number(obtener(modelo, 'MarcaId', 'marcaId')));
                $('modalEditarModelo').hidden = false;
                $('nombreEditarModelo').focus();
            }

            function cerrarEditor() {
                $('modalEditarModelo').hidden = true;
                modeloEditandoId = 0;
            }

            function abrirConfirmacionModelo(id) {
                const modelo = modelos.find(x => Number(obtener(x, 'ModeloId', 'modeloId')) === id);
                if (!modelo || operacionPendiente) return;
                const activo = Number(obtener(modelo, 'EstadoId', 'estadoId')) === 1;
                modeloCambioId = id;
                const accion = activo ? 'desactivar' : 'habilitar';
                $('tituloConfirmarModelo').textContent = activo ? '¿Eliminar modelo?' : '¿Habilitar modelo?';
                $('descripcionConfirmarModelo').textContent = activo
                    ? `¿Seguro que deseas desactivar el modelo "${obtener(modelo, 'Nombre', 'nombre')}"?`
                    : `¿Seguro que deseas habilitar el modelo "${obtener(modelo, 'Nombre', 'nombre')}"?`;
                $('confirmarCambioModelo').textContent = activo ? 'Sí, desactivar' : 'Sí, habilitar';
                $('confirmarCambioModelo').classList.toggle('habilitar', !activo);
                $('modalConfirmarModelo').hidden = false;
                $('cancelarCambioModelo').focus();
            }

            function cerrarConfirmacionModelo() {
                if (operacionPendiente) return;
                $('modalConfirmarModelo').hidden = true;
                modeloCambioId = 0;
            }

            function cambiarEstadoModelo() {
                if (operacionPendiente || modeloCambioId <= 0) return;
                const modelo = modelos.find(x => Number(obtener(x, 'ModeloId', 'modeloId')) === modeloCambioId);
                if (!modelo) return;
                const activo = Number(obtener(modelo, 'EstadoId', 'estadoId')) === 1;
                const id = modeloCambioId;
                $('modalConfirmarModelo').hidden = true;
                modeloCambioId = 0;
                operacionPendiente = true;
                ultimaAccionModelo = activo ? 'desactivar' : 'habilitar';
                aviso(activo ? 'Desactivando modelo...' : 'Habilitando modelo...');
                if (!enviarACSharp({ type: 'modelos:desactivarIntegrado', data: { ModeloId: id } })) {
                    operacionPendiente = false;
                }
            }

            function recibirRespuesta(evento) {
                if (evento.source && window.parent !== window && evento.source !== window.parent) return;
                let mensaje = evento.data;
                if (typeof mensaje === 'string') {
                    try { mensaje = JSON.parse(mensaje); } catch { return; }
                }
                if (!mensaje || typeof mensaje !== 'object') return;
                if (mensaje.type === 'marcas:list') {
                    marcas = Array.isArray(mensaje.data) ? mensaje.data : [];
                    pintarModelos();
                    return;
                }
                if (mensaje.type === 'modelos:list') {
                    modelos = Array.isArray(mensaje.data) ? mensaje.data : [];
                    pintarModelos();
                    return;
                }
                if (mensaje.type === 'modelos:actualizada' || mensaje.type === 'modelos:desactivada') {
                    const accion = mensaje.type === 'modelos:actualizada' ? 'actualizar' : ultimaAccionModelo;
                    operacionPendiente = false;
                    ultimaAccionModelo = '';
                    $('guardarEditarModelo').disabled = false;
                    cerrarEditor();
                    solicitarModelos();
                    const titulo = accion === 'actualizar' ? 'Modelo actualizado' :
                        accion === 'habilitar' ? 'Modelo habilitado' : 'Modelo desactivado';
                    const texto = accion === 'actualizar' ? 'El modelo se actualizó correctamente.' :
                        accion === 'habilitar' ? 'El modelo se habilitó correctamente.' :
                        'El modelo se desactivó correctamente.';
                    mostrarResultadoModelo(titulo, texto);
                    return;
                }
                if (mensaje.type === 'modelos:error' || mensaje.type === 'error') {
                    operacionPendiente = false;
                    $('guardarEditarModelo').disabled = false;
                    aviso(mensaje.message || 'No se pudo completar la operación.');
                }
            }

            $('modeloRows').addEventListener('click', evento => {
                const ver = evento.target.closest('[data-ver]');
                const editar = evento.target.closest('[data-editar]');
                const cambiar = evento.target.closest('[data-cambiar-estado]');
                if (ver) abrirVerModelo(Number(ver.dataset.ver));
                if (editar) abrirEditor(Number(editar.dataset.editar));
                if (cambiar) abrirConfirmacionModelo(Number(cambiar.dataset.cambiarEstado));
            });
            $('formEditarModelo').addEventListener('submit', evento => {
                evento.preventDefault();
                if (operacionPendiente || modeloEditandoId <= 0) return;
                const nombre = $('nombreEditarModelo').value.trim();
                if (!nombre || nombre.length > 100) {
                    aviso('Ingresa un nombre de 1 a 100 caracteres.');
                    return;
                }
                const original = modelos.find(x => Number(obtener(x, 'ModeloId', 'modeloId')) === modeloEditandoId);
                const marcaId = Number($('marcaEditarModelo').value);
                if (!Number.isInteger(marcaId) || marcaId <= 0 || !marcas.some(m =>
                    Number(obtener(m, 'MarcaId', 'marcaId')) === marcaId && Number(obtener(m, 'EstadoId', 'estadoId')) === 1)) {
                    aviso('Selecciona una marca activa.');
                    return;
                }
                if (!original) { aviso('No se encontró el modelo.'); return; }
                operacionPendiente = true;
                ultimaAccionModelo = 'actualizar';
                $('guardarEditarModelo').disabled = true;
                aviso('Guardando cambios...');
                if (!enviarACSharp({
                    type: 'modelos:actualizarIntegrado',
                    data: { ModeloId: modeloEditandoId, MarcaId: marcaId, Nombre: nombre }
                })) {
                    operacionPendiente = false;
                    $('guardarEditarModelo').disabled = false;
                }
            });
            $('cerrarVerModelo').addEventListener('click', cerrarVerModelo);
            $('cancelarEditarModelo').addEventListener('click', cerrarEditor);
            $('aceptarResultadoModelo').addEventListener('click', cerrarResultadoModelo);
            $('cancelarCambioModelo').addEventListener('click', cerrarConfirmacionModelo);
            $('confirmarCambioModelo').addEventListener('click', cambiarEstadoModelo);
            $('btnNuevoModelo').addEventListener('click', () => enviarACSharp({ type: 'modelos:abrirNuevo' }));
            $('btnActualizar').addEventListener('click', solicitarModelos);
            $('buscarModelo').addEventListener('input', pintarModelos);
            window.addEventListener('message', recibirRespuesta);
            if (window.chrome?.webview?.addEventListener)
                window.chrome.webview.addEventListener('message', recibirRespuesta);
            solicitarModelos();
        </script>
	</body>
</html>
