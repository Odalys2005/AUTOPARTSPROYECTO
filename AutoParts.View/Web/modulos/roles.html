<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>AutoParts | Roles</title>
				<style>
					:root { color-scheme: dark; }
					* { box-sizing: border-box; }
					body {
					margin: 0;
					min-height: 100vh;
					color: #f5f5f7;
					font-family: 'Segoe UI', Arial, sans-serif;
					background: radial-gradient(ellipse at 95% 0%, rgba(136, 16, 25, 0.18), transparent 38%), #090a0d;
					}
					button, input { font: inherit; }
					button { cursor: pointer; }
					.contenedor {
					max-width: 1500px;
					margin: auto;
					padding: 35px;
					}
					.encabezado {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 20px;
					margin-bottom: 30px;
					}
					.etiqueta {
					display: flex;
					align-items: center;
					gap: 9px;
					color: #ffbd37;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: 3px;
					margin-bottom: 12px;
					}
					h1 {
					margin: 0;
					font-size: clamp(28px, 3vw, 39px);
					font-weight: 800;
					letter-spacing: -1px;
					}
					h1 span { color: #ffbd2e; }
					.subtitulo {
					color: #a9aab3;
					font-size: 13px;
					margin-top: 9px;
					line-height: 1.6;
					}
					.btn-nueva {
					display: flex;
					align-items: center;
					justify-content: center;
					gap: 10px;
					padding: 14px 20px;
					border: 1px solid #ff6053;
					border-radius: 10px;
					background: linear-gradient(110deg, #b10b1f, #e52a37, #ffac28);
					color: #fff;
					font-size: 13px;
					font-weight: 750;
					box-shadow: 0 0 18px rgba(233, 31, 48, 0.27), inset 0 1px 1px #ffffff30;
					transition: transform .2s, filter .2s;
					}
					.btn-nueva:hover {
					transform: translateY(-2px);
					filter: brightness(1.12);
					}
					.panel {
					border: 1px solid #4d3038;
					border-radius: 15px;
					background: linear-gradient(140deg, #171519, #0d0e11 65%, #140f12);
					box-shadow: 0 12px 35px #0005, inset 0 0 18px #0004;
					overflow: hidden;
					}
					.panel-superior {
					display: flex;
					align-items: center;
					justify-content: space-between;
					flex-wrap: wrap;
					gap: 16px;
					padding: 23px 25px;
					border-bottom: 1px solid #34292e;
					}
					.panel-titulo h2 {
					font-size: 18px;
					margin: 0 0 7px;
					}
					.panel-titulo p {
					font-size: 12px;
					color: #9798a1;
					margin: 0;
					}
					.herramientas {
					display: flex;
					align-items: center;
					flex-wrap: nowrap;
					gap: 9px;
					}
					.buscador {
					display: flex;
					align-items: center;
					background: #111216;
					border: 1px solid #51454c;
					border-radius: 9px;
					width: min(340px, 100%);
					min-width: 0;
					flex: 1 1 240px;
					height: 44px;
					padding: 0 13px;
					}
					.buscador:focus-within {
					border-color: #ff414e;
					box-shadow: 0 0 12px #ff334020;
					}
					.buscador svg {
					flex-shrink: 0;
					color: #a7a7b0;
					}
					.buscador input {
					border: none;
					background: transparent;
					color: white;
					outline: none;
					width: 100%;
					padding: 0 10px;
					font-size: 12px;
					}
					.buscador input::placeholder { color: #898992; }
					.btn-actualizar {
					width: 44px;
					height: 44px;
					padding: 0;
					display: inline-flex;
					align-items: center;
					justify-content: center;
					flex: 0 0 44px;
					color: #e8e8eb;
					background: #211a1f;
					border: 1px solid #60444d;
					border-radius: 9px;
					transition: .2s;
					}
					.btn-actualizar:hover {
					background: #3a2027;
					border-color: #ed4247;
					}
					.tabla-contenedor {
					overflow-x: auto;
					min-height: 240px;
					}
					table {
					border-collapse: collapse;
					width: 100%;
					font-size: 13px;
					}
					thead { background: #1b1b21; }
					th {
					padding: 16px 23px;
					color: #babac4;
					font-size: 11px;
					font-weight: 700;
					letter-spacing: .5px;
					text-align: left;
					white-space: nowrap;
					border-bottom: 1px solid #373035;
					}
					td {
					padding: 16px 23px;
					border-bottom: 1px solid #2c2a30;
					color: #e4e4e9;
					}
					tbody tr { transition: background .15s; }
					tbody tr:hover { background: #25181e; }
					.codigo {
					color: #ffbe42;
					font-weight: 700;
					}
					.nombre {
					color: #fff;
					font-weight: 650;
					}
					.estado {
					display: inline-flex;
					align-items: center;
					gap: 8px;
					border-radius: 30px;
					padding: 6px 12px;
					font-size: 11px;
					font-weight: 700;
					}
					.estado::before {
					content: "";
					width: 6px;
					height: 6px;
					border-radius: 50%;
					background: currentColor;
					}
					.estado.activo {
					background: #103d29;
					border: 1px solid #17643e;
					color: #78ecaa;
					}
					.estado.inactivo {
					background: #40272a;
					border: 1px solid #704147;
					color: #ff8e94;
					}
					.estado.otro {
					background: #403514;
					border: 1px solid #746027;
					color: #ffd274;
					}
					.vacio {
					text-align: center;
					padding: 65px 20px;
					color: #9ea0ab;
					}
					.vacio svg {
					color: #ffb92e;
					margin-bottom: 12px;
					opacity: .8;
					}
					.vacio strong {
					display: block;
					color: #e6e6eb;
					margin-bottom: 7px;
					}
					.vacio p {
					font-size: 12px;
					margin: 0;
					}
					.panel-inferior {
					display: flex;
					justify-content: space-between;
					align-items: center;
					flex-wrap: wrap;
					gap: 10px;
					padding: 16px 25px;
					border-top: 1px solid #34292e;
					font-size: 12px;
					color: #9999a3;
					}
					.total strong { color: #ffbd31; }
					.indicador {
					display: flex;
					align-items: center;
					gap: 8px;
					}
					.punto {
					width: 7px;
					height: 7px;
					background: #ffbd35;
					border-radius: 50%;
					box-shadow: 0 0 10px #ffbd35;
					}
					@media (max-width: 850px) {
					.contenedor { padding: 20px; }
					.panel-superior { padding: 18px; }
					.herramientas { width: 100%; }
					.buscador {
					flex: 1;
					min-width: 0;
					}
					th, td { padding: 14px 13px; }
					.panel-inferior { padding: 16px; }
					}
				
.acciones-rol{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boton-rol{border:1px solid #65444c;background:#241a20;border-radius:8px;padding:8px 12px;color:#f4f4f5;font-size:12px;font-weight:700}
.boton-rol:hover{border-color:#ffbd35;background:#35212a}

.modal-detalles-rol .modal-acciones-rol{margin-top:24px}
.modal-detalles-rol .modal-guardar-rol{min-width:110px;cursor:pointer}
.boton-rol.ver{border-color:#675277;color:#e4c8ff}
.boton-rol.ver:hover{background:#30213b;border-color:#ab75d1}
.acciones-rol{gap:9px;flex-wrap:nowrap}
.acciones-rol .boton-rol{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:10px;transition:background .2s,border-color .2s,transform .2s}
.acciones-rol .boton-rol svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

.acciones-rol .boton-rol.ver{color:#62b9ff;border-color:#285f91;background:#0e2234}
.acciones-rol .boton-rol.ver:hover{color:#94d2ff;background:#18374f;border-color:#419cdb}
.acciones-rol .boton-rol.editar{color:#75e4a4;border-color:#276546;background:#10291d}
.acciones-rol .boton-rol.editar:hover{color:#a2f5c1;background:#173d2a;border-color:#43b878}
.acciones-rol .boton-rol.desactivar{color:#ff818d;border-color:#81333e;background:#31151d}
.acciones-rol .boton-rol.desactivar:hover{color:#ffb0b9;background:#4c1d27;border-color:#ef5366}

.acciones-rol .boton-rol.habilitar:hover{color:#adffd0;background:#19432e;border-color:#4ac587}
</style>
			</head>
	<body>
		<main class="contenedor">
			<header class="encabezado">
				<div>
					<div class="etiqueta">AUTOPARTS · ADMINISTRACIÓN</div>
					<h1>
						Gestión de <span>Roles</span>
					</h1>
				</div>
				<button class="btn-nueva" type="button" id="btnNuevoRol">
					<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
						<path d="M12 5v14M5 12h14"/>
					</svg>
					Nuevo rol
				</button>
			</header>

			<section class="panel">
				<div class="panel-superior">
					<div class="panel-titulo">
						<h2>Listado de roles</h2>
					</div>
					<div class="herramientas">
						<div class="buscador">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
								<circle cx="11" cy="11" r="7"/>
								<path d="m16 16 5 5"/>
							</svg>
							<input id="buscarRol" type="search" autocomplete="off" placeholder="Buscar roles..." aria-label="Buscar roles">
                    </div>
						<button class="btn-actualizar" type="button" id="btnActualizar" title="Actualizar roles" aria-label="Actualizar roles">
							<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M20 11a8 8 0 1 0-2 6"/>
								<path d="M20 4v7h-7"/>
							</svg>
						</button>
					</div>
				</div>

				<div id="avisoRol" class="mensaje-rol" role="status" aria-live="polite"></div>
                <div class="tabla-contenedor">
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>Nombre</th>
                                <th>Estado</th>
                                <th>Acciones</th>
							</tr>
						</thead>
						<tbody id="rolRows">
							<tr>
								<td colspan="4">
									<div class="vacio">Cargando roles...</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<footer class="panel-inferior">
					<div class="total">
						Total de roles: <strong id="totalRoles">0</strong>
					</div>
					<div class="indicador">
						<span class="punto"></span>
						AutoParts · Gestión de roles
					</div>
				</footer>
			</section>
		</main>

        <div id="modalEditarRol" class="modal-rol" hidden>
<div class="modal-panel-rol" role="dialog" aria-modal="true" aria-labelledby="tituloEditarRol">
<h2 id="tituloEditarRol">Editar rol</h2>
<form id="formEditarRol">
<label for="nombreEditarRol">Nombre del rol</label>
<input id="nombreEditarRol" type="text" maxlength="100" required autocomplete="off">
<div class="modal-acciones-rol">
<button type="button" class="boton-rol" id="cancelarEditarRol">Cancelar</button>
<button type="submit" class="modal-guardar-rol" id="guardarEditarRol">Guardar cambios</button>
</div></form></div></div>
        <div id="modalConfirmarRol" class="modal-rol" hidden>
            <div class="modal-panel-rol" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmarRol" aria-describedby="descripcionConfirmarRol">
                <h2 id="tituloConfirmarRol">Confirmar cambio</h2>
                <p id="descripcionConfirmarRol" class="modal-descripcion-rol"></p>
                <div class="modal-acciones-rol">
                    <button type="button" class="boton-rol" id="cancelarCambioRol">Cancelar</button>
                    <button type="button" class="modal-confirmar-rol" id="confirmarCambioRol">Confirmar</button>
                </div>
            </div>
        </div>
<div id="modalVerRol" class="modal-rol" hidden>
    <div class="modal-panel-rol modal-detalles-rol" role="dialog" aria-modal="true" aria-labelledby="tituloVerRol">
        <h2 id="tituloVerRol">Detalles del rol</h2>
        <div class="detalle-fila-rol">
            <span class="detalle-etiqueta-rol">Nombre del rol</span>
            <div class="detalle-valor-rol" id="verNombreRol"></div>
        </div>
        <div class="detalle-fila-rol">
            <span class="detalle-etiqueta-rol">Estado</span>
            <span id="verEstadoRol" class="estado"></span>
        </div>
        <div class="modal-acciones-rol">
            <button type="button" class="modal-guardar-rol" id="cerrarVerRol">Cerrar</button>
        </div>
    </div>
</div>
<div id="modalResultadoRol" class="modal-rol" hidden>
    <div class="modal-panel-rol modal-resultado-rol" role="dialog" aria-modal="true" aria-labelledby="tituloResultadoRol" aria-describedby="textoResultadoRol">
        <div class="icono-resultado-rol" aria-hidden="true">✓</div>
        <h2 id="tituloResultadoRol">Operación realizada</h2>
        <p id="textoResultadoRol"></p>
        <div class="modal-acciones-rol">
            <button type="button" class="modal-guardar-rol" id="aceptarResultadoRol">Aceptar</button>
        </div>
    </div>
</div>
<script>
            'use strict';
            let roles = [];
            let rolEditandoId = 0;
            let rolCambioId = 0;
            let ultimaAccionRol = '';
            let operacionPendiente = false;
            const $ = id => document.getElementById(id);

            function escapar(valor) {
                return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[caracter]));
            }

            function obtener(objeto, ...nombres) {
                for (const nombre of nombres) {
                    if (objeto && objeto[nombre] !== undefined && objeto[nombre] !== null)
                        return objeto[nombre];
                }
                return '';
            }

            function enviarACSharp(mensaje) {
                if (window.parent !== window) {
                    window.parent.postMessage(mensaje, '*');
                    return true;
                }
                if (window.chrome?.webview?.postMessage) {
                    window.chrome.webview.postMessage(mensaje);
                    return true;
                }
                aviso('Esta pantalla requiere el Dashboard de AutoParts o WebView2.');
                return false;
            }

            function aviso(texto) {
                $('avisoRol').textContent = texto || '';
            }

            function mostrarResultadoRol(titulo, texto) {
                $('tituloResultadoRol').textContent = titulo;
                $('textoResultadoRol').textContent = texto;
                $('modalResultadoRol').hidden = false;
                $('aceptarResultadoRol').focus();
            }

            function cerrarResultadoRol() {
                $('modalResultadoRol').hidden = true;
            }

            function mostrarMensaje(texto) {
                $('rolRows').innerHTML = '<tr><td colspan="4"><div class="vacio"><strong>' +
                    escapar(texto) + '</strong></div></td></tr>';
            }

            function pintarRoles() {
                const texto = $('buscarRol').value.trim().toLocaleLowerCase('es');
                const filtrados = roles.filter(rol => {
                    const id = obtener(rol, 'RolId', 'rolId');
                    const nombre = obtener(rol, 'Nombre', 'nombre');
                    const estado = Number(obtener(rol, 'EstadoId', 'estadoId'));
                    return [id, nombre, estado === 1 ? 'activo' : 'inactivo']
                        .some(valor => String(valor).toLocaleLowerCase('es').includes(texto));
                });
                $('totalRoles').textContent = String(filtrados.length);
                if (!filtrados.length) {
                    mostrarMensaje(texto ? 'No se encontraron coincidencias.' : 'No hay roles registrados.');
                    return;
                }
                $('rolRows').innerHTML = filtrados.map(rol => {
                    const id = Number(obtener(rol, 'RolId', 'rolId'));
                    const nombre = obtener(rol, 'Nombre', 'nombre');
                    const estado = Number(obtener(rol, 'EstadoId', 'estadoId'));
                    const activo = estado === 1;
                    return `<tr>
                        <td class="codigo">#${escapar(id)}</td>
                        <td class="nombre">${escapar(nombre)}</td>
                        <td><span class="estado ${activo ? 'activo' : 'inactivo'}">${activo ? 'Activo' : 'Inactivo'}</span></td>
                        <td><div class="acciones-rol">
                            <button type="button" class="boton-rol ver" data-ver="${id}" title="Ver detalles" aria-label="Ver detalles de ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                            <button type="button" class="boton-rol editar" data-editar="${id}" title="Editar rol" aria-label="Editar ${escapar(nombre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button>
                            <button type="button" class="boton-rol ${activo ? 'desactivar' : 'habilitar'}" data-cambiar-estado="${id}" title="${activo ? 'Eliminar (desactivar)' : 'Habilitar'}" aria-label="${activo ? 'Eliminar' : 'Habilitar'} ${escapar(nombre)}" ${activo && id === 1 ? 'disabled' : ''}>${activo ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6"/><path d="M10 10v7M14 10v7"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'}</button>
                        </div></td>
                    </tr>`;
                }).join('');
            }

            function solicitarRoles() {
                aviso('');
                mostrarMensaje('Cargando roles...');
                enviarACSharp({ type: 'roles:selectAll' });
            }

            function abrirVerRol(id) {
                const rol = roles.find(x => Number(obtener(x, 'RolId', 'rolId')) === id);
                if (!rol || operacionPendiente) return;
                const estado = Number(obtener(rol, 'EstadoId', 'estadoId'));
                $('verNombreRol').textContent = String(obtener(rol, 'Nombre', 'nombre'));
                const etiqueta = $('verEstadoRol');
                etiqueta.textContent = estado === 1 ? 'Activo' : estado === 2 ? 'Inactivo' : 'Desconocido';
                etiqueta.className = 'estado ' + (estado === 1 ? 'activo' : estado === 2 ? 'inactivo' : 'otro');
                $('modalVerRol').hidden = false;
                $('cerrarVerRol').focus();
            }

            function cerrarVerRol() {
                $('modalVerRol').hidden = true;
            }

            function abrirEditor(id) {
                const rol = roles.find(x => Number(obtener(x, 'RolId', 'rolId')) === id);
                if (!rol || operacionPendiente) return;
                rolEditandoId = id;
                $('nombreEditarRol').value = String(obtener(rol, 'Nombre', 'nombre'));
                $('modalEditarRol').hidden = false;
                $('nombreEditarRol').focus();
            }

            function cerrarEditor() {
                $('modalEditarRol').hidden = true;
                rolEditandoId = 0;
            }

            function abrirConfirmacionRol(id) {
                const rol = roles.find(x => Number(obtener(x, 'RolId', 'rolId')) === id);
                if (!rol || operacionPendiente) return;
                const activo = Number(obtener(rol, 'EstadoId', 'estadoId')) === 1;
                if (activo && id === 1) {
                    aviso('No se puede desactivar el rol administrador principal.');
                    return;
                }
                rolCambioId = id;
                const accion = activo ? 'desactivar' : 'habilitar';
                $('tituloConfirmarRol').textContent = activo ? '¿Eliminar rol?' : '¿Habilitar rol?';
                $('descripcionConfirmarRol').textContent = activo
                    ? `¿Seguro que deseas desactivar el rol "${obtener(rol, 'Nombre', 'nombre')}"?`
                    : `¿Seguro que deseas habilitar el rol "${obtener(rol, 'Nombre', 'nombre')}"?`;
                $('confirmarCambioRol').textContent = activo ? 'Sí, desactivar' : 'Sí, habilitar';
                $('confirmarCambioRol').classList.toggle('habilitar', !activo);
                $('modalConfirmarRol').hidden = false;
                $('cancelarCambioRol').focus();
            }

            function cerrarConfirmacionRol() {
                if (operacionPendiente) return;
                $('modalConfirmarRol').hidden = true;
                rolCambioId = 0;
            }

            function cambiarEstadoRol() {
                if (operacionPendiente || rolCambioId <= 0) return;
                const rol = roles.find(x => Number(obtener(x, 'RolId', 'rolId')) === rolCambioId);
                if (!rol) return;
                const activo = Number(obtener(rol, 'EstadoId', 'estadoId')) === 1;
                if (activo && rolCambioId === 1) return;
                const id = rolCambioId;
                $('modalConfirmarRol').hidden = true;
                rolCambioId = 0;
                operacionPendiente = true;
                ultimaAccionRol = activo ? 'desactivar' : 'habilitar';
                aviso(activo ? 'Desactivando rol...' : 'Habilitando rol...');
                if (!enviarACSharp({ type: 'roles:desactivarIntegrado', data: { RolId: id } })) {
                    operacionPendiente = false;
                }
            }

            function recibirRespuesta(evento) {
                if (evento.source && window.parent !== window && evento.source !== window.parent) return;
                let mensaje = evento.data;
                if (typeof mensaje === 'string') {
                    try { mensaje = JSON.parse(mensaje); } catch { return; }
                }
                if (!mensaje || typeof mensaje !== 'object') return;
                if (mensaje.type === 'roles:list') {
                    roles = Array.isArray(mensaje.data) ? mensaje.data : [];
                    pintarRoles();
                    return;
                }
                if (mensaje.type === 'roles:actualizada' || mensaje.type === 'roles:desactivada') {
                    const accion = mensaje.type === 'roles:actualizada' ? 'actualizar' : ultimaAccionRol;
                    operacionPendiente = false;
                    ultimaAccionRol = '';
                    $('guardarEditarRol').disabled = false;
                    cerrarEditor();
                    solicitarRoles();
                    const titulo = accion === 'actualizar' ? 'Rol actualizado' :
                        accion === 'habilitar' ? 'Rol habilitado' : 'Rol desactivado';
                    const texto = accion === 'actualizar' ? 'El rol se actualizó correctamente.' :
                        accion === 'habilitar' ? 'El rol se habilitó correctamente.' :
                        'El rol se desactivó correctamente.';
                    mostrarResultadoRol(titulo, texto);
                    return;
                }
                if (mensaje.type === 'roles:error' || mensaje.type === 'error') {
                    operacionPendiente = false;
                    $('guardarEditarRol').disabled = false;
                    aviso(mensaje.message || 'No se pudo completar la operación.');
                }
            }

            $('rolRows').addEventListener('click', evento => {
                const ver = evento.target.closest('[data-ver]');
                const editar = evento.target.closest('[data-editar]');
                const cambiar = evento.target.closest('[data-cambiar-estado]');
                if (ver) abrirVerRol(Number(ver.dataset.ver));
                if (editar) abrirEditor(Number(editar.dataset.editar));
                if (cambiar) abrirConfirmacionRol(Number(cambiar.dataset.cambiarEstado));
            });
            $('formEditarRol').addEventListener('submit', evento => {
                evento.preventDefault();
                if (operacionPendiente || rolEditandoId <= 0) return;
                const nombre = $('nombreEditarRol').value.trim();
                if (!nombre || nombre.length > 100) {
                    aviso('Ingresa un nombre de 1 a 100 caracteres.');
                    return;
                }
                const original = roles.find(x => Number(obtener(x, 'RolId', 'rolId')) === rolEditandoId);
                if (!original) { aviso('No se encontró el rol.'); return; }
                operacionPendiente = true;
                ultimaAccionRol = 'actualizar';
                $('guardarEditarRol').disabled = true;
                aviso('Guardando cambios...');
                if (!enviarACSharp({
                    type: 'roles:actualizarIntegrado',
                    data: { RolId: rolEditandoId, Nombre: nombre }
                })) {
                    operacionPendiente = false;
                    $('guardarEditarRol').disabled = false;
                }
            });
            $('cerrarVerRol').addEventListener('click', cerrarVerRol);
            $('cancelarEditarRol').addEventListener('click', cerrarEditor);
            $('aceptarResultadoRol').addEventListener('click', cerrarResultadoRol);
            $('cancelarCambioRol').addEventListener('click', cerrarConfirmacionRol);
            $('confirmarCambioRol').addEventListener('click', cambiarEstadoRol);
            $('btnNuevoRol').addEventListener('click', () => enviarACSharp({ type: 'roles:abrirNuevo' }));
            $('btnActualizar').addEventListener('click', solicitarRoles);
            $('buscarRol').addEventListener('input', pintarRoles);
            window.addEventListener('message', recibirRespuesta);
            if (window.chrome?.webview?.addEventListener)
                window.chrome.webview.addEventListener('message', recibirRespuesta);
            solicitarRoles();
        </script>
	</body>
</html>
