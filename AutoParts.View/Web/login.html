<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
			<title>AutoParts - Categorías</title>

			<style>    

				body {
				background: #171717;
				color: white;
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 40px;
				}

				.contenedor {
				background: #292929;
				padding: 30px;
				border-radius: 18px;
				border-top: 5px solid #ffcc00;
				max-width: 950px;
				margin: auto;
				}

				h1 {
				color: #ffcc00;
				text-align: center;
				}

				table {
				width: 100%;
				border-collapse: collapse;
				margin-top: 25px;
				}

				th {
				background: #d62828;
				padding: 15px;
				text-align: left;
				}

				td {
				padding: 13px;
				border-bottom: 1px solid #444;
				}

				tr:hover {
				background: #383838;
				}
			</style>
		</head>

	<body>
		<div class="contenedor">
			<h1>AUTOPARTS</h1>
			<h2>Lista de categorías</h2>

			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>Nombre</th>
						<th>Estado ID</th>
					</tr>
				</thead>

				<tbody id="tablaCategorias">
					<tr>
						<td colspan="3">
							Cargando categorías...
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<script>
			function mostrarCategorias(categorias) {
			const tabla = document.getElementById("tablaCategorias");

			tabla.innerHTML = "";

			if (categorias.length === 0) {
			const fila = tabla.insertRow();
			const celda = fila.insertCell();
			celda.colSpan = 3;
			celda.textContent = "No hay categorías registradas";
			return;
			}

			categorias.forEach(categoria => {
			const fila = tabla.insertRow();

			fila.insertCell().textContent = categoria.CategoriaId;
			fila.insertCell().textContent = categoria.Nombre;
			fila.insertCell().textContent = categoria.EstadoId;
			});
			}
		</script>
	</body>
</html>
